<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ===== Web Audio 合成音效 ===== */
let audioCtx = null;
function playTone(f, t, d, isMuted = false) {
  if (isMuted) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = t;
    o.frequency.setValueAtTime(f, audioCtx.currentTime);
    g.gain.setValueAtTime(0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + d);
  } catch(e){}
}

/* ===== 洒落金粉彩纸动画 ===== */
function fireConfetti() {
  const colors = ['#ff9aa2', '#ffb7b2', '#ffdac1', '#e2f0cb', '#b5ead7', '#ff5252', '#ffd700'];
  for (let i = 0; i < 35; i++) { 
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = '-10px';
    el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (Math.random() * 0.6 + 0.4) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }
}

/* ===== 常用假名与混淆常量 ===== */
const HIRAGANA_FULL = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽっょゅゃ";
const KATAKANA_FULL = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポッョュャー";
const KANA_FULL = HIRAGANA_FULL;

/* ===== 智能假名读音混淆生成算法 ===== */
function generateSmartKanaOptions(correctKana, allKanaList = []) {
  if (!correctKana) return ["あ", "い", "う", "え"];
  const options = new Set([correctKana]);
  
  // 1. 尝试促音混淆（添加或移除促音「っ」）
  if (correctKana.includes("っ")) {
    options.add(correctKana.replace(/っ/g, ""));
  } else if (correctKana.length >= 3) {
    options.add(correctKana.slice(0, 1) + "っ" + correctKana.slice(1));
  }

  // 2. 尝试长音混淆（添加或移除长音）
  if (/[うおいえあー]/.test(correctKana) && correctKana.length >= 3) {
    options.add(correctKana.slice(0, -1));
  } else {
    options.add(correctKana + "う");
  }

  // 3. 浊音/清音/半浊音混淆
  const dakuonMap = {
    'か':'が','が':'か','き':'ぎ','ぎ':'き','く':'ぐ','ぐ':'く','け':'げ','げ':'け','こ':'ご','ご':'こ',
    'さ':'ざ','ざ':'さ','し':'じ','じ':'し','す':'ず','ず':'す','せ':'ぜ','ぜ':'せ','そ':'ぞ','ぞ':'そ',
    'た':'だ','だ':'た','ち':'ぢ','ぢ':'ち','つ':'づ','づ':'つ','て':'で','der':'て','と':'ど','ど':'と',
    'は':'ば','ば':'ぱ','ぱ':'は','ひ':'び','び':'ぴ','ぴ':'ひ','ふ':'ぶ','ぶ':'ぷ','ぷ':'ふ',
    'へ':'べ','べ':'ぺ','ぺ':'へ','ほ':'ぼ','ぼ':'ぽ','ぽ':'ほ'
  };
  for (let i = 0; i < correctKana.length; i++) {
    const char = correctKana[i];
    if (dakuonMap[char]) {
      const swapped = correctKana.slice(0, i) + dakuonMap[char] + correctKana.slice(i + 1);
      options.add(swapped);
      if (options.size >= 4) break;
    }
  }

  // 4. 从当前组其他真实单词假名中补充
  if (Array.isArray(allKanaList)) {
    const shuffledKana = [...allKanaList].sort(() => Math.random() - 0.5);
    for (const kana of shuffledKana) {
      if (kana && kana !== correctKana) {
        options.add(kana);
      }
      if (options.size >= 4) break;
    }
  }

  // 5. 保底生成（形近假名替换）
  while (options.size < 4) {
    const idx = Math.floor(Math.random() * correctKana.length);
    const randChar = KANA_FULL[Math.floor(Math.random() * KANA_FULL.length)];
    const fake = correctKana.slice(0, idx) + randChar + correctKana.slice(idx + 1);
    if (fake !== correctKana) options.add(fake);
  }

  return Array.from(options).slice(0, 4).sort(() => Math.random() - 0.5);
}

/* ===== 智能中文释义图文混淆生成算法（严格局限于本轮学习单词集） ===== */
function generateSmartMeaningOptions(correctWord, currentRoundWords = []) {
  if (!correctWord) return [];
  const correctMeaning = typeof correctWord === "object" ? correctWord.meaning : correctWord;
  const correctImg = typeof correctWord === "object" ? correctWord.imageUrl : null;
  
  const map = new Map();
  map.set(correctMeaning, {
    meaning: correctMeaning,
    imageUrl: correctImg || null,
    id: (typeof correctWord === "object" ? correctWord.id : null) || correctMeaning
  });
  
  // 1. 严格只从本轮学习单词集（studyWords）中提取混淆项
  const otherRoundWords = (currentRoundWords || [])
    .filter(w => w && w.meaning && w.meaning !== correctMeaning)
    .sort(() => Math.random() - 0.5);
  
  for (const w of otherRoundWords) {
    if (!map.has(w.meaning)) {
      map.set(w.meaning, {
        meaning: w.meaning,
        imageUrl: w.imageUrl || null,
        id: w.id || w.meaning
      });
    }
    if (map.size >= 4) break;
  }

  // 2. 仅当本轮学习单词总数极少（不足4个）时保底补充
  if (map.size < 4) {
    const fallbackList = [
      { meaning: "水", imageUrl: null },
      { meaning: "时间", imageUrl: null },
      { meaning: "朋友", imageUrl: null },
      { meaning: "天气", imageUrl: null }
    ];
    for (const f of fallbackList) {
      if (!map.has(f.meaning)) {
        map.set(f.meaning, {
          meaning: f.meaning,
          imageUrl: f.imageUrl,
          id: f.meaning
        });
      }
      if (map.size >= 4) break;
    }
  }

  return Array.from(map.values()).slice(0, 4).sort(() => Math.random() - 0.5);
}

/* ===== 学生进度本地强缓存与双向智能合并机制 ===== */
function mergeStudentProgress(baseStudent, localCache) {
  if (!baseStudent) return localCache || null;
  if (!localCache) return baseStudent;

  const merged = { ...baseStudent };
  if (!merged.password && localCache.password) {
    merged.password = localCache.password;
  }
  
  // 1. 合并 progress (常规关卡)
  const baseProgress = baseStudent.progress || {};
  const localProgress = localCache.progress || {};
  const allGroupKeys = new Set([...Object.keys(baseProgress), ...Object.keys(localProgress)]);
  const mergedProgress = {};

  allGroupKeys.forEach(k => {
    const bp = baseProgress[k] || {};
    const lp = localProgress[k] || {};
    mergedProgress[k] = {
      ...bp,
      ...lp,
      stars: Math.max(Number(bp.stars || 0), Number(lp.stars || 0)),
      score: Math.max(Number(bp.score || 0), Number(lp.score || 0)),
      completedSubLevels: Math.max(Number(bp.completedSubLevels || 0), Number(lp.completedSubLevels || 0)),
      totalSubLevels: bp.totalSubLevels || lp.totalSubLevels || 0,
      completed_at: lp.completed_at || bp.completed_at || null
    };
  });
  merged.progress = mergedProgress;

  // 2. 合并 cycleProgress (周期关卡)
  const baseCycle = baseStudent.cycleProgress || {};
  const localCycle = localCache.cycleProgress || {};
  const allCycleKeys = new Set([...Object.keys(baseCycle), ...Object.keys(localCycle)]);
  const mergedCycle = {};

  allCycleKeys.forEach(ck => {
    const bc = baseCycle[ck] || {};
    const lc = localCycle[ck] || {};
    mergedCycle[ck] = {
      ...bc,
      ...lc,
      completedLevels: Math.max(Number(bc.completedLevels || 0), Number(lc.completedLevels || 0)),
      completed_at: lc.completed_at || bc.completed_at || null
    };
  });
  merged.cycleProgress = mergedCycle;

  // 3. 合并 gameProfile
  const baseGP = baseStudent.gameProfile || {};
  const localGP = localCache.gameProfile || {};
  merged.gameProfile = {
    ...baseGP,
    ...localGP,
    totalMedals: Math.max(Number(baseGP.totalMedals || 0), Number(localGP.totalMedals || 0)),
    chapterRecords: { ...(baseGP.chapterRecords || {}), ...(localGP.chapterRecords || {}) },
    wordMastery: { ...(baseGP.wordMastery || {}), ...(localGP.wordMastery || {}) },
    achievements: { ...(baseGP.achievements || {}), ...(localGP.achievements || {}) }
  };

  return merged;
}

function saveStudentProgressToLocal(storageKey, student) {
  if (!student || !student.username) return;
  try {
    const existing = JSON.parse(localStorage.getItem(storageKey) || "{}");
    const updated = {
      ...existing,
      [student.username.toLowerCase()]: {
        password: student.password || existing[student.username.toLowerCase()]?.password || "",
        progress: student.progress,
        cycleProgress: student.cycleProgress,
        gameProfile: student.gameProfile,
        updatedAt: Date.now()
      }
    };
    localStorage.setItem(storageKey, JSON.stringify(updated));
  } catch(e) {}
}

function getStudentProgressFromLocal(storageKey, username) {
  if (!username) return null;
  try {
    const existing = JSON.parse(localStorage.getItem(storageKey) || "{}");
    return existing[username.toLowerCase()] || null;
  } catch(e) {
    return null;
  }
}

/* ===== API 接口常量 ===== */
const CLOUD_SYNC_BASE = "https://sync.nekosensei.cn/classtango";
const DEFAULT_SYNC_GROUP_ID = "classtango";
const WORDS_PER_SUBLEVEL = 10;

// 小关词量以 10 为目标，优先让每关落在 7～12 词；再均匀分配
const getSubLevelCount = (wordCount) => {
  const total = Math.max(0, Number(wordCount) || 0);
  if (!total) return 0;
  const candidates = Array.from({ length: Math.ceil(total / 6) }, (_, index) => index + 1);
  const preferred = candidates.filter(count => {
    const average = total / count;
    return average >= 7 && average <= 12;
  });
  const pool = preferred.length ? preferred : candidates;
  return pool.reduce((best, count) => Math.abs(total / count - 10) < Math.abs(total / best - 10) ? count : best, pool[0]);
};

const getSubLevelBounds = (wordCount, subLevelIndex) => {
  const total = Math.max(0, Number(wordCount) || 0);
  const count = getSubLevelCount(total);
  if (!count || subLevelIndex < 1 || subLevelIndex > count) return { start: 0, end: 0, total: count };
  const baseSize = Math.floor(total / count);
  const extra = total % count;
  const start = (subLevelIndex - 1) * baseSize + Math.min(subLevelIndex - 1, extra);
  const size = baseSize + (subLevelIndex <= extra ? 1 : 0);
  return { start, end: start + size, total: count };
};

const sanitizeGroupId = (value) => {
  const raw = String(value ?? "").trim();
  if (!raw) return DEFAULT_SYNC_GROUP_ID;
  return raw.replace(/[\u0000-\u001F\u007F]/g, "").slice(0, 160) || DEFAULT_SYNC_GROUP_ID;
};

const parseGroupIdFromUrl = () => {
  try {
    const params = new URLSearchParams(window.location.search);
    const g = params.get("group") || params.get("group_id") || params.get("gid");
    if (g) return sanitizeGroupId(g);
  } catch(e) {}
  return DEFAULT_SYNC_GROUP_ID;
};

const cloudUrl = (groupId, scope = "") => {
  const url = new URL(CLOUD_SYNC_BASE);
  url.searchParams.set("group", sanitizeGroupId(groupId));
  if (scope) url.searchParams.set("scope", scope);
  return url.toString();
};

const unwrapCloudPayload = (response) => {
  const payload = response?.data ?? response?.payload ?? response;
  return payload && typeof payload === "object" && !Array.isArray(payload) ? payload : {};
};

const requestJson = async (url, options = {}, timeoutMs = 10000) => {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const response = await fetch(url, { ...options, signal: controller.signal });
    const text = await response.text();
    let data = null;
    if (text) {
      try { data = JSON.parse(text); } catch (e) { data = { raw: text }; }
    }
    if (!response.ok) {
      throw new Error((data && (data.message || data.error)) || `请求失败（${response.status}）`);
    }
    return data || {};
  } finally {
    clearTimeout(timer);
  }
};

function App() {
  const groupId = useRef(parseGroupIdFromUrl()).current;
  const authStorageKey = useRef(`classtango_student_auth_${groupId}`).current;
  const studentProgressKey = useRef(`classtango_student_progress_${groupId}`).current;
  const legacyAuthStorageKey = groupId === DEFAULT_SYNC_GROUP_ID ? "classtango_student_auth_default" : null;
  
  // 视图控制: login | set_pwd | lobby | study | study_summary | game | result
  const [view, setView] = useState("login");
  const [isLoading, setIsLoading] = useState(true);
  const [initError, setInitError] = useState(null);
  
  // 全局静音控制（支持学校自习课/安静环境使用）
  const [isMuted, setIsMuted] = useState(() => {
    try { return localStorage.getItem("classtango_muted") === "true"; } catch(e) { return false; }
  });
  const toggleMute = () => {
    setIsMuted(prev => {
      const next = !prev;
      try { localStorage.setItem("classtango_muted", String(next)); } catch(e){}
      return next;
    });
  };

  const soundEffects = {
    click: () => playTone(950, 'sine', 0.08, isMuted),
    correct: () => {
      playTone(523.25, 'sine', 0.15, isMuted);

          ? updatedStudent
          : s
      );

        ...remotePayload,
        group_id: targetGid,
        last_updated: now,
        synced_at: now,
        students: finalStudents
      };

        setStudentsPayload(previous => ({ ...(previous || {}), ...payloadToPush }));

      previous.errors[errorType] = Number(previous.errors[errorType] || 0) + 1;
      previous.errorCount += 1;

      // 错题打乱插入到后续未答题目队列中（间隔重复，不原地重做）
      const retryQuestion = {
        data: word,
        type: currentQ.type,
        isRetryVariant: true
      };

      setGameWords(prev => {
        const nextList = [...prev];
        const unattemptedStart = wordIndex + 1;
        const remainingCount = nextList.length - unattemptedStart;

        if (remainingCount <= 1) {
          // 若后续题目不足，直接追加到队尾
          nextList.push(retryQuestion);
        } else {
          // 随机插入到后续未答题目之间，制造自然间隔
          const insertOffset = Math.floor(Math.random() * remainingCount) + 1;
          const targetIndex = Math.min(unattemptedStart + insertOffset, nextList.length);
          nextList.splice(targetIndex, 0, retryQuestion);
        }
        return nextList;
      });

      sessionRef.current.wordStats[key] = previous;
    }

    // 直接显示温和的即时正误对比卡（无剧烈震动/闪屏）
    setErrorFeedback({
      word,
      errorType,
      userChoice,
      correctChoice: correctChoice || (errorType === "reading" ? word.kana : errorType === "meaning" ? word.meaning : word.kana)
    });
  };

  // 通关结算（基于学生标签及教师设定的及格达标分进行分层通关判定与学情统计）
  const handleLevelComplete = async () => {
    const session = sessionRef.current;
    const finalScore = score;
    
    // 1. 获取当前学生的等级标签与教师设定的达标及格线
    const studentTag = String(currentUser?.tag || "").trim().toUpperCase();
    const passingScoresConfig = studentsPayload?.challengeSettings?.passingScoresByTag || {};
    const configuredThreshold = Number(passingScoresConfig[studentTag]);
    const defaultThreshold = Number(passingScoresConfig.default);
    const requiredPassingScore = Number.isFinite(configuredThreshold) && configuredThreshold > 0
      ? configuredThreshold
      : (studentTag === "A" ? 90 : studentTag === "B" ? 80 : studentTag === "C" ? 60 : (Number.isFinite(defaultThreshold) && defaultThreshold > 0 ? defaultThreshold : 80));

    // 2. 判定本次是否成功达标通关
    const isPassed = finalScore >= requiredPassingScore;
    const medal = isPassed ? (finalScore >= 90 ? "gold" : finalScore >= 80 ? "silver" : "bronze") : "unpassed";
    const medalIcon = isPassed ? (medal === "gold" ? "🏆" : medal === "silver" ? "🏅" : "🥉") : "⚠️";
    const starsEarned = isPassed ? (medal === "gold" ? 3 : medal === "silver" ? 2 : 1) : 0;
    const rescuedCount = Object.keys(session.wordStats).length;
    const firstTryRate = session.normalCount ? session.firstTryCorrect / session.normalCount : 0;
    const scoreDiff = Math.max(0, requiredPassingScore - finalScore);
    const mistakeWordsList = Array.from(new Set(Object.values(session.wordStats).map(s => s.word))).filter(Boolean);

    setResultSummary({
      score: finalScore,
      firstTryRate,
      medal,
      medalIcon,
      starsEarned,
      rescuedCount,
      firstTryCorrect: session.firstTryCorrect,
      total: session.normalCount,
      isPassed,
      requiredPassingScore,
      studentTag,
      scoreDiff,
      mistakeWords: mistakeWordsList
    });

    if (isPassed) {
      cheer(
        medal === "gold" ? "٩(ˊᗜˋ*)و" : medal === "silver" ? "(๑•̀ㅂ•́)و✧" : "(｡･ω･｡)",
        medal === "gold" ? "太强了！斩获金杯！" : medal === "silver" ? "很棒！斩获银杯！" : "恭喜达标！顺利通关！",
        "cheer"
      );
    } else {
      cheer("(╯﹏╰)", `差一点就达标啦！还差 ${scoreDiff} 分，复习错词后再战一次吧！`, "cheer");
    }

    // 3. 构建本关通关后的最新本地进度对象
    const prevGroupProg = currentUser?.progress?.[activeGroupKey] || {};
    const oldSubLevelsMap = prevGroupProg.subLevelsCleared || {};
    const existingSubRec = activeSubLevel ? oldSubLevelsMap[activeSubLevel.index] : null;

    // 若本次达标，或者之前已经通关过，保持通关记录；若本次未达标且之前未通关，记录为未达标重测态
    const nextSubStatus = isPassed
      ? { medal, score: Math.max(Number(existingSubRec?.score || 0), finalScore), isPassed: true, completedAt: Date.now() }
      : (existingSubRec?.isPassed ? existingSubRec : { medal: "unpassed", score: finalScore, isPassed: false, completedAt: null });

    const newSubLevelsMap = activeSubLevel
      ? { ...oldSubLevelsMap, [activeSubLevel.index]: nextSubStatus }
      : oldSubLevelsMap;
    
    // 计算已成功达标通关的小关总数
    const completedSubCount = activeSubLevel
      ? Object.values(newSubLevelsMap).filter(item => item && item.isPassed).length
      : Number(prevGroupProg.completedSubLevels || 0);
    const totalSubCount = activeSubLevel?.total || prevGroupProg.totalSubLevels || 1;

    const updatedProgress = {
      ...(currentUser?.progress || {}),
      ...(!activeCycle ? {
        [activeGroupKey]: {
          ...prevGroupProg,
          stars: Math.max(Number(prevGroupProg.stars || 0), starsEarned),
          score: Math.max(Number(prevGroupProg.score || 0), finalScore),
          subLevelsCleared: newSubLevelsMap,
          completedSubLevels: completedSubCount,
          totalSubLevels: totalSubCount,
          completed_at: completedSubCount >= totalSubCount ? (prevGroupProg.completed_at || Date.now()) : null
        }
      } : {})
    };

    const prevCycleProg = currentUser?.cycleProgress?.[activeCycle?.id] || {};
    const updatedCycleProgress = {
      ...(currentUser?.cycleProgress || {}),
      ...(activeCycle ? {
        [activeCycle.id]: {
          ...prevCycleProg,
          completedLevels: isPassed ? Math.max(Number(prevCycleProg.completedLevels || 0), Number(activeCycle.level || 1)) : Number(prevCycleProg.completedLevels || 0),
          completed_at: isPassed ? (prevCycleProg.completed_at || Date.now()) : null
        }
      } : {})
    };

    const recordKey = activeCycle
      ? `cycle_${activeCycle.id}_${activeCycle.level}`
      : `${activeGroupKey}_sub_${activeSubLevel?.index || 1}`;
    const previousRecord = currentUser?.gameProfile?.chapterRecords?.[recordKey] || {};
    const previousRank = { unpassed: 0, bronze: 1, silver: 2, gold: 3 };
    const bestMedal = (previousRank[previousRecord.bestMedal] || 0) > previousRank[medal] ? previousRecord.bestMedal : medal;
    const oldAchievements = currentUser?.gameProfile?.achievements || {};
    const achievements = {
      ...oldAchievements,
      ...(isPassed ? {
        first_clear: oldAchievements.first_clear || { earnedAt: Date.now() },
        ...(medal === "gold" ? { gold_clear: oldAchievements.gold_clear || { earnedAt: Date.now() } } : {}),
        ...(rescuedCount > 0 ? { rescue_complete: oldAchievements.rescue_complete || { earnedAt: Date.now() } } : {})
      } : {})
    };

    const updatedGameProfile = {
      ...(currentUser?.gameProfile || {}),
      achievements,
      totalMedals: Number(currentUser?.gameProfile?.totalMedals || 0) + (isPassed && !previousRecord.bestMedal ? 1 : 0),
      chapterRecords: {
        ...(currentUser?.gameProfile?.chapterRecords || {}),
        [recordKey]: {
          ...previousRecord,
          bestMedal,
          bestScore: Math.max(Number(previousRecord.bestScore || 0), finalScore),
          bestFirstTryRate: Math.max(Number(previousRecord.bestFirstTryRate || 0), firstTryRate),
          attempts: Number(previousRecord.attempts || 0) + 1,
          lastMedal: medal,
          isPassed: isPassed || !!previousRecord.isPassed,
          completedAt: isPassed ? Date.now() : (previousRecord.completedAt || null)
        }
      },
      wordMastery: Object.entries(session.wordStats).reduce((all, [k, stat]) => ({
        ...all,
        [k]: {
          ...(all[k] || {}),
          readingErrors: Number(all[k]?.readingErrors || 0) + Number(stat.errors.reading || 0),
          meaningErrors: Number(all[k]?.meaningErrors || 0) + Number(stat.errors.meaning || 0),
          spellingErrors: Number(all[k]?.spellingErrors || 0) + Number(stat.errors.spelling || 0),
          dueAt: Date.now() + 24 * 60 * 60 * 1000,
          updatedAt: Date.now()
        }
      }), { ...(currentUser?.gameProfile?.wordMastery || {}) })
    };

    const localSavedStudent = {
      ...currentUser,
      progress: updatedProgress,
      cycleProgress: updatedCycleProgress,
      gameProfile: updatedGameProfile
    };

    // 4. 立即写入本地缓存与内存 state
    saveStudentProgressToLocal(studentProgressKey, localSavedStudent);
    setCurrentUser(localSavedStudent);

    // 5. 异步静默同步到云端服务器
    try {
      const savedStudent = await updateStudentInCloud(currentUser.id, remoteStudent => {
        return mergeStudentProgress(remoteStudent, localSavedStudent);
      });
      if (savedStudent) {
        const finalStudent = mergeStudentProgress(savedStudent, localSavedStudent);
        saveStudentProgressToLocal(studentProgressKey, finalStudent);
        setCurrentUser(finalStudent);
      }
    } catch(err) {
      console.warn("成绩已在本地安全存档，云端后台同步稍后重试：", err.message);
    }
    
    setView("result");
  };

  // 退出大厅
  const handleExitToLobby = () => {

              />

            <input

              onKeyDown={e => e.key === "Enter" && handleSetPassword()}
              placeholder="请输入您好记的新密码"
              style={{ width: "100%", padding: 12, border: "1.5px solid var(--border)", borderRadius: 10, outline: "none", fontSize: 14, marginBottom: 14, textAlign: "center" }}
            />
            <button
              onClick={handleSetPassword}

            >
              确认密码并登入
            </button>
          </div>
        </div>
      )}

      {/* 视图 3：关卡大厅 */}
      {view === "lobby" && (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", height: "100%" }}>
          <header style={{ flexShrink: 0, background: "#fff", borderBottom: "1.5px solid var(--border)", padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontSize: 15, fontWeight: 800 }}>{currentUser?.name}</div>
              <div style={{ fontSize: 10, color: "var(--muted)" }}>{currentUser?.campus} · {currentUser?.grade}级{currentUser?.class_name}班</div>
            </div>
            <button
              onClick={() => {
                setView("login");
                setCurrentUser(null);
                setUsernameInput("");
                setPasswordInput("");
                try {
                  localStorage.removeItem(authStorageKey);
                  if (legacyAuthStorageKey) localStorage.removeItem(legacyAuthStorageKey);
                } catch(e){}
              }}
              style={{ background: "transparent", border: `1px solid var(--border)`, padding: "4px 8px", borderRadius: 8, fontSize: 11, cursor: "pointer", marginRight: 32 }}
            >
              退出
            </button>
          </header>
          
          <div style={{ flex: 1, overflowY: "auto", padding: "16px 14px" }}>
            <div style={{ background: "#fff", border: "1.5px solid var(--border)", borderRadius: 14, padding: "12px 14px", marginBottom: 14, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <div style={{ fontSize: 11, color: "var(--muted)", fontWeight: 800 }}>🏅 我的荣誉墙</div>
                <div style={{ fontSize: 13, marginTop: 2, color: "var(--text)" }}>
                  已收集 {currentUser?.gameProfile?.totalMedals || 0} 枚奖章

              </div>
              <div style={{ fontSize: 18, letterSpacing: 2 }}>
                {currentUser?.gameProfile?.achievements?.gold_clear ? "🏆" : "🔒"}

            <h3 style={{ fontSize: 14, fontWeight: 800, color: "var(--muted)", margin: "0 0 12px 4px" }}>🗺️ 单词闯关路线图</h3>
            {(() => {

              return (

                  <div style={{ fontSize: 11, fontWeight: 800, color: "var(--primary)" }}>本周期任务</div>

                  {completed < Number(cycle.targetLevels) ? (
                    <button

                      style={{ background: "var(--primary)", color: "#fff", border: "none", padding: "8px 16px", borderRadius: 10, fontWeight: 800, fontSize: 13, cursor: "pointer" }}

            })()}
            
            {getVisibleGroups().length > 0 ? (

                {getVisibleGroups().map((g, idx) => {

                  const totalSubLevels = getSubLevelCount(activeWords.length);
                  const completedSubLevels = Math.min(Number(scoreInfo?.completedSubLevels || 0), totalSubLevels);
                  const isExpanded = expandedGroupKey === key || (expandedGroupKey === null && idx === 0 && unlocked);

                  return (

                </>
              ) : (
                <>
                  <button
                    onClick={() => startStudyLevel(activeGroupKey, sessionRef.current.originalWords || gameWords.map(w => w.data), activeCycle, activeSubLevel)}
                    style={{ background: "#fff", border: "1.5px solid var(--border)", color: "var(--text)", padding: "11px 18px", borderRadius: 24, fontSize: 13, fontWeight: 700, cursor: "pointer" }}
                  >
                    🔄 再次挑战
                  </button>
                  <button
                    onClick={handleExitToLobby}
                    style={{ background: "var(--primary)", color: "#fff", border: "none", padding: "11px 24px", borderRadius: 24, fontSize: 13, fontWeight: 800, cursor: "pointer", boxShadow: "0 4px 12px rgba(200,64,45,0.2)" }}
                  >
                    返回路线图
                  </button>
                </>
              )}
            </div>
          </div>
        </div>
      )}
      
    </div>
  );
}

const rootElement = document.getElementById("root");
if (ReactDOM.createRoot) {
  ReactDOM.createRoot(rootElement).render(<App/>);
} else {
  ReactDOM.render(<App/>, rootElement);
}
</script>
</body>
</html>
