    doc.className += " reduced-motion";

  if (!Object.assign) {
    Object.assign = function (target) {
      if (target == null) throw new TypeError("Cannot convert undefined or null to object");
      var to = Object(target);
      for (var i = 1; i < arguments.length; i++) {
        var source = arguments[i];
        if (source != null) {
          for (var key in source) {
            if (Object.prototype.hasOwnProperty.call(source, key)) to[key] = source[key];
          }
        }
      }
      return to;
    };
  }
  if (!Object.fromEntries) {
    Object.fromEntries = function (entries) {
      var obj = {};
      for (var i = 0; i < entries.length; i++) obj[entries[i][0]] = entries[i][1];
      return obj;
    };
  }
  if (!Array.prototype.includes) {
    Array.prototype.includes = function (search, start) {
      return this.indexOf(search, start || 0) !== -1;
    };
  }
  if (!Array.from) {
    Array.from = function (arrayLike) {
      return Array.prototype.slice.call(arrayLike);
    };
  }
  if (!String.prototype.startsWith) {
    String.prototype.startsWith = function (search, pos) {
      return this.substr(pos || 0, search.length) === search;
    };

    String.prototype.trim = function () {
      return this.replace(/^\s+|\s+$/g, "");

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ===== HELPERS ===== */
// 汉字拼音首字母简易判定算法 ( localeCompare 驱动)
function getSingleCharInitial(char) {
  if (/[a-zA-Z0-9]/.test(char)) return char.toLowerCase();
  if (char < "\u4e00" || char > "\u9fa5") return "";
  
  const boundaries = [
    { char: '啊', letter: 'a' }, { char: '芭', letter: 'b' }, { char: '擦', letter: 'c' },
    { char: '搭', letter: 'd' }, { char: '蛾', letter: 'e' }, { char: '发', letter: 'f' },
    { char: '噶', letter: 'g' }, { char: '哈', letter: 'h' }, { char: '击', letter: 'j' },
    { char: '喀', letter: 'k' }, { char: '垃', letter: 'l' }, { char: '妈', letter: 'm' },
    { char: '拿', letter: 'n' }, { char: '哦', letter: 'o' }, { char: '啪', letter: 'p' },
    { char: '期', letter: 'q' }, { char: '然', letter: 'r' }, { char: '撒', letter: 's' },
    { char: '塌', letter: 't' }, { char: '挖', letter: 'w' }, { char: '昔', letter: 'x' },
    { char: '压', letter: 'y' }, { char: '匝', letter: 'z' }
  ];
  
  for (let i = boundaries.length - 1; i >= 0; i--) {
    if (char.localeCompare(boundaries[i].char, 'zh') >= 0) {
      // 包含生僻或非多音字基本覆盖
      return boundaries[i].letter;
    }
  }
  return 'z';
}

function getPinyinInitials(str) {
  if (!str) return "";
  return str.split("").map(getSingleCharInitial).join("");
}

function makeClassKey(campus, grade, className) {
  return [campus, grade, className].map(v => String(v || "").trim()).join("|");
}

function makeUsername(campus, name, grade, className, classSeq = "") {
  const c_py = getPinyinInitials(campus);
  const n_py = getPinyinInitials(name);
  const g_num = (String(grade).match(/\d+/) || [""])[0];
  const c_char = (String(className).match(/[a-zA-Z]+/) || [""])[0].toLowerCase();
  const seq = classSeq ? String(classSeq).padStart(2, "0") : "";
  return (c_py + g_num + c_char + seq + n_py).toLowerCase();
}

function ensureUniqueUsername(baseUsername, seen) {
  const base = String(baseUsername || "student").trim().toLowerCase().replace(/[^a-z0-9]/g, "") || "student";
  let finalUsername = base;
  let count = 2;
  while (seen.has(finalUsername)) {
    finalUsername = `${base}${String(count++).padStart(2, "0")}`;
  }
  seen.add(finalUsername);
  return finalUsername;
}

const gid = () => Math.random().toString(36).substr(2, 9);
const shuffle = (a) => {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
};

const POS_OPTIONS = ["名詞","動詞","い形容詞","な形容詞","副詞","接続詞","感動詞","助詞","連体詞","代名詞","その他"];
const EMPTY_WORD = { kana:"", kanji:"", accent:"", pos:"名詞", meaning:"", usage:"", examples:[{ja:"",cn:""}], imageUrl:"", hidden:false };
const EXCEL_HEADERS = ["假名","汉字","声调","词性","中文释义","用法说明","例句1日文","例句1中文","例句2日文","例句2中文","例句3日文","例句3中文","图片URL","是否隐藏"];
const EXCEL_TEMPLATE_ROWS = [
  { kana:"たまご", kanji:"卵", accent:"2", pos:"名詞", meaning:"鸡蛋", usage:"日常食材，可做主菜或配料", examples:[{ja:"朝ごはんに卵を食べます。",cn:"早餐吃鸡蛋。"},{ja:"卵はいくつありますか。",cn:"有几个鸡蛋？"}], imageUrl:"https://images.unsplash.com/photo-1518569656558-1f25e69d93d7?w=400&h=260&fit=crop", hidden:false },
  { kana:"あたらしい", kanji:"新しい", accent:"4", pos:"い形容詞", meaning:"新的", usage:"い形容词，修饰名词时直接接名词", examples:[{ja:"新しい本を買いました。",cn:"买了新书。"},{ja:"この教室は新しいです。",cn:"这间教室是新的。"}], imageUrl:"", hidden:false },
];
const getCell = (row, key) => String(row[key] ?? "").trim();
const parseHiddenFlag = (v) => /^(是|true|yes|y|1|隐藏)$/i.test(String(v ?? "").trim());
const cleanAccent = (v) => {
  const s = String(v ?? "").trim();
  if (!s) return "";
  return /^(\d+|[⓪①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]+)$/.test(s) ? s : "";
};
const cleanPos = (v) => {
  const s = String(v ?? "").trim();
  return s || "名詞";
};
const cleanImageUrl = (v) => {
  const s = String(v ?? "").trim();
  return /^https?:\/\//i.test(s) ? s : "";
};
const wordToExcelRow = (w) => {
  const ex = Array.isArray(w.examples) ? w.examples : [];
  return {
    "假名": w.kana || "",
    "汉字": w.kanji || "",
    "声调": w.accent || "",
    "词性": w.pos || "名詞",
    "中文释义": w.meaning || "",
    "用法说明": w.usage || "",
    "例句1日文": ex[0]?.ja || "",
    "例句1中文": ex[0]?.cn || "",
    "例句2日文": ex[1]?.ja || "",
    "例句2中文": ex[1]?.cn || "",
    "例句3日文": ex[2]?.ja || "",
    "例句3中文": ex[2]?.cn || "",
    "图片URL": w.imageUrl || "",
    "是否隐藏": w.hidden ? "是" : "否",
  };
};
const excelRowToWord = (row, rowNumber) => {
  const kana = getCell(row, "假名");
  const meaning = getCell(row, "中文释义");
  if (!kana) return { skipped:true, silent:true, rowNumber, reason:"假名为空" };
  if (!meaning) return { skipped:true, rowNumber, reason:"中文释义为空" };
  const examples = [1,2,3].map(i => ({ ja:getCell(row, `例句${i}日文`), cn:getCell(row, `例句${i}中文`) }))
    .filter(e => e.ja || e.cn);
  return {
    word: {
      id: gid(),
      kana,
      kanji: getCell(row, "汉字"),
      accent: cleanAccent(row["声调"]),
      pos: cleanPos(row["词性"]),
      meaning,
      usage: getCell(row, "用法说明"),
      examples: examples.length ? examples : [{ja:"",cn:""}],
      imageUrl: cleanImageUrl(row["图片URL"]),
      hidden: parseHiddenFlag(row["是否隐藏"]),
    }
  };
};
const safeSheetName = (name, used = new Set()) => {
  const base = String(name || "单词组").replace(/[\\/?*[\]:]/g, "-").slice(0, 31) || "单词组";
  let finalName = base;
  let n = 2;
  while (used.has(finalName)) {
    const suffix = `_${n++}`;
    finalName = base.slice(0, 31 - suffix.length) + suffix;
  }
  used.add(finalName);
  return finalName;
};
const todayStamp = () => {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
};
const CLOUD_SYNC_BASE = "https://sync.nekosensei.cn/classtango";
const LEGACY_STORAGE_KEY = "jp_vocab_v1";
const DEFAULT_SYNC_GROUP_ID = "classtango";
const sanitizeGroupId = (value) => {
  const raw = String(value ?? "").trim();
  if (!raw) return DEFAULT_SYNC_GROUP_ID;
  // 保留中文等合法班级名。URLSearchParams 会负责 URL 编码；旧逻辑会把纯中文
  // 班名降级为默认房间，导致不同班级意外共用同一份云端数据。
  return raw.replace(/[\u0000-\u001F\u007F]/g, "").slice(0, 160) || DEFAULT_SYNC_GROUP_ID;
};
const parseGroupIdFromUrl = () => {
  try {
    const params = new URLSearchParams(window.location.search);
    const g = params.get("group") || params.get("group_id") || params.get("gid");
    if (g) return sanitizeGroupId(g);
  } catch (e) {}
  return DEFAULT_SYNC_GROUP_ID;
};
const syncUrlGroupId = (groupId) => {
  // 网页内部操作，不再改写或修改 URL 地址栏后缀，实现纯裸链接运行
};
const cloneGroups = (groups) => JSON.parse(JSON.stringify(Array.isArray(groups) ? groups : []));
const makeDataSnapshot = (groups, categories, tombstones) => JSON.stringify({
  categories: Array.isArray(categories) ? categories : [],
  groups: Array.isArray(groups) ? groups : [],
  tombstones: tombstones || { groups: {}, words: {} },
});
const DEFAULT_WORD_SET_CATEGORIES = ["必修系列", "选择性必修", "高考专项", "未分类"];
const LAST_IMPORT_CATEGORY_KEY = "classtango_last_import_category";
const normalizeCategoryName = (name) => String(name || "").trim() || "未分类";
const inferWordSetCategory = (group) => {
  if (group && group.category) return normalizeCategoryName(group.category);
  const name = String(group?.name || "");
  if (/选择性必修|选必/.test(name)) return "选择性必修";
  if (/高考|专项|速刷|听力|作文|语法|阅读/.test(name)) return "高考专项";
  if (/必修|第\s*\d+\s*[課课]/.test(name)) return "必修系列";
  return "未分类";
};
const buildCategoryList = (groups, savedCategories) => {
  const list = [];
  const add = (name) => {
    const normalized = normalizeCategoryName(name);
    if (normalized === "未分类") return;
    if (!list.includes(normalized)) list.push(normalized);
  };
  if (Array.isArray(savedCategories) && savedCategories.length) savedCategories.forEach(add);
  cloneGroups(groups).forEach(g => add(inferWordSetCategory(g)));
  if (!list.length) {
    DEFAULT_WORD_SET_CATEGORIES.forEach(name => {
      if (name !== "未分类") add(name);
    });
  }
  list.push("未分类");
  return list;
};
const normalizeSyncPayload = (payload, fallbackGroupId = DEFAULT_SYNC_GROUP_ID) => {
  if (Array.isArray(payload)) {
    const now = Date.now();
    const groups = cloneGroups(payload);
    return { group_id: sanitizeGroupId(fallbackGroupId), last_updated: now, synced_at: now, categories: buildCategoryList(groups, null), groups, tombstones: { groups: {}, words: {} } };
  }
  if (payload && typeof payload === "object") {
    const groups = Array.isArray(payload.groups) ? payload.groups : Array.isArray(payload.data) ? payload.data : [];
    const lastUpdated = Number(payload.last_updated || payload.updated_at || payload.timestamp || Date.now()) || Date.now();
    const syncedAt = Number(payload.synced_at || payload.last_synced_at || payload.syncedAt || lastUpdated) || lastUpdated;
    const clonedGroups = cloneGroups(groups);
    const tombstones = payload.tombstones && typeof payload.tombstones === "object" ? {
      groups: payload.tombstones.groups && typeof payload.tombstones.groups === "object" ? { ...payload.tombstones.groups } : {},
      words: payload.tombstones.words && typeof payload.tombstones.words === "object" ? { ...payload.tombstones.words } : {}
    } : { groups: {}, words: {} };
    return {
      ...payload,
      group_id: sanitizeGroupId(fallbackGroupId),
      last_updated: lastUpdated,
      synced_at: syncedAt,
      categories: buildCategoryList(clonedGroups, payload.categories),
      groups: clonedGroups,
      tombstones
    };
  }
  const now = Date.now();
  return { group_id: sanitizeGroupId(fallbackGroupId), last_updated: now, synced_at: now, categories: buildCategoryList([], null), groups: [], tombstones: { groups: {}, words: {} } };
};
const hasUnsyncedLocalChanges = (payload) => Number(payload?.last_updated || 0) > Number(payload?.synced_at || 0);
const payloadStamp = (payload) => Number(payload?.last_updated || 0);

const formatSyncTime = (value) => {
  const ts = Number(value || 0);
  if (!ts) return "未同步";
  const d = new Date(ts);
  if (Number.isNaN(d.getTime())) return "未同步";
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
const mergeGroups = (localGroups, remoteGroups, localTombstones, remoteTombstones, localTime, remoteTime) => {
  const mergedTombstones = {
    groups: {},
    words: {}
  };
  const allGroupKeys = new Set([...Object.keys(localTombstones?.groups || {}), ...Object.keys(remoteTombstones?.groups || {})]);
  allGroupKeys.forEach(id => {
    mergedTombstones.groups[id] = Math.max(localTombstones?.groups?.[id] || 0, remoteTombstones?.groups?.[id] || 0);
  });
  const allWordKeys = new Set([...Object.keys(localTombstones?.words || {}), ...Object.keys(remoteTombstones?.words || {})]);
  allWordKeys.forEach(id => {
    mergedTombstones.words[id] = Math.max(localTombstones?.words?.[id] || 0, remoteTombstones?.words?.[id] || 0);
  });

  const merged = [];
  const groupMap = new Map();

  remoteGroups.forEach(g => {
    groupMap.set(g.id, { ...g, words: cloneGroups(g.words || []), source: 'remote' });
  });
  localGroups.forEach(g => {
    if (groupMap.has(g.id)) {
      groupMap.set(g.id, { ...g, words: cloneGroups(g.words || []), source: 'both' });
    } else {
      groupMap.set(g.id, { ...g, words: cloneGroups(g.words || []), source: 'local' });
    }
  });

  for (const [id, g] of groupMap.entries()) {
    const delTime = mergedTombstones.groups[id];
    if (delTime) {
      if (g.source === 'local' && delTime >= localTime) continue;
      if (g.source === 'remote' && delTime >= remoteTime) continue;
      if (g.source === 'both') {
        if (delTime >= Math.max(localTime, remoteTime)) continue;
      }
    }
    
    const remoteG = remoteGroups.find(x => x.id === g.id);
    const localG = localGroups.find(x => x.id === g.id);
    
    if (remoteG && localG) {
      const wordMap = new Map();
      (remoteG.words || []).forEach(w => {
        wordMap.set(w.id || w.kana, { ...w, source: 'remote' });
      });
      (localG.words || []).forEach(w => {
        const key = w.id || w.kana;
        if (wordMap.has(key)) {
          wordMap.set(key, { ...w, source: 'both' });
        } else {
          wordMap.set(key, { ...w, source: 'local' });
        }
      });

      const mergedWords = [];
      for (const [wKey, w] of wordMap.entries()) {
        const wDelTime = mergedTombstones.words[w.id || wKey];
        if (wDelTime) {
          if (w.source === 'local' && wDelTime >= localTime) continue;
          if (w.source === 'remote' && wDelTime >= remoteTime) continue;
          if (w.source === 'both' && wDelTime >= Math.max(localTime, remoteTime)) continue;
        }
        mergedWords.push(w);
      }
      g.words = mergedWords;
    } else if (g.source === 'local') {
      g.words = (g.words || []).filter(w => {
        const wDelTime = mergedTombstones.words[w.id || w.kana];
        return !wDelTime || wDelTime < localTime;
      });
    } else if (g.source === 'remote') {
      g.words = (g.words || []).filter(w => {
        const wDelTime = mergedTombstones.words[w.id || w.kana];
        return !wDelTime || wDelTime < remoteTime;
      });
    }

    delete g.source;
    merged.push(g);
  }

  return { mergedGroups: merged, mergedTombstones };
};
const requestJson = async (url, options = {}, timeoutMs = 10000) => {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const response = await fetch(url, { ...options, signal: controller.signal });
    const text = await response.text();
    let data = null;
    if (text) {
      try { data = JSON.parse(text); } catch (e) { data = { raw: text }; }
    }
    if (!response.ok) {
      throw new Error((data && (data.message || data.error)) || `请求失败（${response.status}）`);
    }
    return data || {};
  } finally {
    clearTimeout(timer);
  }
};
const pullFromCloud = async (groupId) => {
  const targetGid = sanitizeGroupId(groupId);
  const url = new URL(CLOUD_SYNC_BASE);
  url.searchParams.set("group", targetGid);
  const data = await requestJson(url.toString(), { method:"GET", headers:{ Accept:"application/json" } });
  const raw = data.data ?? data.payload ?? data;
  return normalizeSyncPayload(raw, targetGid);
};
const extractStudentsList = (payload) => {

};
const pushToCloud = async (groupId, data, { syncType = "words" } = {}) => {
  const syncingStudents = syncType === "students";
  let payloadData = { ...(data || {}) };
  let remoteData = null;
  let remoteReadFailed = false;
  try {
    remoteData = await pullFromCloud(groupId);
    if (remoteData && typeof remoteData === "object") {
      if (syncingStudents) {
        if (Array.isArray(remoteData.groups) && remoteData.groups.length > 0) payloadData.groups = remoteData.groups;
        if (Array.isArray(remoteData.categories)) payloadData.categories = remoteData.categories;
        if (remoteData.tombstones) payloadData.tombstones = remoteData.tombstones;
      } else if (Array.isArray(remoteData.students)) {
        const localStudents = Array.isArray(payloadData.students) ? payloadData.students : [];
        if (remoteData.students.length || !localStudents.length) {
          payloadData.students = remoteData.students;
          if (remoteData.challengeSettings) payloadData.challengeSettings = remoteData.challengeSettings;
        }
      } else if (!Array.isArray(payloadData.students) || !payloadData.students.length) {
        delete payloadData.students;
      }
    }
  } catch (e) {
    console.error("[写保护] 推送前读取云端失败:", e);
    remoteReadFailed = true;
  }
  if (remoteReadFailed) throw new Error("无法校验云端数据，已阻止推送以防止数据覆盖。请检查网络后重试。");

  const localGroups = Array.isArray(payloadData.groups) ? payloadData.groups : [];
  const remoteGroups = Array.isArray(remoteData?.groups) ? remoteData.groups : [];
  if (localGroups.length === 0 && remoteGroups.length > 0) payloadData.groups = remoteGroups;

  const localStudents = Array.isArray(payloadData.students) ? payloadData.students : [];
  const remoteStudents = Array.isArray(remoteData?.students) ? remoteData.students : [];
  if (localStudents.length === 0 && remoteStudents.length > 0) {
    payloadData.students = remoteStudents;
    if (remoteData?.challengeSettings) payloadData.challengeSettings = remoteData.challengeSettings;
  }

  const payload = normalizeSyncPayload(payloadData, groupId);
  const url = new URL(CLOUD_SYNC_BASE);
  url.searchParams.set("group", sanitizeGroupId(groupId));
  url.searchParams.set("scope", syncingStudents ? "students" : "words");
  // 每个子记录各自带版本号。服务端发现版本已变化时拒绝旧写入，避免最后写入者
  // 把其他设备的较新数据整包覆盖掉。
  payload.revision = Number(syncingStudents ? remoteData?.students_revision : remoteData?.words_revision) || 0;
  const res = await requestJson(url.toString(), {
    method:"POST",
    headers:{ "Content-Type":"application/json", Accept:"application/json" },
    body: JSON.stringify({ ...payload, group_id:sanitizeGroupId(groupId) }),
  });
  const rawRes = res.data ?? res.payload ?? payload;
  return normalizeSyncPayload(rawRes, groupId);
};
const sendFinalSyncToCloud = (groupId, data) => {
  // [安全修复] 页面关闭时不再盲写到云端。
  // 原因：sendBeacon / keepalive fetch 无法先读取云端再合并，
  // 会用本地可能过时的缓存整包覆盖云端最新数据，导致数据丢失。
  // 未同步的本地修改保留在 localStorage 中，下次打开页面时由 backgroundRevalidate 自动同步。
  return false;
};

const makeWorkbookFromGroups = (groups) => {

  (groups.length ? groups : [{ name:"单词组", words:[] }]).forEach(g => {
    const rows = (g.words || []).map(wordToExcelRow);
    const ws = XLSX.utils.aoa_to_sheet([EXCEL_HEADERS, ...rows.map(row => EXCEL_HEADERS.map(h => row[h] || ""))]);
    XLSX.utils.book_append_sheet(wb, ws, safeSheetName(g.name, used));
  });
  return wb;
};
const parseWorkbookSheets = (arrayBuffer) => {
  const wb = XLSX.read(arrayBuffer, { type:"array" });
  return wb.SheetNames.map(name => {
    const ws = wb.Sheets[name];
    const rawRows = XLSX.utils.sheet_to_json(ws, { defval:"" });
    const words = [];
    const warnings = [];
    rawRows.forEach((row, i) => {
      const parsed = excelRowToWord(row, i + 2);
      if (parsed.word) words.push(parsed.word);
      else if (parsed.skipped && !parsed.silent) warnings.push({ rowNumber:parsed.rowNumber, reason:parsed.reason });
    });
    return {
      name,
      words,
      warnings,
      preview: rawRows.slice(0, 3).map(r => EXCEL_HEADERS.reduce((acc, h) => ({...acc, [h]:getCell(r, h)}), {})),
    };
  });
};

const storage = {
  key(groupId) { return `classtango_data_${sanitizeGroupId(groupId)}`; },
  studentBackupKey(groupId) { return `classtango_students_backup_${sanitizeGroupId(groupId)}`; },
  save(groupId, data) {
    try {
      const normalized = normalizeSyncPayload(data, groupId);
      // Ordinary vocabulary sync payloads do not include students. Do not let one
      // overwrite the local student fallback that is stored under the same group.
      if (!Array.isArray(data?.students)) {
        const existingRaw = localStorage.getItem(this.key(groupId));
        if (existingRaw) {
          const existing = JSON.parse(existingRaw);
          if (Array.isArray(existing?.students) && existing.students.length) {
            normalized.students = existing.students;
            if (existing.challengeSettings) normalized.challengeSettings = existing.challengeSettings;
          }
        }
      }
      localStorage.setItem(this.key(groupId), JSON.stringify(normalized));
    } catch(e) {}
  },
  saveStudentBackup(groupId, students, challengeSettings = {}) {
    if (!Array.isArray(students) || !students.length) return;
    try {
      const key = this.studentBackupKey(groupId);
      const previous = JSON.parse(localStorage.getItem(key) || "[]");
      const snapshots = Array.isArray(previous) ? previous : [];
      snapshots.unshift({ savedAt: Date.now(), students, challengeSettings });
      localStorage.setItem(key, JSON.stringify(snapshots.slice(0, 3)));
    } catch(e) {}
  },
  loadStudentBackup(groupId) {
    try {
      const snapshots = JSON.parse(localStorage.getItem(this.studentBackupKey(groupId)) || "[]");
      return Array.isArray(snapshots) ? snapshots.find(item => Array.isArray(item?.students) && item.students.length) || null : null;
    } catch(e) { return null; }
  },
  clearStudentBackup(groupId) {
    try { localStorage.removeItem(this.studentBackupKey(groupId)); } catch(e) {}
  },
  load(groupId) {
    try {
      const key = this.key(groupId);
      const s = localStorage.getItem(key);
      if (s) return normalizeSyncPayload(JSON.parse(s), groupId);
      if (sanitizeGroupId(groupId) === DEFAULT_SYNC_GROUP_ID) {
        const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
        if (legacy) {
          const normalized = normalizeSyncPayload(JSON.parse(legacy), groupId);
          this.save(groupId, normalized);
          return normalized;
        }
      }
      return null;
    } catch(e){ return null; }
  }
};

function Modal({ open, onClose, title, children, wide, themeC = C }) {
  const MC = themeC;
  const overlayRef = useRef(null);
  const mouseDownTargetRef = useRef(null);

  if (!open) return null;

  const handleMouseDown = (e) => {
    // 记录按下时的目标，防止在弹窗内选区拖拽到遮罩松开时误触发关闭
    mouseDownTargetRef.current = e.target;
  };

  const handleClick = (e) => {
    // 仅当 mousedown 和 click 的目标都是外层遮罩背景本身时才关闭
    if (mouseDownTargetRef.current === overlayRef.current && e.target === overlayRef.current) {
      if (typeof onClose === "function") onClose();
    }
    mouseDownTargetRef.current = null;
  };

  return (
    <div
      ref={overlayRef}
      onMouseDown={handleMouseDown}
      onClick={handleClick}
      style={{ position:"fixed", top:0, right:0, bottom:0, left:0, zIndex:1000, display:"flex", alignItems:"center", justifyContent:"center", background:"rgba(0,0,0,0.5)", backdropFilter:"blur(5px)" }}
    >
      <div className="pop-in" style={{ background:MC.card, borderRadius:18, padding:"28px 32px", width: wide?780:540, maxWidth:"93vw",
        maxHeight:"90vh", overflowY:"auto", boxShadow:"0 24px 80px rgba(0,0,0,0.25)" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:22 }}>
          <h3 style={{ margin:0, fontSize:18, fontWeight:700, color:MC.text }}>{title}</h3>
          <button onClick={onClose} style={{ background:"none", border:"none", cursor:"pointer", padding:4, borderRadius:6 }}><IX size={18} color={MC.muted}/></button>
        </div>
        {children}
      </div>
    </div>
  );
}

        <div><label style={labelStyle}>假名（必填）</label><input style={inputStyle} value={w.kana} onChange={e=>set("kana",e.target.value)} placeholder="例：たまご"/></div>
        <div><label style={labelStyle}>汉字</label><input style={inputStyle} value={w.kanji} onChange={e=>set("kanji",e.target.value)} placeholder="例：卵"/></div>
        <div><label style={labelStyle}>声调</label><input style={inputStyle} value={w.accent} onChange={e=>set("accent",e.target.value)} placeholder="例：0 / ②"/></div>
        <div><label style={labelStyle}>词性</label>
          <input style={inputStyle} value={w.pos} onChange={e=>set("pos",e.target.value)} placeholder="例：名詞 / 動詞"/>
        </div>
      </div>
      <div style={{ marginBottom:14 }}>
        <label style={labelStyle}>中文释义（必填）</label>
        <input style={inputStyle} value={w.meaning} onChange={e=>set("meaning",e.target.value)} placeholder="例：鸡蛋"/>
      </div>
      <div style={{ marginBottom:14 }}>
        <label style={labelStyle}>用法说明</label>
        <textarea style={{...inputStyle, minHeight:48, resize:"vertical"}} value={w.usage} onChange={e=>set("usage",e.target.value)} placeholder="可选：补充该词的用法、搭配等"/>
      </div>
      <div style={{ marginBottom:14 }}>
        <label style={labelStyle}>配图</label>
        <div style={{ display:"flex", gap:8 }}>
          <input style={{...inputStyle, flex:1}} value={w.imageUrl?.startsWith("data:")?"（已上传本地图片）":w.imageUrl} onChange={e=>set("imageUrl",e.target.value)} placeholder="粘贴图片URL"/>
          <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleImg}/>
          <button onClick={()=>fileRef.current?.click()} style={sBtnSm(C.blueLight, C.blue, {whiteSpace:"nowrap"})}>上传图片</button>
        </div>
        {w.imageUrl && <img src={w.imageUrl} alt="" style={{ marginTop:8, maxHeight:110, borderRadius:8, objectFit:"cover" }} onError={e=>e.target.style.display="none"}/>}
      </div>
      <div style={{ marginBottom:14 }}>
        <label style={labelStyle}>例句</label>
        {w.examples.map((ex,i) => (
          <div key={i} style={{ display:"flex", gap:8, marginBottom:8, alignItems:"start" }}>
            <div style={{ flex:1 }}>
              <input style={{...inputStyle, marginBottom:4}} value={ex.ja} onChange={e=>setEx(i,"ja",e.target.value)} placeholder="日语例句"/>
              <input style={inputStyle} value={ex.cn} onChange={e=>setEx(i,"cn",e.target.value)} placeholder="中文翻译"/>
            </div>
            {w.examples.length > 1 && <button onClick={()=>rmEx(i)} style={{ background:"none", border:"none", cursor:"pointer", marginTop:8 }}><IX size={15} color={C.wrong}/></button>}
          </div>
        ))}
        <button onClick={addEx} style={{ background:"none", border:`1px dashed ${C.border}`, borderRadius:8, padding:"5px 14px", fontSize:13, cursor:"pointer", color:C.muted }}>＋ 添加例句</button>
      </div>
      <div style={{ display:"flex", gap:10, justifyContent:"flex-end", marginTop:22, borderTop:`1px solid ${C.borderLight}`, paddingTop:18 }}>
        <button onClick={onCancel} style={sBtn(C.bg, C.muted)}>取消</button>
        <button onClick={()=>valid&&onSave(w)} disabled={!valid} style={sBtn(valid?C.primary:"#ccc", "#fff", {cursor:valid?"pointer":"not-allowed", boxShadow:valid?"0 2px 10px rgba(200,64,45,0.25)":"none"})}>保存</button>
      </div>
    </div>
  );
}

/* ===== EDIT MODE ===== */
function EditMode({ groups, setGroups, categories, setCategories, gid: curGid, setGid: setCurGid, triggerAddWord, themeC = C }) {
  const C = themeC;
  const [showForm, setShowForm] = useState(false);
  const [editWord, setEditWord] = useState(null);
  const [renaming, setRenaming] = useState(null);
  const [renameVal, setRenameVal] = useState("");
  const [renamingCat, setRenamingCat] = useState(null);
  const [catRenameVal, setCatRenameVal] = useState("");
  const [expandedCats, setExpandedCats] = useState(() => Object.fromEntries(DEFAULT_WORD_SET_CATEGORIES.map(cat => [cat, true])));
  const [wordView, setWordView] = useState("pos");
  const [draggingGroupId, setDraggingGroupId] = useState(null);
  const [dragOverCategory, setDragOverCategory] = useState(null);
  const [draggingWordId, setDraggingWordId] = useState(null);
  const [dragOverWordId, setDragOverWordId] = useState(null);
  const [draggingCategory, setDraggingCategory] = useState(null);
  const [dragOverCategoryTarget, setDragOverCategoryTarget] = useState(null);
  const group = groups.find(g => g.id === curGid);
  const activeCategory = inferWordSetCategory(group);
  const isDark = C.bg === TEACH_CHALK.bg;
  const categoryTextColor = isDark ? "rgba(255,255,255,0.72)" : C.muted;
  const displayCategories = buildCategoryList(groups, categories);
  const currentHiddenCount = (group?.words || []).filter(w => w.hidden === true).length;

  const restoreHiddenWordsInEdit = useCallback(() => {
    if (!group || currentHiddenCount === 0) return;
    setGroups(groups.map(g => g.id === group.id ? { ...g, words:(g.words || []).map(w => w.hidden ? { ...w, hidden:false } : w) } : g));
  }, [group, groups, currentHiddenCount, setGroups]);

  useEffect(() => {
    if (triggerAddWord > 0) {
      setEditWord(null);
      setShowForm(true);
    }
  }, [triggerAddWord]);

  useEffect(() => {
    if (activeCategory) setExpandedCats(prev => ({ ...prev, [activeCategory]: true }));
  }, [activeCategory]);

  const groupedWordSets = displayCategories.map(category => ({
    category,
    groups: groups.filter(g => inferWordSetCategory(g) === category)
  }));

  const addCategory = () => {
    let idx = displayCategories.length + 1;
    let name = `新分类 ${idx}`;
    while (displayCategories.includes(name)) {
      idx += 1;
      name = `新分类 ${idx}`;
    }
    setCategories([...displayCategories, name]);
    setExpandedCats(prev => ({ ...prev, [name]: true }));
    setRenamingCat(name);
    setCatRenameVal(name);
  };

  const startRenameCategory = (category) => {
    setRenamingCat(category);
    setCatRenameVal(category);
  };

  const finishRenameCategory = () => {
    const oldName = renamingCat;
    const newName = normalizeCategoryName(catRenameVal);
    if (!oldName) return;
    if (newName !== oldName && displayCategories.includes(newName)) {
      window.alert("已经有同名分类，请换一个名称。");
      setRenamingCat(null);
      return;
    }
    setCategories(displayCategories.map(cat => cat === oldName ? newName : cat));
    setGroups(groups.map(g => inferWordSetCategory(g) === oldName ? { ...g, category:newName } : g));
    setExpandedCats(prev => {
      const next = { ...prev, [newName]: prev[oldName] !== false };
      delete next[oldName];
      return next;
    });
    setRenamingCat(null);
  };

  const deleteCategory = (category) => {
    if (category === "未分类") {
      window.alert("“未分类”用于承接暂未归档的单词组，不能删除。");
      return;
    }
    const count = groups.filter(g => inferWordSetCategory(g) === category).length;
    let shouldDeleteCategory = false;
    let shouldDeleteGroups = false;
    let shouldMoveGroupsToUncategorized = false;
    
    if (count > 0) {
      const confirmAllDelete = confirm(`确定删除“${category}”分类及其中 ${count} 个单词组吗？\n点击确定将删除分类和所有单词组，点击取消可保留单词组。`);
      if (confirmAllDelete) {
        shouldDeleteCategory = true;
        shouldDeleteGroups = true;
      } else {
        const confirmMove = confirm(`是否将单词组移至“未分类”并删除“${category}”分类？`);
        if (confirmMove) {
          shouldDeleteCategory = true;
          shouldMoveGroupsToUncategorized = true;
        } else {
          return;
        }
      }
    } else {
      const confirmSimpleDelete = confirm(`确定删除“${category}”分类吗？`);
      if (confirmSimpleDelete) {
        shouldDeleteCategory = true;
      } else {
        return;
      }
    }
    
    if (shouldDeleteCategory) {
      const nextCategories = displayCategories.filter(cat => cat !== category);
      if (!nextCategories.includes("未分类")) nextCategories.push("未分类");
      setCategories(nextCategories);
    }
    
    if (shouldDeleteGroups) {
      const deletedGroupIds = new Set(groups.filter(g => inferWordSetCategory(g) === category).map(g => g.id));
      const nextGroups = groups.filter(g => !deletedGroupIds.has(g.id));
      setGroups(nextGroups);
      if (curGid && deletedGroupIds.has(curGid)) {
        setCurGid(nextGroups[0]?.id || null);
      }
    } else if (shouldMoveGroupsToUncategorized) {
      setGroups(groups.map(g => inferWordSetCategory(g) === category ? { ...g, category: "未分类" } : g));
    }
    
    setExpandedCats(prev => {
      const next = { ...prev };
      if (shouldMoveGroupsToUncategorized) {
        next["未分类"] = true;
      }
      delete next[category];
      return next;
    });
  };

  const moveCategory = (sourceCat, targetCat) => {
    if (!sourceCat || !targetCat || sourceCat === targetCat || sourceCat === "未分类" || targetCat === "未分类") return;
    const list = displayCategories.filter(cat => cat !== "未分类");
    const from = list.indexOf(sourceCat);
    const to = list.indexOf(targetCat);
    if (from < 0 || to < 0) return;
    const newList = [...list];
    const [moved] = newList.splice(from, 1);
    newList.splice(to, 0, moved);
    setCategories(newList);
  };

  const addGroup = (category) => {
    const sameCatCount = groups.filter(g => inferWordSetCategory(g) === category).length + 1;
    const ng = { id:gid(), name:`新建单词组 ${sameCatCount}`, category, words:[] };
    setGroups([...groups, ng]);
    setCurGid(ng.id);
    setExpandedCats(prev => ({ ...prev, [category]: true }));
  };
  const delGroup = (id) => {
    if(!confirm("确定删除该单词组及其中所有单词？")) return;
    const ng=groups.filter(g=>g.id!==id);
    setGroups(ng);
    if(curGid===id) setCurGid(ng[0]?.id||null);
  };
  const startRename = (g) => { setRenaming(g.id); setRenameVal(g.name); };
  const finishRename = () => { if(renameVal.trim()) setGroups(groups.map(g=>g.id===renaming?{...g,name:renameVal.trim()}:g)); setRenaming(null); };
  const moveGroupToCategory = (groupId, category) => {
    const target = normalizeCategoryName(category);
    const moved = groups.find(g => g.id === groupId);
    if (!moved || inferWordSetCategory(moved) === target) return;
    setGroups(groups.map(g => g.id === groupId ? { ...g, category:target } : g));
    setCurGid(groupId);
    setExpandedCats(prev => ({ ...prev, [target]: true }));
  };
  const handleCategoryDrop = (e, category) => {
    e.preventDefault();
    e.stopPropagation();
    const groupId = e.dataTransfer.getData("text/plain") || draggingGroupId;
    if (groupId) moveGroupToCategory(groupId, category);
    setDraggingGroupId(null);
    setDragOverCategory(null);
  };
  const saveWord = (w) => {
    setGroups(groups.map(g => {
      if (g.id !== curGid) return g;
      const exists = g.words.find(x=>x.id===w.id);
      return {...g, words: exists ? g.words.map(x=>x.id===w.id?w:x) : [...g.words, w]};
    }));
    setShowForm(false); setEditWord(null);
  };
  const delWord = (wid) => { if(!confirm("删除该单词？")) return; setGroups(groups.map(g=>g.id!==curGid?g:{...g, words:g.words.filter(w=>w.id!==wid)})); };
  const toggleWordHidden = (wid) => {
    setGroups(groups.map(g => g.id !== curGid ? g : { ...g, words:g.words.map(w => w.id === wid ? { ...w, hidden:!w.hidden } : w) }));
  };
  const moveWordTo = (sourceId, targetId) => {
    if (!sourceId || !targetId || sourceId === targetId) return;
    setGroups(groups.map(g => {
      if (g.id !== curGid) return g;
      const ws = [...g.words];
      const from = ws.findIndex(w => w.id === sourceId);
      const to = ws.findIndex(w => w.id === targetId);
      if (from < 0 || to < 0 || from === to) return g;
      const [moved] = ws.splice(from, 1);
      ws.splice(to, 0, moved);
      return { ...g, words:ws };
    }));
  };
  const groupedWordsByPos = useMemo(() => {
    const order = [];
    const map = new Map();
    (group?.words || []).forEach(word => {
      const pos = word.pos || "その他";
      if (!map.has(pos)) {
        map.set(pos, []);
        order.push(pos);
      }
      map.get(pos).push(word);
    });
    return order.map(pos => ({ pos, words:map.get(pos) }));
  }, [group]);

  const renderWordCard = (w) => {
    const orderIndex = Math.max(0, (group?.words || []).findIndex(word => word.id === w.id)) + 1;
    return (
      <div key={w.id} className="fade-in" draggable
        onDragStart={e=>{ setDraggingWordId(w.id); e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain", w.id); }}
        onDragOver={e=>{ if (!draggingWordId || draggingWordId === w.id) return; e.preventDefault(); e.dataTransfer.dropEffect="move"; setDragOverWordId(w.id); }}
        onDragLeave={e=>{ if (!e.currentTarget.contains(e.relatedTarget)) setDragOverWordId(null); }}
        onDrop={e=>{ e.preventDefault(); const sourceId = e.dataTransfer.getData("text/plain") || draggingWordId; moveWordTo(sourceId, w.id); setDraggingWordId(null); setDragOverWordId(null); }}
        onDragEnd={()=>{ setDraggingWordId(null); setDragOverWordId(null); }}
        style={{ minHeight:78, background:C.card, borderRadius:10, padding:8, border:`1px solid ${dragOverWordId===w.id ? C.primary : w.hidden ? "rgba(209,67,67,0.24)" : C.borderLight}`, transition:"box-shadow 0.2s, transform 0.2s", opacity:draggingWordId===w.id?0.45:w.hidden?0.5:1, position:"relative", display:"flex", alignItems:"center", gap:10, overflow:"hidden", boxSizing:"border-box", cursor:"grab", boxShadow:dragOverWordId===w.id ? `inset 0 0 0 1px ${C.primary}` : "none" }}
        onMouseEnter={e=>{e.currentTarget.style.boxShadow="0 4px 14px rgba(0,0,0,0.07)";e.currentTarget.style.transform="translateY(-1px)";}}
        onMouseLeave={e=>{e.currentTarget.style.boxShadow=dragOverWordId===w.id ? `inset 0 0 0 1px ${C.primary}` : "none";e.currentTarget.style.transform="none";}}>
        <div style={{ width:30, flex:"0 0 30px", textAlign:"center", color:C.muted, fontSize:12, fontWeight:900 }}>{String(orderIndex).padStart(2, "0")}</div>
        <div style={{ width:60, height:60, borderRadius:8, overflow:"hidden", background:C.bg, border:`1px solid ${C.borderLight}`, flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center", color:C.hint, fontSize:18 }}>
          {w.imageUrl ? <img src={w.imageUrl} alt="" style={{ width:"100%", height:"100%", objectFit:"cover" }} onError={e=>{e.currentTarget.style.display="none";}}/> : "単"}
        </div>
        <button onClick={()=>{setEditWord(w);setShowForm(true)}} style={{ flex:"1 1 auto", minWidth:0, alignSelf:"stretch", background:"transparent", border:"none", padding:"2px 4px", cursor:"pointer", textAlign:"left", display:"grid", gridTemplateRows:"1fr 1fr", rowGap:3, alignItems:"center" }}>
          <div style={{ display:"flex", alignItems:"center", gap:6, minWidth:0, lineHeight:1.15 }}>
            <span style={{ fontSize:17, fontWeight:800, fontFamily:SF, color:C.text, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", minWidth:0 }}>{w.kanji || w.kana}</span>
            {w.accent && <span style={{ fontSize:10, color:C.primary, fontWeight:800, flexShrink:0 }}>[{w.accent}]</span>}
            {w.hidden && <span style={{ padding:"1px 6px", borderRadius:999, background:"rgba(209,67,67,0.10)", color:C.wrong, fontSize:10, fontWeight:800, flexShrink:0 }}>隐藏</span>}
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"minmax(72px, 0.8fr) minmax(120px, 1.2fr)", gap:10, minWidth:0, alignItems:"center", lineHeight:1.2 }}>
            <span style={{ fontSize:12, color:C.muted, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", fontFamily:SF, minWidth:0 }}>{w.kanji ? w.kana : w.pos}</span>
            <span style={{ fontSize:13, color:C.primary, fontWeight:700, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", minWidth:0 }}>{w.meaning}</span>
          </div>
        </button>
        <div draggable={false} onDragStart={e=>e.preventDefault()} style={{ display:"flex", gap:5, justifyContent:"end", flex:"0 0 86px" }}>
          <button onClick={()=>toggleWordHidden(w.id)} title={w.hidden?"恢复课堂显示":"课堂隐藏该词"} aria-label={w.hidden?"恢复课堂显示":"课堂隐藏该词"} style={{ background:w.hidden?"rgba(209,67,67,0.1)":C.bg, border:"none", borderRadius:8, width:48, height:36, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>{w.hidden ? <IEyeOff size={18} color={C.wrong}/> : <IEye size={18} color={C.muted}/>}</button>
          <button onClick={()=>delWord(w.id)} style={{ background:"rgba(209,67,67,0.1)", border:"none", borderRadius:8, width:32, height:36, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}><ITrash size={14} color={C.wrong}/></button>
        </div>
      </div>
    );
  };

  const renderGroupNode = (g) => {
    const active = g.id === curGid;
    const dragging = draggingGroupId === g.id;
    return (
      <div key={g.id} onClick={()=>setCurGid(g.id)}
        draggable={renaming !== g.id}
        onDragStart={e=>{
          setDraggingGroupId(g.id);
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", g.id);
        }}
        onDragEnd={()=>{ setDraggingGroupId(null); setDragOverCategory(null); }}
        style={{
          margin:"3px 6px 3px 18px",
          padding:"9px 10px",
          borderRadius:9,
          cursor:renaming === g.id ? "text" : "grab",
          opacity:dragging ? 0.55 : 1,
          background: active ? (isDark ? "rgba(255,255,255,0.10)" : C.primaryLight) : "transparent",
          border: active ? `1.5px solid ${isDark ? C.primary : "rgba(200,64,45,0.24)"}` : "1.5px solid transparent",
          boxShadow: active && isDark ? `0 0 0 1px ${C.primary}55, inset 3px 0 0 ${C.primary}` : "none",
          transition:"all 0.15s"
        }}>
        {renaming === g.id ? (
          <input autoFocus value={renameVal} onChange={e=>setRenameVal(e.target.value)}
            onBlur={finishRename} onKeyDown={e=>e.key==="Enter"&&finishRename()}
            style={{ width:"100%", padding:"3px 6px", border:`1.5px solid ${C.primary}`, borderRadius:5, fontSize:13, outline:"none", background:C.bg, color:C.text }}
            onClick={e=>e.stopPropagation()}/>
        ) : (
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:8 }}>
            <div style={{ minWidth:0 }}>
               <div style={{ fontSize:13, fontWeight:active?800:600, color:active?(isDark?"#FFFFFF":C.text):C.text, lineHeight:1.3, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{g.name}</div>
               <div style={{ fontSize:11, color:active&&isDark?"rgba(255,255,255,0.62)":C.muted, marginTop:2 }}>{g.words.length} 个单词</div>
            </div>
            <div style={{ display:"flex", gap:2, flexShrink:0 }} onClick={e=>e.stopPropagation()}>
              <button onClick={()=>startRename(g)} style={{ background:"none", border:"none", cursor:"pointer", padding:3, borderRadius:4 }}><IEdit size={13} color={active&&isDark?"#fff":C.muted}/></button>
              <button onClick={()=>delGroup(g.id)} style={{ background:"none", border:"none", cursor:"pointer", padding:3, borderRadius:4 }}><ITrash size={13} color={C.wrong}/></button>
            </div>
          </div>
        )}
      </div>
    );
  };

  return (
    <div style={{ display:"flex", height:"100%" }}>
      {/* Sidebar */}
      <div style={{ width:270, borderRight:`1px solid ${C.border}`, background:isDark?"#1E1E1E":C.card, display:"flex", flexDirection:"column", flexShrink:0 }}>
        <div style={{ padding:"16px 16px 10px", borderBottom:`1px solid ${C.borderLight}` }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:10 }}>
            <div>
              <div style={{ fontSize:14, fontWeight:900, color:C.text, lineHeight:1.25 }}>教研目录</div>
              <div style={{ fontSize:11, color:C.muted, marginTop:4 }}>按教材与专题整理单词组</div>
            </div>
            <button onClick={addCategory} title="新增分类" aria-label="新增分类"
              style={{ width:28, height:28, borderRadius:"50%", border:`1px solid ${C.border}`, background:isDark?"rgba(255,255,255,0.05)":C.bg, color:C.primary, cursor:"pointer", fontSize:16, fontWeight:900, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
              ＋
            </button>
          </div>
        </div>
        <div style={{ flex:1, overflowY:"auto", padding:"8px 6px 12px" }}>
          {groupedWordSets.map(({category, groups: catGroups}) => {
            const open = !!expandedCats[category];
            const isDropTarget = dragOverCategory === category && !!draggingGroupId;
            const isCatDragOver = dragOverCategoryTarget === category && !!draggingCategory;
            return (
              <div key={category}
                draggable={category !== "未分类" && renamingCat !== category}
                onDragStart={e=>{
                  if (draggingGroupId) return;
                  setDraggingCategory(category);
                  e.dataTransfer.effectAllowed = "move";
                  e.dataTransfer.setData("category", category);
                }}
                onDragOver={e=>{
                  if (draggingGroupId) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = "move";
                    setDragOverCategory(category);
                  } else if (draggingCategory && draggingCategory !== category && category !== "未分类") {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = "move";
                    setDragOverCategoryTarget(category);
                  }
                }}
                onDragLeave={e=>{
                  if (!e.currentTarget.contains(e.relatedTarget)) {
                    setDragOverCategory(null);
                    setDragOverCategoryTarget(null);
                  }
                }}
                onDrop={e=>{
                  e.preventDefault();
                  if (draggingGroupId) {
                    const groupId = e.dataTransfer.getData("text/plain") || draggingGroupId;
                    if (groupId) moveGroupToCategory(groupId, category);
                    setDraggingGroupId(null);
                    setDragOverCategory(null);
                  } else {
                    const sourceCat = e.dataTransfer.getData("category") || draggingCategory;
                    if (sourceCat) moveCategory(sourceCat, category);
                    setDraggingCategory(null);
                    setDragOverCategoryTarget(null);
                  }
                }}
                onDragEnd={()=>{
                  setDraggingGroupId(null);
                  setDragOverCategory(null);
                  setDraggingCategory(null);
                  setDragOverCategoryTarget(null);
                }}
                style={{
                  marginBottom:6,
                  borderRadius:10,
                  background:isDropTarget ? (isDark ? "rgba(255,255,255,0.08)" : C.primaryLight) : "transparent",
                  boxShadow:isCatDragOver ? `0 0 0 2px ${C.primary}` : (isDropTarget ? `inset 0 0 0 1.5px ${C.primary}` : "none"),
                  transition:"background 0.15s, box-shadow 0.15s",
                  opacity: draggingCategory === category ? 0.4 : 1
                }}>

/* ===== INLINE OVER-LINE ACCENT ===== */
function VisualAccentCurve({
  kana,
  accent,
  color = "#C8402D",
  fontSize = 20,
  textColor = "currentColor",
}) {
  const morae = useMemo(() => {
    if (!kana) return [];
    const res = [];
    const smalls = ["ゃ","ゅ","ょ","ャ","ュ","ョ","ぁ","ぃ","ぅ","ぇ","ぉ","ァ","ィ","ゥ","ェ","ォ"];
    for (let i = 0; i < kana.length; i++) {
      const char = kana[i];
      if (i > 0 && smalls.includes(char)) {
        res[res.length - 1] += char;
      } else {
        res.push(char);
      }
    }
    return res;
  }, [kana]);

  const accentNum = useMemo(() => {
    if (accent === undefined || accent === null || accent === "") return null;
    const clean = String(accent).trim();
    const circleMap = {
      "⓪":0,"①":1,"②":2,"③":3,"④":4,"⑤":5,"⑥":6,"⑦":7,"⑧":8,"⑨":9,"⑩":10
    };
    if (circleMap[clean] !== undefined) return circleMap[clean];
    const parsed = parseInt(clean.replace(/[^0-9]/g, ""), 10);
    return isNaN(parsed) ? null : parsed;
  }, [accent]);

  if (accentNum === null || morae.length === 0) {
    return <span style={{ fontFamily: JP_FONT, color:textColor }}>{kana}</span>;
  }

  const N = morae.length;
  const A = accentNum;
  const charCount = Math.max(1, kana.length);
  const moraStarts = [];
  let charCursor = 0;
  morae.forEach(m => {
    moraStarts.push(charCursor);
    charCursor += m.length;
  });
  const moraCenter = (idx) => ((moraStarts[idx] + morae[idx].length / 2) / charCount) * 100;
  let highStart = 0;
  let highEnd = 0;
  let dropX = null;
  if (A === 0) {
    highStart = N === 1 ? 0 : moraCenter(0);
    highEnd = 100;
  } else if (A === 1) {
    highStart = 0;
    highEnd = Math.min(100, (moraStarts[1] ?? charCount) / charCount * 100);
    dropX = highEnd;
  } else {
    highStart = Math.max(0, moraCenter(0));
    highEnd = Math.min(100, (moraStarts[Math.min(A, N)] ?? charCount) / charCount * 100);
    dropX = highEnd;
  }
  const hasLine = highEnd > highStart + 1;
  const lineTop = Math.max(1, Math.min(4, fontSize * 0.08));
  const sidePad = Math.max(2, fontSize * 0.08);

  return (
    <span style={{ position:"relative", display:"inline-block", padding:`${Math.max(8, fontSize * 0.28)}px ${sidePad}px 0`, fontFamily:JP_FONT, fontSize, fontWeight:800, lineHeight:1.08, color:textColor, whiteSpace:"nowrap", verticalAlign:"baseline" }}>
      {hasLine && (
        <span style={{ position:"absolute", left:`calc(${highStart}% + ${sidePad}px)`, right:`calc(${100 - highEnd}% + ${sidePad}px)`, top:lineTop, height:2, borderRadius:2, background:color, boxShadow:`0 0 ${Math.max(2, fontSize * 0.08)}px ${color}66`, pointerEvents:"none" }} />
      )}
      {dropX !== null && (
        <span style={{ position:"absolute", left:`calc(${dropX}% + ${sidePad}px)`, top:lineTop + 1, transform:"translateX(-50%)", width:Math.max(5, fontSize * 0.18), height:Math.max(5, fontSize * 0.18), borderRadius:"50%", background:color, boxShadow:`0 0 ${Math.max(2, fontSize * 0.08)}px ${color}88`, pointerEvents:"none" }} />
      )}
      {kana}
    </span>
  );
}

/* ===== PERFORMANCE INK DRAWING COMPONENT ===== */
function CanvasPaint({ wordId, face, active, color, thickness, tool, strokes, onStrokesChange, onCardClick, themeC }) {
  const canvasRef = useRef(null);
  const isDrawingRef = useRef(false);
  const currentStrokeRef = useRef(null);
  const pointerStartRef = useRef({ x: 0, y: 0, time: 0 });

  const drawStrokes = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const allStrokes = [...(strokes || [])];
    if (isDrawingRef.current && currentStrokeRef.current) {
      allStrokes.push(currentStrokeRef.current);
    }

    allStrokes.forEach(stroke => {
      if (!stroke.points || stroke.points.length === 0) return;
      
      const baseWidth = stroke.width * (canvas.width / (400 * window.devicePixelRatio));
      ctx.strokeStyle = stroke.color;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (stroke.type === 'highlighter') {
        ctx.globalAlpha = 0.35;
        ctx.globalCompositeOperation = 'multiply';
      } else if (stroke.type === 'eraser') {
        ctx.globalAlpha = 1.0;
        ctx.globalCompositeOperation = 'destination-out';
      } else {
        ctx.globalAlpha = 1.0;
        ctx.globalCompositeOperation = 'source-over';
      }

      // Check if calligraphy brush effect is applicable (has timestamps, and is standard pen)
      const hasTime = stroke.points[0] && typeof stroke.points[0].t === 'number' && stroke.type !== 'eraser' && stroke.type !== 'highlighter';

      if (hasTime && stroke.points.length > 1) {
        const widths = new Array(stroke.points.length);
        widths[0] = baseWidth * 0.65; // Tapered start
        
        for (let i = 1; i < stroke.points.length; i++) {
          const pPrev = stroke.points[i - 1];
          const pCurr = stroke.points[i];
          
          const pxPrevX = pPrev.x * (canvas.width / window.devicePixelRatio);
          const pxPrevY = pPrev.y * (canvas.height / window.devicePixelRatio);
          const pxCurrX = pCurr.x * (canvas.width / window.devicePixelRatio);
          const pxCurrY = pCurr.y * (canvas.height / window.devicePixelRatio);
          
          const dist = Math.hypot(pxCurrX - pxPrevX, pxCurrY - pxPrevY);
          const dt = Math.max(1, pCurr.t - pPrev.t);
          const v = dist / dt; // pixels per millisecond
          
          // Map speed to thickness: base range [0.4x, 1.4x]
          const factor = Math.max(0.4, Math.min(1.4, 1.4 - v * 0.45));
          
          // Low-pass filter for smooth width transitions
          widths[i] = widths[i - 1] * 0.72 + (baseWidth * factor) * 0.28;
        }

        // Draw segment by segment with varying line widths
        for (let i = 1; i < stroke.points.length; i++) {
          const pPrev = stroke.points[i - 1];
          const pCurr = stroke.points[i];
          
          ctx.beginPath();
          ctx.lineWidth = widths[i];
          ctx.moveTo(pPrev.x * (canvas.width / window.devicePixelRatio), pPrev.y * (canvas.height / window.devicePixelRatio));
          ctx.lineTo(pCurr.x * (canvas.width / window.devicePixelRatio), pCurr.y * (canvas.height / window.devicePixelRatio));
          ctx.stroke();
        }
      } else {
        // Fallback for uniform thickness line (eraser, highlighter, or legacy strokes without timestamps)
        ctx.beginPath();
        ctx.lineWidth = baseWidth;
        const p0 = stroke.points[0];
        ctx.moveTo(p0.x * (canvas.width / window.devicePixelRatio), p0.y * (canvas.height / window.devicePixelRatio));
        
        if (stroke.points.length === 1) {
          ctx.lineTo(p0.x * (canvas.width / window.devicePixelRatio) + 0.1, p0.y * (canvas.height / window.devicePixelRatio));
        } else {
          for (let i = 1; i < stroke.points.length; i++) {
            const p = stroke.points[i];
            ctx.lineTo(p.x * (canvas.width / window.devicePixelRatio), p.y * (canvas.height / window.devicePixelRatio));
          }
        }
        ctx.stroke();
      }
    });

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1.0;
  }, [strokes]);

  const drawStrokesRef = useRef(drawStrokes);
  useEffect(() => {
    drawStrokesRef.current = drawStrokes;
  }, [drawStrokes]);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const resizeObserver = new ResizeObserver(entries => {
      for (let entry of entries) {
        const { width, height } = entry.contentRect;
        const targetWidth = Math.floor(width * window.devicePixelRatio);
        const targetHeight = Math.floor(height * window.devicePixelRatio);
        if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
          canvas.width = targetWidth;
          canvas.height = targetHeight;
          const ctx = canvas.getContext('2d');
          ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
        }
        if (drawStrokesRef.current) {
          drawStrokesRef.current();
        }
      }
    });
    resizeObserver.observe(canvas.parentElement);
    return () => resizeObserver.disconnect();
  }, []);

  useEffect(() => {
    drawStrokes();
  }, [strokes, drawStrokes]);

  const getCoords = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) / rect.width,
      y: (clientY - rect.top) / rect.height,
      clientX,
      clientY
    };
  };

  const handlePointerDown = (e) => {
    if (!active) return;
    if (e.stopPropagation) e.stopPropagation();
    const { x, y, clientX, clientY } = getCoords(e);
    pointerStartRef.current = { x: clientX, y: clientY, time: Date.now() };

    isDrawingRef.current = true;
    if (tool === 'eraser') {
      eraseAt(x, y);
    } else {
      currentStrokeRef.current = {
        color: color,
        width: thickness,
        type: tool,
        points: [{ x, y, t: Date.now() }]
      };
      drawStrokes();
    }
  };

  const handlePointerMove = (e) => {
    if (!isDrawingRef.current || !active) return;
    if (e.stopPropagation) e.stopPropagation();
    const { x, y } = getCoords(e);

    if (tool === 'eraser') {
      eraseAt(x, y);
    } else if (currentStrokeRef.current) {
      currentStrokeRef.current.points.push({ x, y, t: Date.now() });
      drawStrokes();
    }
  };

  const handlePointerUp = (e) => {
    if (active && e.stopPropagation) e.stopPropagation();
    if (!isDrawingRef.current) return;
    isDrawingRef.current = false;

    const timeDiff = Date.now() - pointerStartRef.current.time;
    const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
    const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
    const dist = Math.hypot(clientX - pointerStartRef.current.x, clientY - pointerStartRef.current.y);

    if (dist < 6 && timeDiff < 250) {
      currentStrokeRef.current = null;
      if (!active && onCardClick) onCardClick();
      drawStrokes();
      return;
    }

    if (currentStrokeRef.current && currentStrokeRef.current.points.length > 1) {
      const updatedStrokes = [...(strokes || []), currentStrokeRef.current];
      onStrokesChange(updatedStrokes);
    }
    currentStrokeRef.current = null;
    drawStrokes();
  };

  const eraseAt = (x, y) => {
    const threshold = 0.04;
    const filteredStrokes = (strokes || []).filter(stroke => {
      return !stroke.points.some(p => Math.hypot(p.x - x, p.y - y) < threshold);
    });
    if (filteredStrokes.length !== (strokes || []).length) {
      onStrokesChange(filteredStrokes);
    }
  };

  return (
    <canvas
      ref={canvasRef}
      style={{
        position: 'absolute',
        top: 0,
        left: 0,
        width: '100%',
        height: '100%',
        zIndex: 10,
        pointerEvents: active ? 'auto' : 'none',
        cursor: active ? (tool === 'eraser' ? 'cell' : 'crosshair') : 'default'
      }}
      onMouseDown={handlePointerDown}
      onMouseMove={handlePointerMove}
      onMouseUp={handlePointerUp}
      onMouseLeave={handlePointerUp}
      onTouchStart={handlePointerDown}
      onTouchMove={handlePointerMove}
      onTouchEnd={handlePointerUp}
      onClick={(e) => { if (active) e.stopPropagation(); }}
      onDoubleClick={(e) => { if (active) e.stopPropagation(); }}
    />
  );
}

  const countdownRatio = countdownTotal ? countdownLeft / countdownTotal : 0;

  const wordExamples = (word) => (word?.examples || []).filter(e => e.ja || e.cn).slice(0, cfg.maxExamples);

  const hasFrontRevealContent = (word) => hasMeaningContent(word) || hasUsageContent(word);
  const getTranslationKey = (wordId, exampleIdx) => `${wordId}-${exampleIdx}`;
  const buildFullRevealState = (targetWords) => {

  const progressiveBackward = () => {

        const key = getTranslationKey(word.id, exampleIdx);
        if (example.cn && exampleTranslationMap[key]) {

            const next = { ...prev };
            delete next[key];

          return;

          const next = { ...prev };
          delete next[word.id];
          return next;

        setShowExamplesMap(prev => {
          const next = { ...prev };
          delete next[word.id];
          return next;
        });
        setExampleTranslationMap(prev => {

          examples.forEach((_, exampleIdx) => delete next[getTranslationKey(word.id, exampleIdx)]);

    const pending = currentWords
      .map((word, i) => ({ index: i, word, id: word?.id || String(i) }))

    if (pending.length === 0) return;

    if (pending.length === 1) {

    // 过滤掉词袋中已被揭示或失效的卡片

    let currentBag = (drawBagRef.current || []).filter(item => validPendingIds.has(item.id));

    if (currentBag.length === 0) {

      if (currentBag.length > 1 && currentBag[0].id === lastPickedWordIdRef.current) {

    if (currentBag.length > 1 && currentBag[0].index === selectedCard) {

      if (key === "?" || key === "/") { setShowShortcutHelp(v => !v); return; }

      if (lower === "b" || key === ".") { setIsPaused(v => !v); return; }
      if (isPaused) return;

    const showFullInfo = !isQuizCard || isRevealed;

    const showExamplesBlock = !isQuizCard;

    const subText = quizPhase === "kana" ? (isRevealed ? (w.kanji || "") : "？？？") : quizPhase === "reverse" ? (isRevealed ? w.kana : "？？？") : (w.kanji ? w.kana : "");

    const meaningRevealed = !!(quizPhase || showMeaning);
    const usageRevealed = meaningRevealed;
    const exampleButtonReady = meaningRevealed;
    const examplesRevealed = !!(quizPhase || showExamples);
    const isBackShown = !isQuizCard && cfg.showExamples && examples.length > 0 && !!flippedCardMap[w.id];

    const isSmallGrid = effectiveCount > 1;
    const dynamicBackPadding = isSmallGrid && examples.length >= 3 ? (effectiveCount === 6 ? "6px 8px" : "12px 18px") : cfg.backPadding;
    const dynamicGap = isSmallGrid && examples.length >= 3 ? (effectiveCount === 6 ? "4px" : "7px") : `${Math.max(7, cfg.exJaSize * 0.16)}px`;
    const dynamicExJaSize = isSmallGrid && examples.length >= 3 ? (effectiveCount === 6 ? Math.max(24, cfg.exJaSize - 1) : Math.max(18, cfg.exJaSize - 1)) : cfg.exJaSize;
    const dynamicExCnSize = isSmallGrid && examples.length >= 3 ? (effectiveCount === 6 ? Math.max(18, cfg.exCnSize - 1) : Math.max(14, cfg.exCnSize - 1)) : cfg.exCnSize;
    const dynamicTranslationPadding = effectiveCount === 6 ? "5px 8px" : "8px 12px";
    // 假名注音颜色采用方案一（藏青琉璃蓝 #2D5B88 / 冰蓝粉笔色 #73B7FF），专为教室一体机大屏优化高对比度
    const kanaTextColor = chalkboardMode ? "#73B7FF" : "#2D5B88";
    const accentColor = C.accent || C.primary;
    // 纯假名无汉字时，假名作为正式单词主词显示，颜色使用正式单词主文本色 C.text；有汉字时假名作为注音显示为藏青琉璃蓝/冰蓝色
    const mainAccentCurveProps = {
      color: accentColor,
      textColor: C.text,
    };
    const subAccentCurveProps = {
      color: accentColor,
      textColor: kanaTextColor,
    };

    return (
      <div className={`perspective-container fade-in ${paintActive ? "paint-mode-active-card" : ""} ${!isBackShown && !paintActive ? "tactile-card" : ""} ${isSelected ? "active-card" : ""} ${!isQuizCard && selectedWordId === w.id ? "selected-teach-card" : ""}`} key={w.id} onClick={() => handleCardClick(localIdx)} style={{
        opacity: dimCard ? 0.45 : 1,
        zIndex: isSelected ? 5 : 1,
        transition: "opacity 0.3s cubic-bezier(0.25, 0.8, 0.25, 1)"
      }}>
        <div className={`flip-card-inner ${isBackShown ? "flipped" : ""}`}
          style={{
            cursor: isBackShown ? "default" : (isQuizCard && status === "pending" ? "pointer" : "pointer")
          }}>

          {/* FRONT FACE */}
          <div className="flip-card-front" style={{ display: "flex", flexDirection: "row", gap: 0, alignItems: "stretch", height: "100%", width: "100%", pointerEvents: isBackShown ? "none" : "auto" }}>
            {hasImage && (
              <div style={{ flex: cfg.imgFlex, background: chalkboardMode ? "rgba(255,255,255,0.035)" : "rgba(0,0,0,0.02)",
                borderRadius: "20px 0 0 20px", display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden", minHeight: 0, position: "relative", zIndex: 1 }}>
                <img src={w.imageUrl} alt=""
                  style={{ width: "100%", height: "100%", objectFit: "contain", cursor: !quizPhase ? "zoom-in" : "default", transition: "transform 0.3s" }}
                  onClick={(e) => {
                    if (!quizPhase) {
                      e.stopPropagation();
                      setZoomedImage(w.imageUrl);
                    }
                  }}
                  onError={e => e.currentTarget.parentElement.style.display = "none"} />
                {quizPhase === "kana" && !isRevealed && (
                  <div className="kana-image-mask" style={{ position: "absolute", top: 0, right: 0, bottom: 0, left: 0, width: "100%", height: "100%", minWidth: "100%", minHeight: "100%", background: "#000000", display: "flex", alignItems: "center", justifyContent: "center", borderRadius: "20px 0 0 20px", zIndex: 2, pointerEvents: "none" }}>
                    <span style={{ fontSize: 48, color: "rgba(255,255,255,0.3)", fontWeight: 700 }}>？</span>
                  </div>
                )}
              </div>
            )}
            <div style={{ flex: 1, minWidth: 0, padding: cfg.textPadding, display: "flex", flexDirection: "column", justifyContent: "center", gap: effectiveCount === 1 ? 20 : 8, textAlign: noImageSingle ? "center" : "left", position: "relative", zIndex: 3 }}>
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", width: "100%", textAlign: "center", position: "relative", zIndex: 3, flexShrink: 0 }}>
                
                {showMainCurve ? (
                  <div style={{ margin: "4px 0 2px", maxWidth:"100%", overflow:"visible" }}>
                    <VisualAccentCurve kana={w.kana} accent={w.accent} fontSize={noImageSingle ? cfg.noImgKanjiSize : cfg.kanjiSize} {...mainAccentCurveProps} />
                  </div>
                ) : (
                  <div className="card-main-text" style={{ width: "100%", fontSize: noImageSingle ? cfg.noImgKanjiSize : cfg.kanjiSize, fontWeight: 700, fontFamily: SF, color: isQuizCard && !isRevealed && quizPhase === "reverse" ? C.border : C.text, lineHeight: 1.12, overflowWrap: "anywhere", textAlign: "center", borderBottom: isQuizCard && !isRevealed && quizPhase === "reverse" ? `2px dashed ${C.border}` : "none", display: "block" }}>{mainText}</div>
                )}

                {subText && (
                  showSubCurve ? (
                    <div style={{ marginTop: 2, maxWidth:"100%", overflow:"visible" }}>
                      <VisualAccentCurve kana={w.kana} accent={w.accent} fontSize={cfg.kanaSize} {...subAccentCurveProps} />
                    </div>
                  ) : (
                    <div className="card-sub-text" style={{ width: "100%", fontSize: (quizPhase === "kana" || (quizPhase === "reverse" && !isRevealed)) ? cfg.kanjiSize : cfg.kanaSize, color: isQuizCard && !isRevealed ? C.border : kanaTextColor, marginTop: 4, fontFamily: SF, overflowWrap: "anywhere", textAlign: "center", borderBottom: "none", boxShadow: "none", outline: "none", display: "block" }}>{subText}</div>
                  )
                )}

                {showTags && <div style={{ display: "flex", gap: 8, marginTop: 12, alignItems: "center", justifyContent: "center", flexWrap: "wrap" }}>
                  {(!w.accent || showMainCurve || showSubCurve) ? null : (
                    <span style={{ padding: cfg.tagPadding, borderRadius: cfg.tagRadius, background: C.primaryLight, color: C.primary, fontSize: cfg.tagSize, fontWeight: 600 }}>声调 {w.accent}</span>
                  )}
                  <span style={{ padding: cfg.tagPadding, borderRadius: cfg.tagRadius, background: C.greenLight, color: C.green, fontSize: cfg.tagSize, fontWeight: 600 }}>{w.pos}</span>
                </div>}
              </div>

              {showMeaningBlock && (
                <div style={{
                  flex: 0,
                  display: "flex",
                  flexDirection: "column",
                  justifyContent: "center",
                  textAlign: "center",
                }}>
                  {w.meaning && (
                    <div className="card-meaning-text" style={{
                      fontSize: cfg.meaningSize,
                      fontWeight: 700,
                      color: C.primary,
                      lineHeight: 1.22,
                      overflowWrap: "anywhere",
                      textAlign: "center",
                      filter: meaningRevealed ? "none" : `blur(${cfg.blurRadius}px)`,
                      opacity: meaningRevealed ? 1 : 0.15,
                      transform: "scale(1)",
                      transition: "filter 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.55s cubic-bezier(0.25, 0.8, 0.25, 1)"
                    }}>{smartBreak(w.meaning, "cn", cfg.meaningSize)}</div>
                  )}
                  {cfg.showUsage && w.usage && (quizPhase !== "kana" || isRevealed) && (
                    <div className="card-usage-text" style={{
                      fontSize: cfg.usageSize,
                      color: C.muted,
                      marginTop: 6,
                      lineHeight: 1.35,
                      textAlign: "center",
                      filter: usageRevealed ? "none" : `blur(${cfg.blurRadius}px)`,
                      opacity: usageRevealed ? 1 : 0.15,
                      transform: "scale(1)",
                      transition: "filter 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.55s cubic-bezier(0.25, 0.8, 0.25, 1)"
                    }}>💡 {smartBreak(w.usage, "cn", cfg.usageSize)}</div>
                  )}
                  {!isQuizCard && examples.length > 0 && (
                    <button onClick={(e) => {
                      e.stopPropagation();
                      if (!exampleButtonReady) return;
                      if (isFlippingRef.current) return;
                      isFlippingRef.current = true;
                      lastClickedBtnRef.current = true;

                      // Execute flip
                      setShowExamplesMap(p => ({ ...p, [w.id]: true }));
                      setFlippedCardMap(p => ({ ...p, [w.id]: true }));
                      setExampleTranslationMap(p => {
                        const next = { ...p };
                        examples.forEach((_, idx) => delete next[`${w.id}-${idx}`]);
                        return next;
                      });

                      setTimeout(() => {
                        isFlippingRef.current = false;
                        lastClickedBtnRef.current = false;
                      }, 680);
                    }}
                      style={{ alignSelf: "center", marginTop: 8, padding: effectiveCount === 1 ? "10px 24px" : "8px 20px", borderRadius: 24, border: "none", background: C.primary, color: "#fff", fontSize: Math.max(15, cfg.tagSize + 2), fontWeight: 800, cursor: exampleButtonReady ? "pointer" : "default", boxShadow: "0 4px 16px rgba(200,64,45,0.25)", visibility: exampleButtonReady ? "visible" : "hidden", pointerEvents: exampleButtonReady ? "auto" : "none", letterSpacing: 0, transform: "translateY(50%)" }}>
                      📖 例句
                    </button>
                  )}
                </div>
              )}

              <div style={{ display: "flex", justifyContent: "center" }}>
                {isQuizCard && showExamplesBlock && cfg.showExamples && examples.length > 0 && (
                  <div style={{
                    width: "fit-content",
                    maxWidth: "100%",
                    filter: examplesRevealed ? "none" : `blur(${cfg.blurRadius}px)`,
                    opacity: examplesRevealed ? 1 : 0.15,
                    transform: examplesRevealed ? "scale(1)" : "scale(0.96)",
                    letterSpacing: examplesRevealed ? "normal" : "3px",
                    transition: "filter 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), transform 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), letter-spacing 0.55s cubic-bezier(0.25, 0.8, 0.25, 1)"
                  }}>
                    {examples.map((ex, i) => (
                      <div key={i} style={{ marginBottom: 6, paddingLeft: 8, borderLeft: `${cfg.exBarWidth}px solid ${C.primary}`, textAlign: "left" }}>
