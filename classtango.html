                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
            <CanvasPaint
              wordId={w.id}
              face="front"
              active={paintActive}
              color={paintColor}
              thickness={paintThickness}
              tool={paintTool}
              strokes={strokesRegistry[w.id]?.front || []}
              onStrokesChange={(newStrokes) => {
                setStrokesRegistry(prev => ({
                  ...prev,
                  [w.id]: {
                    front: newStrokes,
                    back: prev[w.id]?.back || []
                  }
                }));
              }}
              onCardClick={() => handleCardClick(localIdx)}
              themeC={C}
            />
          </div>

          {/* BACK FACE */}
          <div className="flip-card-back"
            style={{
              width: "100%",
              height: "100%",
              padding: dynamicBackPadding,
              display: "flex",
              flexDirection: "column",
              justifyContent: "center",
              background: C.card,
              position: "absolute",
              cursor: "pointer",
              pointerEvents: isBackShown ? "auto" : "none",
              zIndex: isBackShown ? 5 : 2
            }}>
            <div style={{
              display: "flex",
              flexDirection: "column",
              gap: dynamicGap,
              justifyContent: "center",
              alignItems: "stretch",
              flex: 1,
              minHeight: 0,
              width: "fit-content",
              maxWidth: "100%",
              alignSelf: "center",
              textAlign: "left"
            }}>
              {examples.map((ex, i) => (
                <div key={i} onClick={(e) => e.stopPropagation()} style={{ width: "100%", paddingLeft: Math.max(10, cfg.exBarWidth * 4), borderLeft: `${cfg.exBarWidth}px solid ${C.primary}`, textAlign: "left", cursor: "default" }}>
                  <div className="card-example-ja" style={{ fontSize: dynamicExJaSize, color: C.text, fontFamily: SF, fontWeight: 700, lineHeight: 1.32, overflowWrap: "anywhere" }}>
                    {smartBreak(ex.ja, "ja", dynamicExJaSize)}
                  </div>
                  {ex.cn && (
                    <div onClick={(e) => {
                      e.stopPropagation();
                      setExampleTranslationMap(p => ({ ...p, [`${w.id}-${i}`]: !p[`${w.id}-${i}`] }));
                    }}
                      style={{
                        position: "relative",
                        marginTop: 6,
                        cursor: "pointer",
                        borderRadius: 8,
                        overflow: "hidden",
                        background: isTranslationRevealed(i) ? "transparent" : "rgba(200, 64, 45, 0.04)",
                        border: isTranslationRevealed(i) ? "1px solid transparent" : "1px solid rgba(200, 64, 45, 0.12)",
                        padding: dynamicTranslationPadding,
                        transition: "background 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.3s cubic-bezier(0.25, 0.8, 0.25, 1)",
                        width: "fit-content",
                        maxWidth: "100%",
                        minWidth: "130px"
                      }}>
                      <div className="card-example-cn" style={{
                        fontSize: dynamicExCnSize,
                        color: isTranslationRevealed(i) ? C.muted : "rgba(200, 64, 45, 0.35)",
                        lineHeight: 1.32,
                        overflowWrap: "anywhere",
                        filter: isTranslationRevealed(i) ? "none" : `blur(${Math.min(4, cfg.blurRadius * 0.5)}px)`,
                        opacity: isTranslationRevealed(i) ? 1 : 0.4,
                        transform: "scale(1)",
                        letterSpacing: "normal",
                        transition: "filter 0.5s ease, opacity 0.5s ease, transform 0.5s ease"
                      }}>
                        {smartBreak(ex.cn, "cn", dynamicExCnSize)}
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
            <CanvasPaint
              wordId={w.id}
              face="back"
              active={paintActive}
              color={paintColor}
              thickness={paintThickness}
              tool={paintTool}
              strokes={strokesRegistry[w.id]?.back || []}
              onStrokesChange={(newStrokes) => {
                setStrokesRegistry(prev => ({
                  ...prev,
                  [w.id]: {
                    front: prev[w.id]?.front || [],
                    back: newStrokes
                  }
                }));
              }}
              onCardClick={() => handleCardClick(localIdx)}
              themeC={C}
            />
          </div>

        </div>
      </div>
    );
  };
  const startQuiz = () => {
    clearCountdownTimer();
    const frontState = Object.fromEntries(pageWords.map((w, i) => [i, hasFrontRevealContent(w)]));
    setShowMeaningMap(frontState);
    setShowUsageMap(frontState);
    setShowExamplesMap(Object.fromEntries(pageWords.map((w, i) => [i, (w.examples || []).some(e => e.ja)])));
    setCountdownLeft(0);
    setSelectedCard(null);
    setQuizWords([]);
    setCardStatus({});
    setQuizPhase("countdown");
  };
  const renderStageBar = () => {
    const phases = [
      { key:"countdown", label:"限时记忆" },
      { key:"kana", label:"听写测试" },
      { key:"reverse", label:"认读测试" },
    ];
    const activeIdx = quizPhase === "result" ? phases.length : Math.max(0, phases.findIndex(p => p.key === quizPhase));
    return (
      <div style={{ height:32, flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center", position:"relative", borderTop:`1px solid ${C.borderLight}`, background:C.card }}>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          {phases.map((p, i) => {
            const done = activeIdx >= i;
            return (
              <React.Fragment key={p.key}>
                {i > 0 && <div style={{ width:70, height:2, background:activeIdx >= i ? C.primary : C.borderLight }} />}
                <div style={{ display:"flex", alignItems:"center", gap:6, color:done?C.primary:C.muted, fontSize:13, fontWeight:done?700:500 }}>
                  <span style={{ fontSize:14 }}>{done ? "●" : "○"}</span>{p.label}
                </div>
              </React.Fragment>
            );
          })}
        </div>
        <button onClick={resetQuizState} style={{ position:"absolute", right:16, top:4, height:24, padding:"0 10px", borderRadius:12, border:`1px solid ${C.border}`, background:C.bg, color:C.muted, fontSize:12, fontWeight:700, cursor:"pointer" }}>✕ 退出</button>
      </div>
    );
  };
  const renderResult = () => (
    <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:22, padding:40, textAlign:"center" }}>
      <div style={{ fontSize:34, fontWeight:900, color:C.text }}>测试完成</div>
      <div style={{ fontSize:16, color:C.muted, lineHeight:1.6 }}>本页听写与认读互动已结束</div>
      <div style={{ display:"flex", gap:14, marginTop:16 }}>
        <button onClick={restartQuiz} style={{ padding:"10px 28px", borderRadius:12, background:C.primary, color:"#fff", fontSize:15, fontWeight:700, border:"none", cursor:"pointer" }}>🔄 重新测试</button>
        <button onClick={exitAndNextPage} style={{ padding:"10px 28px", borderRadius:12, background:C.bg, border:`1px solid ${C.border}`, color:C.text, fontSize:15, fontWeight:700, cursor:"pointer" }}>→ 下一页继续授课</button>
      </div>
    </div>
  );
  const syncStatusText = syncMeta.loading ? "云端同步中" : (syncMeta.status === "error" ? "云端同步异常" : syncMeta.status === "dirty" ? "待同步" : "云端同步正常");
  const syncColor = syncMeta.loading ? C.blue : (syncMeta.status === "error" ? C.wrong : syncMeta.status === "dirty" ? C.accent : C.correct);
  const modeOptions = [
    { key:"edit", label:"编辑" },
    { key:"teach", label:"授课" },
    { key:"practice", label:"练习" },
  ];
  const jumpByTrack = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    goPage(Math.round(ratio * (totalPages - 1)));
  };
  const teachToolButtonStyle = {
    height:34,
    padding:"0 12px",
    borderRadius:17,
    border:`1px solid ${C.border}`,
    background:C.card,
    color:C.text,
    fontSize:12,
    fontWeight:800,
    cursor:"pointer",
    whiteSpace:"nowrap",
  };

  return (
    <div style={{
      height:"100%",
      overflow:"hidden",
      background:C.bg,
      color:C.text,
      display:"flex",
      flexDirection:"column",
      position:"relative",
      "--card-bg":C.card,
      "--border-color":C.border,
      "--primary-color":C.primary,
      "--primary-light":C.primaryLight,
      "--teach-shadow":chalkboardMode ? "0 18px 44px rgba(0,0,0,0.34), inset 0 0 0 1px rgba(255,255,255,0.035)" : "0 4px 18px rgba(0,0,0,0.02)"
    }}>
      {quizPhase && renderStageBar()}

      {/* Card */}
      <div style={{ flex:1, display:"flex", alignItems:"stretch", justifyContent:"stretch", padding:0, minHeight:0, overflow:"hidden", position:"relative" }}>
        {quizPhase === "result" ? renderResult() : (
        <div className={`teach-grid-container teach-grid-count-${effectiveCount}`} style={{ width:"100%", height:"100%", display:"grid", gap:"10px", padding:"10px",
          gridTemplateColumns:`repeat(${gridColumns}, minmax(0, 1fr))`,
          gridTemplateRows:`repeat(${gridRows}, minmax(0, 1fr))`,
          justifyContent:"center", alignItems:"stretch" }}>
          {currentWords.map((word, i) => (
            <div key={word.id} style={{ minHeight:0, height:"100%", width:"100%" }}>
              {renderCard(word, i)}
            </div>
          ))}
        </div>
        )}
        {quizPhase === "countdown" && countdownLeft === 0 && (
          <div className="center-overlay" style={{ position:"absolute", top:0, right:0, bottom:0, left:0, width:"100%", height:"100%", background:"rgba(247,243,237,0.72)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:30, textAlign:"center" }}>
            <div className="center-overlay-cell" style={{ width:"100%", textAlign:"center" }}>
              <div className="pop-in center-dialog" style={{ display:"inline-block", background:C.card, borderRadius:16, padding:"32px 40px", boxShadow:"0 8px 30px rgba(0,0,0,0.1)", textAlign:"center", border:`1px solid ${C.borderLight}` }}>
                <div style={{ fontSize:22, fontWeight:700, color:C.text, marginBottom:22 }}>选择记忆时间</div>
                <div style={{ display:"flex", gap:12, justifyContent:"center" }}>
                  {[30,60,90].map(sec => (
                    <button key={sec} onClick={()=>startCountdown(sec)}
                      style={{ padding:"8px 22px", borderRadius:20, border:"none", cursor:"pointer", background:sec===countdownTotal?C.primary:C.bg, color:sec===countdownTotal?"#fff":C.muted, fontSize:14, fontWeight:700 }}>
                      {`${sec}秒`}
                    </button>
                  ))}
                </div>
                <button onClick={enterKanaPhase}
                  style={{ marginTop:16, height:32, padding:"0 18px", borderRadius:16, border:`1.5px solid ${C.border}`, background:C.bg, color:C.text, fontSize:13, fontWeight:800, cursor:"pointer" }}>
                  跳过记忆，直接听写
                </button>
              </div>
            </div>
          </div>
        )}
        {isPaused && (
          <div style={{ position:"absolute", top:0, right:0, bottom:0, left:0, background:C.bg, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", zIndex:55, color:C.text }}>
            <div style={{ fontSize:15, color:C.muted, fontWeight:700, marginBottom:8, maxWidth:"80%", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{group.name}</div>
            <div style={{ fontSize:34, fontWeight:900, color:C.primary, letterSpacing:0 }}>暂停中</div>
            <div style={{ marginTop:10, fontSize:42, color:C.primary, lineHeight:1 }}>◷</div>
          </div>
        )}
      </div>

      {showShortcutHelp && (
        <div onClick={() => setShowShortcutHelp(false)} style={{ position:"absolute", top:0, right:0, bottom:0, left:0, zIndex:80, background:"rgba(30,30,30,0.38)", display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
          <div onClick={e=>e.stopPropagation()} className="pop-in" style={{ width:880, maxWidth:"94vw", maxHeight:"86vh", overflowY:"auto", background:C.card, border:`1px solid ${C.border}`, borderRadius:18, boxShadow:"0 24px 80px rgba(0,0,0,0.22)", padding:"24px 28px", color:C.text }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18 }}>
              <div style={{ fontSize:24, fontWeight:900, color:C.text }}>快捷键速查</div>
              <button onClick={() => setShowShortcutHelp(false)} style={{ width:32, height:32, borderRadius:"50%", border:`1px solid ${C.border}`, background:C.bg, cursor:"pointer", color:C.muted, fontWeight:900 }}>×</button>
            </div>
            <div style={{ padding:"16px 18px", borderRadius:14, background:C.primaryLight, border:`1px solid rgba(200,64,45,0.16)`, marginBottom:18 }}>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:12, flexWrap:"wrap", marginBottom:10 }}>
                {["图", "释义", "例句", "翻译"].map((label, i) => (
                  <React.Fragment key={label}>
                    {i > 0 && <span style={{ color:C.primary, fontWeight:900 }}>→</span>}
                    <span style={{ minWidth:70, textAlign:"center", padding:"8px 14px", borderRadius:18, background:i<=revealLayer?C.primary:C.card, color:i<=revealLayer?"#fff":C.muted, fontWeight:900 }}>{label}</span>
                  </React.Fragment>
                ))}

/* ===== PRACTICE: FLASHCARD ===== */
function FlashcardPractice({ words, onBack, C, onStateChange }) {
  const wordsRef = useRef(words);
  wordsRef.current = words;

  const [deck, setDeck] = useState(() => shuffle(words));
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [known, setKnown] = useState(0);

  const reset = useCallback(() => {
    setDeck(shuffle(wordsRef.current));
    setIdx(0);
    setFlipped(false);
    setKnown(0);
  }, []);

  const w = deck[idx];
  const next = useCallback((ok) => {
    if (ok) setKnown(k => k + 1);
    setFlipped(false);
    setTimeout(() => setIdx(i => i + 1), 120);
  }, []);

  useEffect(() => {
    if (onStateChange) {
      onStateChange({
        title: "闪卡记忆",
        progressText: idx >= deck.length ? "练习已完成" : `${idx + 1} / ${deck.length}`,
        flipped,
        isDone: idx >= deck.length,
        markKnown: () => next(true),
        markUnknown: () => next(false),
        reset,
      });
    }
  }, [idx, deck.length, flipped, onStateChange, next, reset]);

  if (idx >= deck.length) return (
    <div className="fade-in" style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:40, color:C.text }}>
      <div style={{ fontSize:64, marginBottom:16 }}>🎉</div>
      <div style={{ fontSize:32, fontWeight:800, marginBottom:10 }}>练习完成！</div>
      <div style={{ fontSize:18, color:C.muted, marginBottom:32 }}>已掌握 {known} / {deck.length} 个单词（正确率 {Math.round(known / deck.length * 100)}%）</div>
      <div style={{ width:320, maxWidth:"80vw", height:12, background:C.borderLight, borderRadius:6, margin:"0 auto 36px", overflow:"hidden" }}>
        <div style={{ width:`${(known/deck.length)*100}%`, height:"100%", background: known===deck.length?C.green:C.primary, borderRadius:6, transition:"width 0.5s" }}/>
      </div>
      <div style={{ display:"flex", gap:16, justifyContent:"center" }}>
        <button onClick={reset} style={sBtn(C.primary, "#fff", {fontWeight:700, padding:"12px 32px", fontSize:16, borderRadius:12})}>🔄 再来一次</button>
        <button onClick={onBack} style={sBtn(C.bg, C.text, {border:`1.5px solid ${C.border}`, padding:"12px 32px", fontSize:16, borderRadius:12})}>返回</button>
      </div>
    </div>
  );

  return (
    <div style={{ flex:1, minHeight:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"space-between", padding:"16px 28px 24px" }}>
      <div style={{ color:C.muted, fontSize:15, fontWeight:700, letterSpacing:1 }}>闪卡记忆 · 第 {idx+1} 题 / 共 {deck.length} 题</div>
      
      <div onClick={()=>setFlipped(!flipped)} className={flipped?"fade-in":""}
        style={{
          width: "min(1080px, 94vw)",
          flex: 1,
          minHeight: "min(460px, 58vh)",
          maxHeight: "68vh",
          background: C.card,
          borderRadius: 28,
          padding: "36px 48px",
          cursor: "pointer",
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          justifyContent: "center",
          textAlign: "center",
          border: `1.5px solid ${flipped ? "rgba(200,64,45,0.25)" : C.borderLight}`,
          boxShadow: "0 14px 48px rgba(0,0,0,0.07)",
          transition: "all 0.25s ease",
          position: "relative",
          userSelect: "none"
        }}>
        {!flipped ? (
          <>
            <div style={{ fontSize:"clamp(52px, 6.5vw, 84px)", fontWeight:800, fontFamily:SF, color:C.text, lineHeight:1.15 }}>{w.kanji || w.kana}</div>
            {w.kanji && <div style={{ fontSize:"clamp(24px, 2.6vw, 36px)", color:C.blue || "#2D5B88", marginTop:16, fontFamily:SF, fontWeight:700 }}>{w.kana}</div>}
            <div style={{ position:"absolute", bottom:20, color:C.hint, fontSize:13, fontWeight:600 }}>👆 点击卡片翻面查看中文释义</div>
          </>
        ) : (
          <>
            {w.imageUrl && (
              <div style={{ width:180, maxHeight:110, background:"rgba(255,255,255,0.03)", borderRadius:14, marginBottom:16, display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden" }}>
                <img src={w.imageUrl} alt="" style={{ width:"100%", maxHeight:110, objectFit:"contain", borderRadius:14 }} onError={e=>e.currentTarget.parentElement.style.display="none"}/>
              </div>
            )}
            <div style={{ fontSize:"clamp(34px, 4.2vw, 54px)", fontWeight:800, color:C.primary, marginBottom:8 }}>{w.meaning}</div>
            <div style={{ fontSize:"clamp(15px, 1.8vw, 18px)", color:C.muted, marginBottom:14 }}>{w.pos}{w.accent?` · 声调 ${w.accent}`:""}</div>
            {w.examples.filter(e=>e.ja).length > 0 && (
              <div style={{ marginTop:12, fontSize:"clamp(18px, 2vw, 24px)", color:C.muted, fontFamily:SF, lineHeight:1.6, maxWidth:"90%" }}>{w.examples[0].ja}</div>

              已掌握 ✌️
            </button>
          </div>
        ) : (
          <div style={{ height:52 }} />
        )}
      </div>
    </div>
  );
}

/* ===== PRACTICE: CHOICE ===== */
function ChoicePractice({ words, onBack, C, onStateChange }) {
  const [mode, setMode] = useState("ja2cn");
  const wordsRef = useRef(words);
  wordsRef.current = words;

  const generate = useCallback((m, wordList = wordsRef.current) => {
    if (!wordList || wordList.length === 0) return [];
    return shuffle(wordList).map(w => {
      const pool = wordList.filter(x => x.id !== w.id);
      const wrongs = shuffle(pool).slice(0, Math.min(3, pool.length));
      const opts = shuffle([
        { label: m === "cn2ja" ? w.kana : w.meaning, correct: true },
        ...wrongs.map(x => ({ label: m === "cn2ja" ? x.kana : x.meaning, correct: false }))
      ]);
      return { word: w, options: opts };
    });
  }, []);

  // 惰性初始化题目，避免初次挂载时 questions 为空并在此后通过 useEffect 再次触发洗牌与二次刷新
  const [questions, setQuestions] = useState(() => generate("ja2cn", words));
  const [qi, setQi] = useState(0);
  const [sel, setSel] = useState(null);
  const [score, setScore] = useState(0);

  const handleModeChange = useCallback((newMode) => {
    setMode(newMode);
    setQuestions(generate(newMode, wordsRef.current));
    setQi(0);
    setSel(null);
    setScore(0);
  }, [generate]);

  const handleReset = useCallback(() => {
    setQuestions(generate(mode, wordsRef.current));
    setQi(0);
    setSel(null);
    setScore(0);
  }, [generate, mode]);

  useEffect(() => {
    if (onStateChange) {
      onStateChange({
        title: "选择题",
        progressText: qi >= questions.length ? "练习已完成" : `${qi + 1} / ${questions.length}`,
        isDone: qi >= questions.length,
        mode,
        setMode: handleModeChange,
        reset: handleReset,
      });
    }
  }, [qi, questions.length, mode, onStateChange, handleModeChange, handleReset]);

  if (!questions.length) return null;

  if (qi >= questions.length) return (
    <div className="fade-in" style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:40, color:C.text }}>
      <div style={{ fontSize:64, marginBottom:16 }}>{score>=questions.length*0.8?"🏆":score>=questions.length*0.5?"👍":"💪"}</div>
      <div style={{ fontSize:32, fontWeight:800, marginBottom:10 }}>得分：{score} / {questions.length}</div>
      <div style={{ fontSize:18, color:C.muted, marginBottom:32 }}>正确率 {Math.round(score/questions.length*100)}%</div>
      <div style={{ display:"flex", gap:16, justifyContent:"center" }}>
        <button onClick={handleReset} style={sBtn(C.primary,"#fff",{fontWeight:700, padding:"12px 32px", fontSize:16, borderRadius:12})}>🔄 再来一次</button>
        <button onClick={onBack} style={sBtn(C.bg,C.text,{border:`1.5px solid ${C.border}`, padding:"12px 32px", fontSize:16, borderRadius:12})}>返回</button>
      </div>
    </div>
  );

  const q = questions[qi];
  const pick = (i) => {
    if (sel !== null) return;
    setSel(i);
    if (q.options[i].correct) setScore(s=>s+1);
    setTimeout(() => { setSel(null); setQi(qi+1); }, 1000);
  };

  return (
    <div style={{ flex:1, minHeight:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"space-between", padding:"14px 28px 20px" }}>
      <div style={{ width:"min(1160px, 94vw)", display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
        <div style={{ display:"flex", gap:10 }}>
          {[["ja2cn","假名 → 中文"],["cn2ja","中文 → 假名"]].map(([k,l])=>(
            <button key={k} onClick={()=>handleModeChange(k)} style={{ padding:"8px 22px", borderRadius:10, border:`1.5px solid ${mode===k?"rgba(200,64,45,0.25)":C.border}`, background:mode===k?C.primaryLight:"transparent", color:mode===k?C.primary:C.muted, cursor:"pointer", fontSize:14, fontWeight:700, transition:"all 0.15s" }}>{l}</button>
          ))}
        </div>
        <div style={{ color:C.muted, fontSize:15, fontWeight:700 }}>第 {qi+1} 题 / 共 {questions.length} 题</div>
      </div>

      <div className="fade-in" key={qi} style={{
        width: "min(1160px, 94vw)",
        flex: 1,
        minHeight: "min(480px, 62vh)",
        background: C.card,
        borderRadius: 28,
        padding: "36px 48px",
        textAlign: "center",
        border: `1.5px solid ${C.borderLight}`,
        boxShadow: "0 14px 48px rgba(0,0,0,0.07)",
        display: "flex",
        flexDirection: "column",
        justifyContent: "space-between"
      }}>
        <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", minHeight:120 }}>
          {mode==="ja2cn" && q.word.imageUrl && (
            <div style={{ width:200, maxHeight:120, background:"rgba(255,255,255,0.03)", borderRadius:14, margin:"0 auto 16px", display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden" }}>
              <img src={q.word.imageUrl} alt="" style={{ width:"100%", maxHeight:120, objectFit:"contain", borderRadius:14 }} onError={e=>e.currentTarget.parentElement.style.display="none"}/>
            </div>
          )}
          <div style={{ fontSize:"clamp(46px, 5.8vw, 76px)", fontWeight:800, fontFamily:mode==="cn2ja"?CN_FONT:SF, color:C.text, lineHeight:1.15 }}>
            {mode==="cn2ja"?q.word.meaning:q.word.kana}
          </div>
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, width:"100%", marginTop:24 }}>
          {q.options.map((opt,i) => {
            let bg=C.bg, bdr=C.border, clr=C.text;
            if (sel !== null) {
              if (opt.correct) { bg="rgba(58,125,92,0.14)"; bdr="rgba(58,125,92,0.35)"; clr=C.green; }
              else if (i===sel && !opt.correct) { bg="rgba(209,67,67,0.08)"; bdr="rgba(209,67,67,0.25)"; clr=C.wrong; }
            }
            return (
              <button key={i} onClick={()=>pick(i)}
                style={{
                  minHeight: 76,
                  padding: "16px 24px",
                  background: bg,
                  border: `2px solid ${bdr}`,
                  borderRadius: 16,
                  cursor: sel!==null ? "default" : "pointer",
                  color: clr,
                  fontSize: "clamp(20px, 2.2vw, 28px)",
                  fontWeight: 600,
                  fontFamily: mode==="cn2ja"?SF:CN_FONT,
                  transition: "all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1)",
                  animation: sel===i&&!q.options[i].correct ? "shake 0.3s" : "none",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  textAlign: "center"
                }}
                onMouseEnter={e=>{if(sel===null){e.currentTarget.style.background=C.borderLight;e.currentTarget.style.transform="scale(1.01)";}}}
                onMouseLeave={e=>{if(sel===null){e.currentTarget.style.background=C.bg;e.currentTarget.style.transform="none";}}}>
                {opt.label}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ===== PRACTICE: MATCH ===== */
function MatchPractice({ words, onBack, C, onStateChange }) {
  const wordsRef = useRef(words);
  wordsRef.current = words;

  const [items, setItems] = useState(() => shuffle(words).slice(0, Math.min(6, words.length)));
  const [leftOrd] = useState(() => shuffle([...Array(Math.min(6,words.length)).keys()]));
  const [rightOrd] = useState(() => shuffle([...Array(Math.min(6,words.length)).keys()]));
  const [selL, setSelL] = useState(null);
  const [matched, setMatched] = useState(new Set());
  const [wrong, setWrong] = useState(null);
  const [done, setDone] = useState(false);

  const clickL = (i) => { if(matched.has(i)) return; setSelL(i); setWrong(null); };
  const clickR = (i) => {
    if (selL===null || matched.has(i)) return;
    if (selL === i) {
      const nm = new Set([...matched, i]);
      setMatched(nm); setSelL(null);
      if (nm.size === items.length) setTimeout(()=>setDone(true), 350);
    } else {
      setWrong(i);
      setTimeout(() => { setWrong(null); setSelL(null); }, 550);
    }
  };
  const reset = useCallback(() => {
    const ni = shuffle(wordsRef.current).slice(0, Math.min(6, wordsRef.current.length));
    setItems(ni); setMatched(new Set()); setSelL(null); setWrong(null); setDone(false);
  }, []);

  useEffect(() => {
    if (onStateChange) {
      onStateChange({
        title: "配对连线",
        progressText: done ? "练习已完成" : `已完成 ${matched.size} / ${items.length}`,
        isDone: done,
        reset,
      });
    }
  }, [matched.size, items.length, done, onStateChange, reset]);

  if (done) return (
    <div className="fade-in" style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:40, color:C.text }}>
      <div style={{ fontSize:64, marginBottom:16 }}>✨</div>
      <div style={{ fontSize:32, fontWeight:800, marginBottom:28 }}>全部配对成功！</div>
      <div style={{ display:"flex", gap:16, justifyContent:"center" }}>
        <button onClick={reset} style={sBtn(C.primary,"#fff",{fontWeight:700, padding:"12px 32px", fontSize:16, borderRadius:12})}>🔄 再来一次</button>
        <button onClick={onBack} style={sBtn(C.bg,C.text,{border:`1.5px solid ${C.border}`, padding:"12px 32px", fontSize:16, borderRadius:12})}>返回</button>
      </div>
    </div>
  );

  return (
    <div style={{ flex:1, minHeight:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"space-between", padding:"14px 28px 20px" }}>
      <div style={{ color:C.muted, fontSize:15, fontWeight:700, marginBottom:10 }}>配对连线 · 已完成 {matched.size} / {items.length}</div>
      
      <div style={{
        width: "min(1240px, 95vw)",
        flex: 1,
        minHeight: "min(480px, 64vh)",
        background: C.card,
        borderRadius: 28,
        padding: "32px 48px",
        border: `1.5px solid ${C.borderLight}`,
        boxShadow: "0 14px 48px rgba(0,0,0,0.07)",
        display: "flex",
        flexDirection: "column",
        justifyContent: "space-between"
      }}>
        <div style={{ display:"flex", gap:"clamp(36px, 6vw, 80px)", width:"100%", flex:1, alignItems:"stretch" }}>
          <div style={{ flex:1, display:"flex", flexDirection:"column", justifyContent:"space-between" }}>
            <div style={{ fontSize:18, color:C.muted, fontWeight:800, textAlign:"center", marginBottom:12, letterSpacing:2 }}>假 名</div>
            <div style={{ flex:1, display:"flex", flexDirection:"column", justifyContent:"space-around", gap:10 }}>
              {leftOrd.map(i => {
                const w=items[i]; const m=matched.has(i); const s=selL===i;
                return (
                  <button key={i} onClick={()=>clickL(i)} disabled={m}
                    style={{
                      flex: 1,
                      minHeight: 56,
                      padding: "12px 20px",
                      background: m ? C.greenLight : s ? C.primaryLight : C.bg,
                      border: `2px solid ${m ? "rgba(58,125,92,0.35)" : s ? "rgba(200,64,45,0.4)" : C.border}`,
                      borderRadius: 14,
                      cursor: m ? "default" : "pointer",
                      fontSize: "clamp(22px, 2.5vw, 30px)",
                      fontFamily: SF,
                      fontWeight: 700,
                      color: m ? C.green : s ? C.primary : C.text,
                      transition: "all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1)",
                      opacity: m ? 0.45 : 1,
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      transform: s ? "scale(1.02)" : "none",
                      boxShadow: s ? `0 4px 16px ${C.primary}33` : "none"
                    }}>
                    {w.kana}
                  </button>
                );
              })}
            </div>
          </div>

          <div style={{ flex:1, display:"flex", flexDirection:"column", justifyContent:"space-between" }}>
            <div style={{ fontSize:18, color:C.muted, fontWeight:800, textAlign:"center", marginBottom:12, letterSpacing:2 }}>中 文</div>
            <div style={{ flex:1, display:"flex", flexDirection:"column", justifyContent:"space-around", gap:10 }}>
              {rightOrd.map(i => {
                const w=items[i]; const m=matched.has(i); const isW=wrong===i;
                return (
                  <button key={i} onClick={()=>clickR(i)} disabled={m}
                    style={{
                      flex: 1,
                      minHeight: 56,
                      padding: "12px 20px",
                      background: m ? C.greenLight : isW ? "rgba(209,67,67,0.08)" : C.bg,
                      border: `2px solid ${m ? "rgba(58,125,92,0.35)" : isW ? "rgba(209,67,67,0.3)" : C.border}`,
                      borderRadius: 14,
                      cursor: m ? "default" : "pointer",
                      fontSize: "clamp(18px, 2.1vw, 26px)",
                      fontWeight: 600,
                      fontFamily: CN_FONT,
                      color: m ? C.green : isW ? C.wrong : C.text,
                      transition: "all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1)",
                      opacity: m ? 0.45 : 1,
                      animation: isW ? "shake 0.35s" : "none",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center"
                    }}>
                    {w.meaning}
                  </button>
                );
              })}
            </div>
          </div>
        </div>

        <div style={{ color:C.hint, fontSize:14, fontWeight:600, marginTop:16, textAlign:"center" }}>💡 提示：先点击左侧假名，再点击右侧对应中文释义完成配对</div>
      </div>
    </div>
  );
}

/* ===== PRACTICE WRAPPER ===== */
function PracticeMode({ groups, gid: curGid, chalkboardMode, onPracticeStateChange }) {
  const group = groups.find(g => g.id === curGid);
  // 使用 useMemo 稳定缓存 practiceWords 数组引用，杜绝父子组件循环重渲染
  const practiceWords = useMemo(() => {
    return (group?.words || []).filter(w => w.hidden !== true);
  }, [group]);
  const hiddenCount = (group?.words || []).filter(w => w.hidden === true).length;
  const [type, setType] = useState(null);
  const [subPracticeState, setSubPracticeState] = useState(null);
  const C = chalkboardMode ? TEACH_CHALK : TEACH_LIGHT;

  useEffect(() => {
    if (!type) {
      setSubPracticeState(null);
    }
  }, [type]);

  useEffect(() => {
    if (onPracticeStateChange) {
      if (!type) {
        onPracticeStateChange({
          type: null,
          title: "选择练习方式",
          progressText: `${group?.name || ""} · ${practiceWords.length} 个单词${hiddenCount ? ` · 已过滤 ${hiddenCount} 个隐藏词` : ""}`,
          setType,
        });
      } else {
        onPracticeStateChange({
          type,
          title: subPracticeState?.title || "",
          progressText: subPracticeState?.progressText || "",
          flipped: subPracticeState?.flipped,
          isDone: subPracticeState?.isDone,
          markKnown: subPracticeState?.markKnown,
          markUnknown: subPracticeState?.markUnknown,
          mode: subPracticeState?.mode,
          setMode: subPracticeState?.setMode,
          reset: subPracticeState?.reset,
          setType,
        });
      }
    }
  }, [type, subPracticeState, group?.name, practiceWords.length, hiddenCount, onPracticeStateChange]);

  if (!group || practiceWords.length < 2) return (
    <div style={{ display:"flex", alignItems:"center", justifyContent:"center", height:"100%", overflow:"hidden", background:C.bg, color:C.muted, fontSize:18, fontWeight:600 }}>
      请选择一个包含至少 2 个未隐藏单词的单词组进行练习
    </div>
  );

  if (!type) return (
    <div style={{ height:"100%", overflow:"hidden", background:C.bg, display:"flex", alignItems:"center", justifyContent:"center", padding:"24px" }}>
      <div style={{ textAlign:"center", width:"min(1100px, 94vw)" }}>
        <div style={{ fontSize:15, color:C.muted, fontWeight:700, marginBottom:12 }}>{group.name} · 共 {practiceWords.length} 个练习单词{hiddenCount ? ` · 已过滤 ${hiddenCount} 个隐藏词` : ""}</div>
        <h2 style={{ color:C.text, fontSize:"clamp(28px, 3.2vw, 40px)", fontWeight:800, marginBottom:48, margin:"0 0 48px" }}>选择练习方式</h2>
        <div style={{ display:"flex", gap:24, flexWrap:"wrap", justifyContent:"center" }}>
          {[
            { key:"flash", icon:"🃏", title:"闪卡记忆", desc:"逐张翻面 · 自我检测与攻克" },
            { key:"choice", icon:"✅", title:"选择题", desc:"假名释义 · 四选一快速判断" },
            { key:"match", icon:"🔗", title:"配对连线", desc:"假名中文 · 左右配对强化" },
          ].map(t => (
            <button key={t.key} onClick={()=>setType(t.key)}
              style={{
                width: "clamp(240px, 26vw, 320px)",
                minHeight: 220,
                padding: "36px 28px",
                background: C.card,
                border: `1.5px solid ${C.borderLight}`,
                borderRadius: 24,
                cursor: "pointer",
                textAlign: "center",
                transition: "all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1)",
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                justifyContent: "center",
                boxShadow: "0 8px 30px rgba(0,0,0,0.05)"
              }}
              onMouseEnter={e=>{e.currentTarget.style.borderColor="rgba(200,64,45,0.35)";e.currentTarget.style.transform="translateY(-6px)";e.currentTarget.style.boxShadow="0 14px 40px rgba(200,64,45,0.12)";}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor=C.borderLight;e.currentTarget.style.transform="none";e.currentTarget.style.boxShadow="0 8px 30px rgba(0,0,0,0.05)";}}>
              <div style={{ fontSize:56, marginBottom:16 }}>{t.icon}</div>
              <div style={{ fontSize:22, fontWeight:800, color:C.text, marginBottom:8 }}>{t.title}</div>
              <div style={{ fontSize:14, color:C.muted, lineHeight:1.6 }}>{t.desc}</div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );

  const handleBack = () => setType(null);
  const pp = { words: practiceWords, onBack: handleBack, C, onStateChange: setSubPracticeState };
  return (
    <div style={{ height:"100%", overflow:"hidden", background:C.bg, display:"flex", flexDirection:"column" }}>
      <div style={{ padding:"10px 28px 4px", flexShrink:0, display:"flex", justifyContent:"flex-start" }}>
        <button onClick={()=>setType(null)} style={{ background:C.card, border:`1.5px solid ${C.border}`, borderRadius:10, padding:"8px 18px", cursor:"pointer", color:C.text, fontSize:14, fontWeight:700, transition:"all 0.15s", boxShadow:"0 2px 8px rgba(0,0,0,0.04)" }}
          onMouseEnter={e=>e.currentTarget.style.background=C.borderLight} onMouseLeave={e=>e.currentTarget.style.background=C.card}>
          ← 选择其他练习
        </button>
      </div>
      {type==="flash" && <FlashcardPractice {...pp}/>}
      {type==="choice" && <ChoicePractice {...pp}/>}
      {type==="match" && <MatchPractice {...pp}/>}
    </div>
  );
}

/* ===== STUDENTS MODE ===== */
function StudentsMode({ students, setStudents, pushStudents, pullStudents, syncMeta, groups, challengePassingScores, saveChallengePassingScores, challengeCycle, saveChallengeCycle, themeC }) {
  const C = themeC;
  const [importOpen, setImportOpen] = useState(false);
  const [pasteText, setPasteText] = useState("");
  const [importDraft, setImportDraft] = useState([]);
  const [editingStudentId, setEditingStudentId] = useState(null);
  const [editPasswordVal, setEditPasswordVal] = useState("");
  const [viewProgressStudent, setViewProgressStudent] = useState(null);
  
  // 关卡分层与等级标签相关状态
  const [assignStudentWords, setAssignStudentWords] = useState(null);
  const [batchAssignOpen, setBatchAssignOpen] = useState(false);
  const [batchTargetTag, setBatchTargetTag] = useState("A");
  const [batchSelectedGroups, setBatchSelectedGroups] = useState([]);
  const [passingScoreSettingsOpen, setPassingScoreSettingsOpen] = useState(false);
  const [passingScoreDraft, setPassingScoreDraft] = useState(() => ({
    A: challengePassingScores?.A ?? 90,
    B: challengePassingScores?.B ?? 80,
    C: challengePassingScores?.C ?? 60,
    default: challengePassingScores?.default ?? 80
  }));
  const [cycleSettingsOpen, setCycleSettingsOpen] = useState(false);
  const [cycleDraft, setCycleDraft] = useState(challengeCycle);

  const saveCycleSettings = async () => {
    const targetLevels = Math.max(0, Math.floor(Number(cycleDraft?.targetLevels) || 0));
    await saveChallengeCycle({ id: challengeCycle?.id || `cycle_${Date.now()}`, name: String(cycleDraft?.name || "本周期闯关任务").trim() || "本周期闯关任务", targetLevels, active: !!cycleDraft?.active });
    setCycleSettingsOpen(false);
  };

  const openPassingScoreSettings = () => {
    setPassingScoreDraft({
      A: challengePassingScores?.A ?? 90,
      B: challengePassingScores?.B ?? 80,
      C: challengePassingScores?.C ?? 60,
      default: challengePassingScores?.default ?? 80
    });
    setPassingScoreSettingsOpen(true);
  };

  const savePassingScoreSettings = async () => {
    const next = {
      A: Math.min(100, Math.max(0, Math.floor(Number(passingScoreDraft?.A ?? 90)))),
      B: Math.min(100, Math.max(0, Math.floor(Number(passingScoreDraft?.B ?? 80)))),
      C: Math.min(100, Math.max(0, Math.floor(Number(passingScoreDraft?.C ?? 60)))),
      default: Math.min(100, Math.max(0, Math.floor(Number(passingScoreDraft?.default ?? 80))))
    };
    await saveChallengePassingScores(next);
    setPassingScoreSettingsOpen(false);
  };

  const updateStudentTag = (id, newTag) => {
    const nextList = students.map(s => s.id === id ? { ...s, tag: newTag } : s);
    pushStudents(nextList);
  };

  const handleToggleStudentWordGroup = (studentId, groupKey, checked) => {
    const nextList = students.map(s => {
      if (s.id !== studentId) return s;
      let cur = Array.isArray(s.assignedGroups) ? [...s.assignedGroups] : [];
      if (checked) {
        if (!cur.includes(groupKey)) cur.push(groupKey);
      } else {
        cur = cur.filter(x => x !== groupKey);
      }
      return { ...s, assignedGroups: cur };
    });
    pushStudents(nextList);
    setAssignStudentWords(prev => {
      if (!prev || prev.id !== studentId) return prev;
      let cur = Array.isArray(prev.assignedGroups) ? [...prev.assignedGroups] : [];
      if (checked) {
        if (!cur.includes(groupKey)) cur.push(groupKey);
      } else {
        cur = cur.filter(x => x !== groupKey);
      }
      return { ...prev, assignedGroups: cur };
    });
  };

  const handleApplyBatchAssign = () => {
    if (!batchTargetTag) return;
    const nextList = students.map(s => {
      if (s.tag === batchTargetTag) {
        return { ...s, assignedGroups: [...batchSelectedGroups] };
      }
      return s;
    });
    pushStudents(nextList);
    setBatchAssignOpen(false);
    alert(`已将选中的 ${batchSelectedGroups.length} 个单词关卡批量应用给所有 ${batchTargetTag} 级学生！`);
  };

  // 文件夹折叠与分类状态
  const [selectedPath, setSelectedPath] = useState({ type: "all" });
  const [expandedNodes, setExpandedNodes] = useState({});

  const toggleNode = (nodeId, e) => {
    e.stopPropagation();
    setExpandedNodes(prev => ({ ...prev, [nodeId]: !prev[nodeId] }));
  };

  // 动态解析树状结构
  const studentsTree = useMemo(() => {
    const tree = {};
    students.forEach(s => {
      const campus = s.campus || "未设校区";
      const grade = s.grade || "未设年级";
      const className = s.class_name || "未设班级";
      
      if (!tree[campus]) tree[campus] = {};
      if (!tree[campus][grade]) tree[campus][grade] = new Set();
      tree[campus][grade].add(className);
    });

    const result = [];
    Object.keys(tree).sort().forEach(campus => {
      const grades = [];
      Object.keys(tree[campus]).sort().forEach(grade => {
        const classes = Array.from(tree[campus][grade]).sort();
        grades.push({ grade, classes });
      });
      result.push({ campus, grades });
    });
    return result;
  }, [students]);

  // 过滤当前展示的学生
  const filteredStudents = useMemo(() => {
    if (!selectedPath || selectedPath.type === "all") {
      return students;
    }
    return students.filter(s => {
      if (selectedPath.type === "campus") {
        return s.campus === selectedPath.campus;
      }
      if (selectedPath.type === "grade") {
        return s.campus === selectedPath.campus && s.grade === selectedPath.grade;
      }
      if (selectedPath.type === "class") {
        return s.campus === selectedPath.campus && s.grade === selectedPath.grade && s.class_name === selectedPath.className;
      }
      return true;
    });
  }, [students, selectedPath]);

  const handleParsePaste = () => {
    const lines = pasteText.split("\n").map(l => l.trim()).filter(Boolean);
    const draft = [];
    const classCounters = {};
    lines.forEach((line) => {
      const cols = line.split(/\t|\s{2,}/).map(c => c.trim()).filter(Boolean);
      if (cols.length >= 4) {
        const [campus, name, grade, className, tagVal] = cols;
        const tag = (tagVal && ["A", "B", "C"].includes(tagVal.toUpperCase())) ? tagVal.toUpperCase() : "";
        const classKey = makeClassKey(campus, grade, className);
        classCounters[classKey] = (classCounters[classKey] || 0) + 1;
        const username = makeUsername(campus, name, grade, className, classCounters[classKey]);
        draft.push({
          id: gid(),
          name,
          campus,
          grade,
          class_name: className,
          username,
          password: "",
          tag: tag,
          assignedGroups: [],
          progress: {}
        });
      }
    });
    setImportDraft(draft);
  };

  const handleConfirmImport = (importType) => {
    if (!importDraft.length) return;
    let newList = [];
    if (importType === "append") {
      newList = [...students, ...importDraft];
    } else {
      newList = [...importDraft];
    }
    const seen = new Set();
    const uniqueList = [];
    newList.forEach(s => {
      const finalUsername = ensureUniqueUsername(s.username, seen);
      uniqueList.push({ ...s, username: finalUsername });
    });
    
    pushStudents(uniqueList);
    setSelectedPath({ type: "all" }); // 重置选择到全部
    setImportOpen(false);
    setPasteText("");
    setImportDraft([]);
  };

  const handleUpdateDraftUsername = (index, newUsername) => {
    const nextDraft = [...importDraft];
    nextDraft[index].username = newUsername.trim().toLowerCase();
    setImportDraft(nextDraft);
  };

  const handleDeleteStudent = (id, name) => {
    if (window.confirm(`确定删除学生 "${name}" 吗？该生的所有闯关记录也会一同被清除。`)) {
      const nextList = students.filter(s => s.id !== id);
      pushStudents(nextList, undefined, { allowEmpty: nextList.length === 0 });
    }
  };

  const startEditPassword = (student) => {
    setEditingStudentId(student.id);
    setEditPasswordVal(student.password || "");
  };

  const savePassword = (id) => {
    const nextList = students.map(s => s.id === id ? { ...s, password: editPasswordVal.trim() } : s);
    pushStudents(nextList);
    setEditingStudentId(null);
  };

  const cancelEditPassword = () => {
    setEditingStudentId(null);
  };

  const getStudentStats = (student) => {
    const progress = student.progress || {};
    const totalStars = Object.values(progress).reduce((sum, item) => sum + (item.stars || 0), 0);
    const completedCount = Object.keys(progress).length;
    return { completedCount, totalStars };
  };

  // 面包屑渲染
  const renderBreadcrumbs = () => {
    const breadcrumbStyle = { display: "flex", alignItems: "center", gap: 6, fontSize: 13, color: C.muted, marginBottom: 12 };
    const activeStyle = { fontWeight: 700, color: C.text };
    const linkStyle = { cursor: "pointer", transition: "color 0.2s" };
    
    if (selectedPath.type === "all") {
      return (
        <div style={breadcrumbStyle}>
          <span style={activeStyle}>📂 所有学生</span>
          <span style={{ marginLeft: "auto", fontSize: 12, background: C.borderLight, color: C.text, padding: "2px 8px", borderRadius: 10, fontWeight: 700 }}>
            共 {filteredStudents.length} 人
          </span>
        </div>
      );
    }
    
    const parts = [
      <span key="all" style={linkStyle} onClick={() => setSelectedPath({ type: "all" })} onMouseEnter={e => e.target.style.color = C.primary} onMouseLeave={e => e.target.style.color = C.muted}>📂 所有学生</span>
    ];
    
    if (selectedPath.type === "campus" || selectedPath.type === "grade" || selectedPath.type === "class") {
      parts.push(<span key="sep1">/</span>);
      if (selectedPath.type === "campus") {
        parts.push(<span key="campus" style={activeStyle}>🏢 {selectedPath.campus}校区</span>);
      } else {
        parts.push(<span key="campus" style={linkStyle} onClick={() => setSelectedPath({ type: "campus", campus: selectedPath.campus })} onMouseEnter={e => e.target.style.color = C.primary} onMouseLeave={e => e.target.style.color = C.muted}>🏢 {selectedPath.campus}校区</span>);
      }
    }
    
    if (selectedPath.type === "grade" || selectedPath.type === "class") {
      parts.push(<span key="sep2">/</span>);
      if (selectedPath.type === "grade") {
        parts.push(<span key="grade" style={activeStyle}>📅 {selectedPath.grade}级</span>);
      } else {
        parts.push(<span key="grade" style={linkStyle} onClick={() => setSelectedPath({ type: "grade", campus: selectedPath.campus, grade: selectedPath.grade })} onMouseEnter={e => e.target.style.color = C.primary} onMouseLeave={e => e.target.style.color = C.muted}>📅 {selectedPath.grade}级</span>);
      }
    }
    
    if (selectedPath.type === "class") {
      parts.push(<span key="sep3">/</span>);
      parts.push(<span key="class" style={activeStyle}>🏫 {selectedPath.className}班</span>);
    }
    
    return (
      <div style={breadcrumbStyle}>
        {parts}
        <span style={{ marginLeft: "auto", fontSize: 12, background: C.borderLight, color: C.text, padding: "2px 8px", borderRadius: 10, fontWeight: 700 }}>
          共 {filteredStudents.length} 人
        </span>
      </div>
    );
  };

  // 左侧分类折叠树节点渲染
  const renderTreeNodes = () => {
    const nodeStyle = (isActive) => ({
      display: "flex",
      alignItems: "center",
      gap: 6,
      padding: "8px 12px",
      borderRadius: 8,
      cursor: "pointer",
      fontSize: 13,
      fontWeight: isActive ? 700 : 500,
      color: isActive ? "#fff" : C.text,
      background: isActive ? C.primary : "transparent",
      transition: "all 0.15s ease",
      userSelect: "none"
    });

    const hoverBg = (e, isActive) => {
      if (!isActive) e.currentTarget.style.background = C.borderLight;
    };
    const leaveBg = (e, isActive) => {
      if (!isActive) e.currentTarget.style.background = "transparent";
    };

    const allStudentsCount = students.length;
    const isAllActive = selectedPath.type === "all";

    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
        <div
          onClick={() => setSelectedPath({ type: "all" })}
          onMouseEnter={e => hoverBg(e, isAllActive)}
          onMouseLeave={e => leaveBg(e, isAllActive)}
          style={nodeStyle(isAllActive)}
        >
          <span style={{ fontSize: 15 }}>📂</span>
          <span style={{ flex: 1 }}>所有学生</span>
          <span style={{ fontSize: 11, opacity: 0.6, background: isAllActive ? "rgba(255,255,255,0.2)" : C.borderLight, color: isAllActive ? "#fff" : C.text, padding: "2px 6px", borderRadius: 10 }}>{allStudentsCount}</span>
        </div>

        {studentsTree.map(({ campus, grades }) => {
          const isCampusExpanded = !!expandedNodes[campus];
          const isCampusActive = selectedPath.type === "campus" && selectedPath.campus === campus;
          const campusStudentsCount = students.filter(s => s.campus === campus).length;

          return (
            <div key={campus} style={{ display: "flex", flexDirection: "column", gap: 2 }}>
              <div
                onClick={() => setSelectedPath({ type: "campus", campus })}
                onMouseEnter={e => hoverBg(e, isCampusActive)}
                onMouseLeave={e => leaveBg(e, isCampusActive)}
                style={{ ...nodeStyle(isCampusActive), paddingLeft: 12 }}
              >
                <span 
                  onClick={(e) => toggleNode(campus, e)} 
                  style={{ display: "inline-block", width: 14, cursor: "pointer", transform: isCampusExpanded ? "rotate(90deg)" : "rotate(0deg)", transition: "transform 0.15s ease", fontSize: 9, opacity: 0.5 }}
                >
                  ▶
                </span>
                <span style={{ fontSize: 15 }}>🏢</span>
                <span style={{ flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{campus}校区</span>
                <span style={{ fontSize: 11, opacity: 0.6, background: isCampusActive ? "rgba(255,255,255,0.2)" : C.borderLight, color: isCampusActive ? "#fff" : C.text, padding: "2px 6px", borderRadius: 10 }}>{campusStudentsCount}</span>
              </div>

              {isCampusExpanded && grades.map(({ grade, classes }) => {
                const gradeKey = `${campus}-${grade}`;
                const isGradeExpanded = !!expandedNodes[gradeKey];
                const isGradeActive = selectedPath.type === "grade" && selectedPath.campus === campus && selectedPath.grade === grade;
                const gradeStudentsCount = students.filter(s => s.campus === campus && s.grade === grade).length;

                return (
                  <div key={grade} style={{ display: "flex", flexDirection: "column", gap: 2, marginLeft: 12 }}>
                    <div
                      onClick={() => setSelectedPath({ type: "grade", campus, grade })}
                      onMouseEnter={e => hoverBg(e, isGradeActive)}
                      onMouseLeave={e => leaveBg(e, isGradeActive)}
                      style={{ ...nodeStyle(isGradeActive), paddingLeft: 12 }}
                    >
                      <span 
                        onClick={(e) => toggleNode(gradeKey, e)} 
                        style={{ display: "inline-block", width: 14, cursor: "pointer", transform: isGradeExpanded ? "rotate(90deg)" : "rotate(0deg)", transition: "transform 0.15s ease", fontSize: 9, opacity: 0.5 }}
                      >
                        ▶
                      </span>
                      <span style={{ fontSize: 15 }}>📅</span>
                      <span style={{ flex: 1 }}>{grade}级</span>
                      <span style={{ fontSize: 11, opacity: 0.6, background: isGradeActive ? "rgba(255,255,255,0.2)" : C.borderLight, color: isGradeActive ? "#fff" : C.text, padding: "2px 6px", borderRadius: 10 }}>{gradeStudentsCount}</span>
                    </div>

                    {isGradeExpanded && classes.map(className => {
                      const isClassActive = selectedPath.type === "class" && selectedPath.campus === campus && selectedPath.grade === grade && selectedPath.className === className;
                      const classStudentsCount = students.filter(s => s.campus === campus && s.grade === grade && s.class_name === className).length;

                      return (
                        <div
                          key={className}
                          onClick={() => setSelectedPath({ type: "class", campus, grade, className })}
                          onMouseEnter={e => hoverBg(e, isClassActive)}
                          onMouseLeave={e => leaveBg(e, isClassActive)}
                          style={{ ...nodeStyle(isClassActive), paddingLeft: 38 }}
                        >
                          <span style={{ fontSize: 14 }}>🏫</span>
                          <span style={{ flex: 1 }}>{className}班</span>
                          <span style={{ fontSize: 11, opacity: 0.6, background: isClassActive ? "rgba(255,255,255,0.2)" : C.borderLight, color: isClassActive ? "#fff" : C.text, padding: "2px 6px", borderRadius: 10 }}>{classStudentsCount}</span>
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    );
  };

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", background: C.bg, padding: "24px 32px", color: C.text, overflow: "hidden" }}>
      {/* 顶栏 Header */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20, flexShrink: 0 }}>
        <div>
          <h2 style={{ fontSize: 22, fontWeight: 800, color: C.primary, margin: 0 }}>👥 学生与成绩管理看板</h2>
          <div style={{ fontSize: 13, color: C.muted, marginTop: 4 }}>
            {syncMeta.loading ? `⏳ ${syncMeta.message}` : `✓ ${syncMeta.message || "已同步云端名单"}`}
          </div>
        </div>
        <div style={{ display: "flex", gap: 12 }}>
          <button onClick={pullStudents} style={sBtnSm(C.bg, C.text, { border: `1.5px solid ${C.border}` })}>🔄 刷新名单</button>
          <button onClick={() => { setCycleDraft(challengeCycle); setCycleSettingsOpen(true); }} style={sBtnSm(C.greenLight, C.green, { fontWeight: 700 })}>🗺️ 设置周期任务</button>
          <button onClick={openPassingScoreSettings} style={sBtnSm(C.blueLight, C.blue, { fontWeight: 700 })}>🎯 设置通关达标分</button>
          <button onClick={() => { setBatchSelectedGroups([]); setBatchAssignOpen(true); }} style={sBtnSm(C.bg, C.text, { border: `1.5px solid ${C.border}`, fontWeight: 700 })}>🏷️ 按标签批量分配</button>
