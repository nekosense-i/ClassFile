  );
}

/* ===== MAIN APP ===== */
function App() {
  const [groups, setGroups] = useState([]);
  const [curGid, setCurGid] = useState(null);
  const [groupId, setGroupId] = useState(() => parseGroupIdFromUrl());
  const [mode, setMode] = useState("edit");
  const [ready, setReady] = useState(false);
  const [syncMeta, setSyncMeta] = useState({ loading:false, status:"idle", message:"", lastSyncedAt:null, error:"" });
  const [showExportMenu, setShowExportMenu] = useState(false);
  const [importOpen, setImportOpen] = useState(false);
  const [importMode, setImportMode] = useState("replace");
  const [importDraft, setImportDraft] = useState(null);
  const [importStatus, setImportStatus] = useState("");
  const [importResult, setImportResult] = useState(null);
  const [showSyncPopover, setShowSyncPopover] = useState(false);
  const [syncConflict, setSyncConflict] = useState(null);
  const fileRef = useRef();
  const syncTimerRef = useRef(null);
  const groupsRef = useRef(groups);
  const groupIdRef = useRef(groupId);
  const curGidRef = useRef(curGid);
  const lastSyncRef = useRef(null);
  const syncLoadingRef = useRef(false);
  const suppressAutoSyncRef = useRef(true);
  const pendingAutoSyncRef = useRef(false);

  useEffect(() => { groupsRef.current = groups; }, [groups]);
  useEffect(() => { groupIdRef.current = groupId; }, [groupId]);
  useEffect(() => { curGidRef.current = curGid; }, [curGid]);

  const currentWordGroup = useMemo(() => groups.find(g => g.id === curGid) || groups[0] || null, [groups, curGid]);
  const persistSyncPayload = useCallback((groupIdValue, payload) => {
    const normalized = normalizeSyncPayload(payload, groupIdValue);
    storage.save(groupIdValue, normalized);
    lastSyncRef.current = Number(normalized.synced_at || normalized.last_updated || Date.now());
    return normalized;
  }, []);
  const applyPayloadToState = useCallback((groupIdValue, payload, { message, status = "synced", loading = false, error = "" } = {}) => {
    const normalized = normalizeSyncPayload(payload, groupIdValue);
    suppressAutoSyncRef.current = true;
    setGroups(normalized.groups);
    setCurGid(prev => normalized.groups.some(g => g.id === prev) ? prev : (normalized.groups[0]?.id || null));
    persistSyncPayload(groupIdValue, normalized);
    setSyncMeta({
      loading,
      status,
      message,
      lastSyncedAt: Number(normalized.synced_at || normalized.last_updated || Date.now()),
      error,
    });
    return normalized;
  }, [persistSyncPayload]);
  const openConflictModal = useCallback((groupIdValue, localPayload, remotePayload, source) => {
    setSyncConflict({ open:true, groupId:groupIdValue, localPayload:normalizeSyncPayload(localPayload, groupIdValue), remotePayload:normalizeSyncPayload(remotePayload, groupIdValue), source });
    setSyncMeta(prev => ({
      ...prev,
      loading:false,
      status:"conflict",
      message:"检测到本地与云端同时有改动，请选择处理方式。",
      error:"",
    }));
  }, []);
  const backgroundRevalidate = useCallback(async (groupIdValue) => {
    if (syncLoadingRef.current) {
      pendingAutoSyncRef.current = true;
      return null;
    }
    syncLoadingRef.current = true;
    if (syncTimerRef.current) {
      clearTimeout(syncTimerRef.current);
      syncTimerRef.current = null;
    }
    setSyncMeta(prev => ({ ...prev, loading:true, status:"syncing", message:"后台静默同步中...", error:"" }));
    try {
      const remotePayload = await pullFromCloud(groupIdValue);
      const localPayload = normalizeSyncPayload(storage.load(groupIdValue) || { group_id: groupIdValue, last_updated: Date.now(), synced_at: Date.now(), groups: groupsRef.current }, groupIdValue);
      const remoteStamp = Number(remotePayload.last_updated || 0);
      const syncedStamp = Number(localPayload.synced_at || 0);
      const localDirty = hasUnsyncedLocalChanges(localPayload);
      if (remoteStamp <= syncedStamp) {
        setSyncMeta(prev => ({
          ...prev,
          loading:false,
          status:"synced",
          message: prev.message || "当前已是最新数据",
          lastSyncedAt: Number(localPayload.synced_at || localPayload.last_updated || Date.now()),
          error:"",
        }));
        return remotePayload;
      }
      if (!localDirty) {
        applyPayloadToState(groupIdValue, { ...remotePayload, synced_at: remoteStamp }, {
          status:"synced",
          message:"已自动同步最新数据",
          loading:false,
          error:"",
        });
        return remotePayload;
      }
      openConflictModal(groupIdValue, localPayload, remotePayload, "background");
      return remotePayload;
    } catch (error) {
      const message = error?.name === "AbortError" ? "后台同步超时，请检查网络。" : (error?.message || "后台同步失败，请稍后重试。");
      setSyncMeta(prev => ({ ...prev, loading:false, status:"error", message, error:message }));
      return null;
    } finally {
      syncLoadingRef.current = false;
      if (pendingAutoSyncRef.current) {
        pendingAutoSyncRef.current = false;
        syncTimerRef.current = setTimeout(() => { backgroundRevalidate(groupIdValue).catch(() => {}); }, 500);
      }
    }
  }, [applyPayloadToState, openConflictModal]);
  const syncNow = useCallback(async ({ source = "manual" } = {}) => {
    if (syncLoadingRef.current) {
      pendingAutoSyncRef.current = true;
      return null;
    }
    const activeGroupId = sanitizeGroupId(groupIdRef.current);
    syncLoadingRef.current = true;
    if (syncTimerRef.current) {
      clearTimeout(syncTimerRef.current);
      syncTimerRef.current = null;
    }
    setSyncMeta(prev => ({ ...prev, loading:true, status:"syncing", message: source === "manual" ? "正在手动同步..." : "正在同步...", error:"" }));
    try {
      const remotePayload = await pullFromCloud(activeGroupId);
      const localPayload = normalizeSyncPayload(storage.load(activeGroupId) || { group_id: activeGroupId, last_updated: Date.now(), synced_at: Date.now(), groups: groupsRef.current }, activeGroupId);
      const remoteStamp = Number(remotePayload.last_updated || 0);
      const syncedStamp = Number(localPayload.synced_at || 0);
      const localDirty = hasUnsyncedLocalChanges(localPayload);
      const remoteNewer = remoteStamp > syncedStamp;
      if (remoteNewer && !localDirty) {
        applyPayloadToState(activeGroupId, { ...remotePayload, synced_at: remoteStamp }, {
          status:"synced",
          message:"已自动同步最新数据",
          loading:false,
          error:"",
        });
        return remotePayload;
      }
      if (remoteNewer && localDirty) {
        openConflictModal(activeGroupId, localPayload, remotePayload, "manual");
        return remotePayload;
      }
      if (!localDirty) {
        setSyncMeta({
          loading:false,
          status:"synced",
          message:"当前已是最新数据",
          lastSyncedAt:Number(localPayload.synced_at || localPayload.last_updated || Date.now()),
          error:"",
        });
        return remotePayload;
      }
      const payloadToPush = normalizeSyncPayload({ ...localPayload, synced_at: Number(localPayload.last_updated || Date.now()) }, activeGroupId);
      const pushed = await pushToCloud(activeGroupId, payloadToPush);
      const syncedAt = Number(pushed.last_updated || payloadToPush.last_updated || Date.now());
      const finalPayload = normalizeSyncPayload({ group_id: activeGroupId, last_updated: payloadToPush.last_updated || syncedAt, synced_at: syncedAt, groups: cloneGroups(payloadToPush.groups) }, activeGroupId);
      persistSyncPayload(activeGroupId, finalPayload);
      suppressAutoSyncRef.current = true;
      setGroups(finalPayload.groups);
      setCurGid(prev => finalPayload.groups.some(g => g.id === prev) ? prev : (finalPayload.groups[0]?.id || null));
      setSyncMeta({ loading:false, status:"synced", message:`同步成功 · ${formatSyncTime(syncedAt)}`, lastSyncedAt:syncedAt, error:"" });
      return pushed;
    } catch (error) {
      const message = error?.name === "AbortError" ? "同步超时，请检查网络后重试。" : (error?.message || "同步失败，请稍后再试。");
      setSyncMeta(prev => ({ ...prev, loading:false, status:"error", message, error:message }));
      if (source === "manual") window.alert(`同步失败：${message}`);
      return null;
    } finally {
      syncLoadingRef.current = false;
      if (pendingAutoSyncRef.current) {
        pendingAutoSyncRef.current = false;
        syncTimerRef.current = setTimeout(() => { backgroundRevalidate(activeGroupId).catch(() => {}); }, 500);
      }
    }
  }, [backgroundRevalidate, openConflictModal, persistSyncPayload]);
  const resolveSyncConflict = useCallback(async (choice) => {
    if (!syncConflict) return;
    const { groupId: conflictGroupId, localPayload, remotePayload } = syncConflict;
    setSyncConflict(null);
    const local = normalizeSyncPayload(localPayload, conflictGroupId);
    const remote = normalizeSyncPayload(remotePayload, conflictGroupId);
    setSyncMeta(prev => ({ ...prev, loading:true, status:"syncing", message:"正在处理冲突...", error:"" }));
    try {
      if (choice === "local") {
        const now = Date.now();
        const payloadToPush = normalizeSyncPayload({ group_id: conflictGroupId, last_updated: now, synced_at: now, groups: local.groups }, conflictGroupId);
        await pushToCloud(conflictGroupId, payloadToPush);
        applyPayloadToState(conflictGroupId, payloadToPush, { status:"synced", message:"已保留本地并同步到云端", loading:false, error:"" });
        return;
      }
      if (choice === "remote") {
        const payloadToApply = normalizeSyncPayload({ ...remote, synced_at: Number(remote.last_updated || Date.now()) }, conflictGroupId);
        applyPayloadToState(conflictGroupId, payloadToApply, { status:"synced", message:"已使用云端最新数据", loading:false, error:"" });
        return;
      }
      const mergedGroups = mergeGroups(local.groups, remote.groups);
      const now = Date.now();
      const mergedPayload = normalizeSyncPayload({ group_id: conflictGroupId, last_updated: now, synced_at: now, groups: mergedGroups }, conflictGroupId);
      await pushToCloud(conflictGroupId, mergedPayload);
      applyPayloadToState(conflictGroupId, mergedPayload, { status:"synced", message:"已智能合并并同步最新数据", loading:false, error:"" });
    } catch (error) {
      const message = error?.name === "AbortError" ? "冲突处理超时，请重试。" : (error?.message || "冲突处理失败，请稍后再试。");
      setSyncMeta(prev => ({ ...prev, loading:false, status:"error", message, error:message }));
      window.alert(`冲突处理失败：${message}`);
    }
  }, [applyPayloadToState, syncConflict]);
  const handleManualSync = useCallback(() => {
    if (syncTimerRef.current) {
      clearTimeout(syncTimerRef.current);
      syncTimerRef.current = null;
    }
    syncNow({ source:"manual" }).catch(() => {});
  }, [syncNow]);

  useEffect(() => {
    let cancelled = false;
    const init = async () => {
      const resolvedGroupId = parseGroupIdFromUrl();
      syncUrlGroupId(resolvedGroupId);
      setGroupId(resolvedGroupId);
      setReady(false);
      setSyncMeta(prev => ({ ...prev, loading:true, status:"loading", message:"正在读取分组数据...", error:"" }));
      let localPayload = null;
      try {
        localPayload = storage.load(resolvedGroupId);
        if (localPayload?.groups?.length) {
          const hydrated = normalizeSyncPayload(localPayload, resolvedGroupId);
          if (cancelled) return;
          suppressAutoSyncRef.current = true;
          lastSyncRef.current = hydrated.synced_at || hydrated.last_updated || Date.now();
          setGroups(hydrated.groups);
          setCurGid(hydrated.groups[0]?.id || null);
          setReady(true);
          setSyncMeta({
            loading:true,
            status:"syncing",
            message:"本地缓存已加载，正在后台检查云端最新数据...",
            lastSyncedAt: Number(hydrated.synced_at || hydrated.last_updated || Date.now()),
            error:"",
          });
          backgroundRevalidate(resolvedGroupId).catch(() => {});
          return;
        }
        setSyncMeta(prev => ({ ...prev, message:"本地无缓存，正在从云端拉取..." }));
        const remotePayload = await pullFromCloud(resolvedGroupId);
        const remoteGroups = remotePayload?.groups?.length ? remotePayload.groups : cloneGroups(DEMO);
        const normalized = normalizeSyncPayload({ group_id: resolvedGroupId, last_updated: remotePayload?.last_updated || Date.now(), synced_at: remotePayload?.last_updated || Date.now(), groups: remoteGroups }, resolvedGroupId);
        if (cancelled) return;
        suppressAutoSyncRef.current = true;
        lastSyncRef.current = normalized.synced_at || normalized.last_updated;
        setGroups(normalized.groups);
        setCurGid(normalized.groups[0]?.id || null);
        setReady(true);
        storage.save(resolvedGroupId, normalized);
        setSyncMeta({
          loading:false,
          status:"synced",
          message: remotePayload?.groups?.length ? "已从云端加载当前分组" : "已载入示例分组",
          lastSyncedAt: normalized.synced_at || normalized.last_updated,
          error:"",
        });
      } catch (error) {
        if (cancelled) return;
        const fallbackGroups = cloneGroups(DEMO);
        const normalized = normalizeSyncPayload({ group_id: resolvedGroupId, last_updated: Date.now(), synced_at: Date.now(), groups: fallbackGroups }, resolvedGroupId);
        storage.save(resolvedGroupId, normalized);
        suppressAutoSyncRef.current = true;
        lastSyncRef.current = normalized.synced_at || normalized.last_updated;
        setGroups(fallbackGroups);
        setCurGid(fallbackGroups[0]?.id || null);
        setReady(true);
        setSyncMeta({
          loading:false,
          status:"error",
          message:`初始化失败，已切换到示例数据：${error?.message || "请检查网络后重试"}`,
          lastSyncedAt: normalized.synced_at || normalized.last_updated,
          error:error?.message || "初始化失败",
        });
      }
    };
    init();
    return () => {
      cancelled = true;
      if (syncTimerRef.current) clearTimeout(syncTimerRef.current);
    };
  }, [backgroundRevalidate]);

  useEffect(() => {
    if (!ready) return;
    groupsRef.current = groups;
    const activeGroupId = sanitizeGroupId(groupIdRef.current);
    const isHydratedWrite = suppressAutoSyncRef.current;
    const payload = normalizeSyncPayload({
      group_id: activeGroupId,
      last_updated: isHydratedWrite ? (lastSyncRef.current || Date.now()) : Date.now(),
      synced_at: isHydratedWrite ? (lastSyncRef.current || Date.now()) : Number(lastSyncRef.current || Date.now()),
      groups,
    }, activeGroupId);
    persistSyncPayload(activeGroupId, payload);
    if (suppressAutoSyncRef.current) {
      suppressAutoSyncRef.current = false;
      return;
    }
    setSyncMeta(prev => ({ ...prev, status:"dirty", message:"本地已更新，等待同步...", error:"" }));
    if (syncTimerRef.current) clearTimeout(syncTimerRef.current);
    syncTimerRef.current = setTimeout(() => {
      syncNow({ source:"auto" }).catch(() => {});
    }, 1200);
  }, [groups, ready, persistSyncPayload, syncNow]);

  const handleExportJson = () => {
    const blob = new Blob([JSON.stringify(groups, null, 2)], {type:"application/json"});
    downloadBlob(blob, `日语单词_${todayStamp()}_JSON备份.json`);
    setShowExportMenu(false);
  };
  const handleExportExcel = () => {
    const wb = makeWorkbookFromGroups(groups);
    XLSX.writeFile(wb, `日语单词_${todayStamp()}.xlsx`);
    setShowExportMenu(false);
  };
  const handleDownloadTemplate = () => {
    const wb = makeWorkbookFromGroups([{ id:gid(), name:"示例单词组", words:EXCEL_TEMPLATE_ROWS.map(w => ({...w, id:gid()})) }]);
    XLSX.writeFile(wb, `日语单词导入模板_${todayStamp()}.xlsx`);
  };
  const handleImport = (e) => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    setImportOpen(true);
    setImportDraft(null);
    setImportResult(null);
    setImportStatus("正在解析 Excel 文件...");
    r.onload = () => {
      try {
        const sheets = parseWorkbookSheets(r.result);
        const totalWords = sheets.reduce((sum, s) => sum + s.words.length, 0);
        const totalSkipped = sheets.reduce((sum, s) => sum + s.warnings.length, 0);
        setImportDraft({ fileName:f.name, sheets, totalWords, totalSkipped });
        setImportStatus(sheets.length ? "请选择导入模式并确认导入。" : "未找到可导入的工作表。");
      } catch {
        setImportStatus("无法解析文件，请确认文件为 .xlsx 或 .xls 格式。");
      }
    };
    r.onerror = () => setImportStatus("读取文件失败，请重新选择文件。");
    r.readAsArrayBuffer(f);
    e.target.value="";
  };
  const applyImport = () => {
    if (!importDraft) return;
    setImportStatus("正在导入数据...");
    const sheets = importDraft.sheets;
    const activeSheets = importMode === "append" ? sheets.slice(0, 1) : sheets;
    const skipped = activeSheets.reduce((sum, s) => sum + s.warnings.length, 0);
    let added = 0;
    let updated = 0;
    let nextGroups = groups;
    if (importMode === "replace") {
      nextGroups = sheets.map(s => ({ id:gid(), name:s.name || "单词组", words:s.words }));
      added = sheets.reduce((sum, s) => sum + s.words.length, 0);
    } else if (importMode === "append") {
      const first = sheets[0];
      if (first) {
        added = first.words.length;
        if (curGid && groups.some(g => g.id === curGid)) {
          nextGroups = groups.map(g => g.id === curGid ? {...g, words:[...(g.words || []), ...first.words]} : g);
        } else {
          const ng = { id:gid(), name:first.name || "单词组", words:first.words };
          nextGroups = [...groups, ng];
          setCurGid(ng.id);
        }
      }
    } else {
      nextGroups = groups.map(g => ({...g, words:[...(g.words || [])]}));
      sheets.forEach(sheet => {
        let group = nextGroups.find(g => g.name === sheet.name);
        if (!group) {
          group = { id:gid(), name:sheet.name || "单词组", words:[] };
          nextGroups.push(group);
        }
        sheet.words.forEach(word => {
          const idx = group.words.findIndex(w => w.kana === word.kana);
          if (idx >= 0) {
            group.words[idx] = {...group.words[idx], ...word, id:group.words[idx].id};
            updated++;
          } else {
            group.words.push(word);
            added++;
          }
        });
      });
    }
    setGroups(nextGroups);
    if (nextGroups.length && (importMode === "replace" || !curGid)) setCurGid(nextGroups[0].id);
    setImportResult({ added, updated, skipped, warnings:activeSheets.flatMap(s => s.warnings.map(w => ({...w, sheet:s.name}))) });
    setImportStatus("导入完成。");
  };

  const modes = [
    { key:"edit", label:"📝 编辑", color:C.primary },
    { key:"teach", label:"📖 授课", color:C.primary },
    { key:"practice", label:"🎯 练习", color:C.primary },
  ];

  return (
    <div style={{ minHeight:"100vh", background:C.bg }}>
      {/* Header */}
      <div style={{ height:64, background:C.card, borderBottom:`1px solid ${C.border}`,
        display:"flex", alignItems:"center", justifyContent:"space-between", padding:"0 22px", position:"sticky", top:0, zIndex:100 }}>
        <div style={{ display:"flex", alignItems:"center", gap:10, position:"relative", fontSize:20, fontWeight:800, fontFamily:SF, color:C.primary, userSelect:"none" }}>
          <span style={{ color:C.primary, fontSize:24 }}>言葉</span> 勉強システム
          <button
            type="button"
            onClick={handleManualSync}
            onMouseEnter={()=>setShowSyncPopover(true)}
            onMouseLeave={()=>setShowSyncPopover(false)}
            aria-label="同步状态"
            title="同步状态"
            disabled={syncMeta.loading}
            style={{ width:12, height:12, borderRadius:"50%", border:"none", padding:0, cursor:syncMeta.loading?"not-allowed":"pointer", background: syncMeta.loading ? C.blue : (syncMeta.status === "error" ? C.wrong : syncMeta.status === "synced" ? C.green : syncMeta.status === "dirty" ? C.primary : C.border), boxShadow: syncMeta.loading ? `0 0 0 4px rgba(59,107,165,0.14)` : `0 0 0 3px rgba(200,64,45,0.08)`, position:"relative" }}
          >
            {syncMeta.loading && <span style={{ position:"absolute", inset:-4, borderRadius:"50%", border:`2px solid ${C.blueLight}`, borderTopColor:C.blue, animation:"spin 0.9s linear infinite" }} />}
          </button>
          {showSyncPopover && (
            <div
              onMouseEnter={()=>setShowSyncPopover(true)}
              onMouseLeave={()=>setShowSyncPopover(false)}
              style={{ position:"absolute", left:"50%", top:"calc(100% + 10px)", transform:"translateX(-50%)", width:240, maxWidth:"calc(100vw - 24px)", maxHeight:"calc(100vh - 120px)", overflowY:"auto", background:"rgba(255,255,255,0.98)", border:`1px solid ${C.border}`, borderRadius:12, boxShadow:"0 14px 30px rgba(0,0,0,0.12)", padding:"10px 12px", zIndex:120 }}>
              <div style={{ fontSize:12, fontWeight:800, color:C.text, marginBottom:6 }}>同步状态</div>
              <div style={{ fontSize:12, color:C.muted, lineHeight:1.6 }}>
                <div>云端分组：{groupId}</div>
                <div>当前词组：{currentWordGroup?.name || "未选择"}</div>
                <div>状态：{syncMeta.loading ? "同步中" : (syncMeta.status === "error" ? "异常" : syncMeta.status === "dirty" ? "待同步" : "正常")}</div>
                <div>上次同步：{formatSyncTime(syncMeta.lastSyncedAt)}</div>
                <div style={{ marginTop:6, color:syncMeta.status === "error" ? C.wrong : C.muted }}>{syncMeta.message || "自动同步已启用"}</div>
              </div>
            </div>
          )}
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:4, background:C.bg, borderRadius:12, padding:4 }}>
          {modes.map(m => (
            <button key={m.key} onClick={()=>setMode(m.key)}
              style={{ padding:"8px 20px", borderRadius:9, border:"none", cursor:"pointer", fontSize:14, fontWeight:600, transition:"all 0.2s",
                background: mode===m.key ? C.card : "transparent",
                color: mode===m.key ? C.text : C.muted,
                boxShadow: mode===m.key ? "0 2px 8px rgba(0,0,0,0.1)" : "none" }}>
              {m.label}
            </button>
          ))}
        </div>
        <div style={{ display:"flex", gap:8, position:"relative" }}>
          <button onClick={handleDownloadTemplate} style={sBtnSm(C.bg, C.muted, {display:"flex",alignItems:"center",gap:5, border:`1px solid ${C.border}`})}>
            下载模板
          </button>
          <div style={{ position:"relative" }}>
            <button onClick={()=>setShowExportMenu(v=>!v)} style={sBtnSm(C.greenLight, C.green, {display:"flex",alignItems:"center",gap:5})}>
              <IDownload size={14} color={C.green}/> 导出
            </button>
            {showExportMenu && (
              <div style={{ position:"absolute", right:0, top:38, width:150, background:C.card, border:`1px solid ${C.border}`, borderRadius:10, boxShadow:"0 10px 30px rgba(0,0,0,0.14)", padding:6, zIndex:20 }}>
                <button onClick={handleExportExcel} style={{ width:"100%", textAlign:"left", padding:"8px 10px", border:"none", background:"transparent", borderRadius:7, cursor:"pointer", color:C.text, fontSize:13 }}>导出 Excel</button>
                <button onClick={handleExportJson} style={{ width:"100%", textAlign:"left", padding:"8px 10px", border:"none", background:"transparent", borderRadius:7, cursor:"pointer", color:C.text, fontSize:13 }}>导出 JSON 备份</button>
              </div>
            )}
          </div>
          <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={handleImport}/>
          <button onClick={()=>fileRef.current?.click()} style={sBtnSm(C.blueLight, C.blue, {display:"flex",alignItems:"center",gap:5})}>
            <IUpload size={14} color={C.blue}/> 导入
          </button>
        </div>
      </div>

      {/* Content */}
      {mode==="edit" && <EditMode groups={groups} setGroups={setGroups} gid={curGid} setGid={setCurGid}/>}
      {mode==="teach" && <TeachMode groups={groups} gid={curGid}/>}
      {mode==="practice" && <PracticeMode groups={groups} gid={curGid}/>}

      {syncConflict?.open && (
        <div style={{ position:"fixed", inset:0, zIndex:140, background:"rgba(0,0,0,0.34)", display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}>
          <div style={{ width:"min(520px, 94vw)", background:C.card, borderRadius:16, border:`1px solid ${C.border}`, boxShadow:"0 24px 80px rgba(0,0,0,0.22)", padding:24 }}>
            <div style={{ fontSize:18, fontWeight:800, color:C.text, marginBottom:10 }}>检测到同步冲突</div>
            <div style={{ fontSize:13, color:C.muted, lineHeight:1.75, marginBottom:18 }}>
              <div>云端更新时间：{formatSyncTime(syncConflict.remotePayload?.last_updated)}</div>
              <div>本地更新时间：{formatSyncTime(syncConflict.localPayload?.last_updated)}</div>
              <div>本地已同步时间：{formatSyncTime(syncConflict.localPayload?.synced_at)}</div>
              <div style={{ marginTop:8 }}>本地和云端都发生了改动，请选择处理方式。</div>
            </div>
            <div style={{ display:"flex", gap:10, flexWrap:"wrap", justifyContent:"flex-end" }}>
              <button onClick={()=>resolveSyncConflict("local")} style={sBtnSm(C.bg, C.text, { border:`1px solid ${C.border}` })}>保留本地</button>
              <button onClick={()=>resolveSyncConflict("remote")} style={sBtnSm(C.blueLight, C.blue)}>使用云端</button>
              <button onClick={()=>resolveSyncConflict("merge")} style={sBtnSm(C.primary, "#fff")}>智能合并</button>
              <button onClick={()=>setSyncConflict(null)} style={sBtnSm(C.bg, C.muted, { border:`1px solid ${C.border}` })}>取消</button>
            </div>
          </div>
        </div>
      )}

      <Modal open={importOpen} onClose={()=>setImportOpen(false)} title="导入 Excel 单词表" wide>
        <div>
          <div style={{ padding:"12px 14px", borderRadius:10, background:C.bg, color:C.muted, fontSize:13, marginBottom:16 }}>
            {importStatus}
          </div>
          {importDraft && (
            <>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(3, 1fr)", gap:10, marginBottom:16 }}>
                <div style={{ background:C.primaryLight, borderRadius:10, padding:12 }}>
                  <div style={{ fontSize:12, color:C.muted }}>工作表</div>
                  <div style={{ fontSize:22, fontWeight:800, color:C.primary }}>{importDraft.sheets.length}</div>
                </div>
                <div style={{ background:C.greenLight, borderRadius:10, padding:12 }}>
                  <div style={{ fontSize:12, color:C.muted }}>可导入单词</div>
                  <div style={{ fontSize:22, fontWeight:800, color:C.green }}>{importDraft.totalWords}</div>
                </div>
                <div style={{ background:C.blueLight, borderRadius:10, padding:12 }}>
                  <div style={{ fontSize:12, color:C.muted }}>需跳过行</div>
                  <div style={{ fontSize:22, fontWeight:800, color:C.blue }}>{importDraft.totalSkipped}</div>
                </div>
              </div>
              <div style={{ marginBottom:16 }}>
                <label style={sLabel}>导入模式</label>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(3, 1fr)", gap:10 }}>
                  {[
                    { key:"replace", title:"全量替换", desc:"清空现有数据，用 Excel 全部工作表替换" },
                    { key:"append", title:"追加到当前组", desc:"只取第一个工作表，追加到当前单词组" },
                    { key:"merge", title:"智能合并", desc:"按组名和假名匹配，新增或更新" },
                  ].map(item => (
                    <button key={item.key} onClick={()=>setImportMode(item.key)}
                      style={{ textAlign:"left", padding:"12px 13px", borderRadius:10, cursor:"pointer", background:importMode===item.key?C.primaryLight:"#fff", border:`1.5px solid ${importMode===item.key?C.primary:C.border}`, color:C.text }}>
                      <div style={{ fontSize:14, fontWeight:700, marginBottom:4 }}>{item.title}</div>
                      <div style={{ fontSize:12, lineHeight:1.45, color:C.muted }}>{item.desc}</div>
                    </button>
                  ))}
                </div>
              </div>
              <div style={{ marginBottom:16 }}>
                <label style={sLabel}>导入预览</label>
                <div style={{ maxHeight:260, overflowY:"auto", border:`1px solid ${C.borderLight}`, borderRadius:10 }}>
                  {importDraft.sheets.map(sheet => (
                    <div key={sheet.name} style={{ padding:12, borderBottom:`1px solid ${C.borderLight}` }}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                        <strong style={{ color:C.text, fontSize:14 }}>{sheet.name}</strong>
                        <span style={{ color:C.muted, fontSize:12 }}>{sheet.words.length} 个单词</span>
                      </div>
                      <div style={{ overflowX:"auto" }}>
                        <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
                          <thead>
                            <tr>{["假名","汉字","中文释义","词性"].map(h => <th key={h} style={{ textAlign:"left", color:C.muted, padding:"5px 6px", borderBottom:`1px solid ${C.borderLight}` }}>{h}</th>)}</tr>
                          </thead>
                          <tbody>
                            {sheet.preview.length ? sheet.preview.map((row, i) => (
                              <tr key={i}>
                                {["假名","汉字","中文释义","词性"].map(h => <td key={h} style={{ padding:"5px 6px", color:C.text, borderBottom:`1px solid ${C.borderLight}` }}>{row[h] || "—"}</td>)}
                              </tr>
                            )) : (
                              <tr><td colSpan="4" style={{ padding:"6px", color:C.muted }}>此工作表没有数据行</td></tr>
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
              {importResult && (
                <div style={{ padding:"12px 14px", borderRadius:10, background:C.greenLight, color:C.green, fontSize:13, marginBottom:16, lineHeight:1.7 }}>
                  <strong>导入结果：</strong>新增 {importResult.added} 个，更新 {importResult.updated} 个，跳过 {importResult.skipped} 行。
                  {importResult.warnings.length > 0 && (
                    <div style={{ color:C.muted, marginTop:5 }}>
                      跳过明细：{importResult.warnings.slice(0, 8).map(w => `${w.sheet} 第${w.rowNumber}行（${w.reason}）`).join("；")}
                      {importResult.warnings.length > 8 ? "；更多行已略去" : ""}
                    </div>
                  )}
                </div>
              )}
              <div style={{ display:"flex", justifyContent:"flex-end", gap:10, borderTop:`1px solid ${C.borderLight}`, paddingTop:16 }}>
                <button onClick={()=>setImportOpen(false)} style={sBtn(C.bg, C.muted)}>{importResult ? "关闭" : "取消"}</button>
                {!importResult && <button onClick={applyImport} disabled={importDraft.totalWords===0} style={sBtn(importDraft.totalWords?C.primary:"#ccc", "#fff", {cursor:importDraft.totalWords?"pointer":"not-allowed"})}>确认导入</button>}
              </div>
            </>
          )}
        </div>
      </Modal>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
