/* ===== HELPERS ===== */
const gid = () => Math.random().toString(36).substr(2, 9);
const shuffle = (a) => {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
};

const POS_OPTIONS = ["名詞","動詞","い形容詞","な形容詞","副詞","接続詞","感動詞","助詞","連体詞","代名詞","その他"];
const EMPTY_WORD = { kana:"", kanji:"", accent:"", pos:"名詞", meaning:"", usage:"", examples:[{ja:"",cn:""}], imageUrl:"" };
const EXCEL_HEADERS = ["假名","汉字","声调","词性","中文释义","用法说明","例句1日文","例句1中文","例句2日文","例句2中文","例句3日文","例句3中文","图片URL"];
const EXCEL_TEMPLATE_ROWS = [
  { kana:"たまご", kanji:"卵", accent:"2", pos:"名詞", meaning:"鸡蛋", usage:"日常食材，可做主菜或配料", examples:[{ja:"朝ごはんに卵を食べます。",cn:"早餐吃鸡蛋。"},{ja:"卵はいくつありますか。",cn:"有几个鸡蛋？"}], imageUrl:"https://images.unsplash.com/photo-1518569656558-1f25e69d93d7?w=400&h=260&fit=crop" },
  { kana:"あたらしい", kanji:"新しい", accent:"4", pos:"い形容詞", meaning:"新的", usage:"い形容词，修饰名词时直接接名词", examples:[{ja:"新しい本を買いました。",cn:"买了新书。"},{ja:"この教室は新しいです。",cn:"这间教室是新的。"}], imageUrl:"" },
];
const getCell = (row, key) => String(row[key] ?? "").trim();
const cleanAccent = (v) => {
  const s = String(v ?? "").trim();
  if (!s) return "";
  return /^(\d+|[⓪①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]+)$/.test(s) ? s : "";
};
const cleanPos = (v) => {
  const s = String(v ?? "").trim();
  if (!s) return "名詞";
  return POS_OPTIONS.includes(s) ? s : "その他";
};
const cleanImageUrl = (v) => {
  const s = String(v ?? "").trim();
  return /^https?:\/\//i.test(s) ? s : "";
};
const wordToExcelRow = (w) => {
  const ex = Array.isArray(w.examples) ? w.examples : [];
  return {
    "假名": w.kana || "",
    "汉字": w.kanji || "",
    "声调": w.accent || "",
    "词性": w.pos || "名詞",
    "中文释义": w.meaning || "",
    "用法说明": w.usage || "",
    "例句1日文": ex[0]?.ja || "",
    "例句1中文": ex[0]?.cn || "",
    "例句2日文": ex[1]?.ja || "",
    "例句2中文": ex[1]?.cn || "",
    "例句3日文": ex[2]?.ja || "",
    "例句3中文": ex[2]?.cn || "",
    "图片URL": w.imageUrl || "",
  };
};
const excelRowToWord = (row, rowNumber) => {
  const kana = getCell(row, "假名");
  const meaning = getCell(row, "中文释义");
  if (!kana) return { skipped:true, silent:true, rowNumber, reason:"假名为空" };
  if (!meaning) return { skipped:true, rowNumber, reason:"中文释义为空" };
  const examples = [1,2,3].map(i => ({ ja:getCell(row, `例句${i}日文`), cn:getCell(row, `例句${i}中文`) }))
    .filter(e => e.ja || e.cn);
  return {
    word: {
      id: gid(),
      kana,
      kanji: getCell(row, "汉字"),
      accent: cleanAccent(row["声调"]),
      pos: cleanPos(row["词性"]),
      meaning,
      usage: getCell(row, "用法说明"),
      examples: examples.length ? examples : [{ja:"",cn:""}],
      imageUrl: cleanImageUrl(row["图片URL"]),
    }
  };
};
const safeSheetName = (name, used = new Set()) => {
  const base = String(name || "单词组").replace(/[\\/?*[\]:]/g, "-").slice(0, 31) || "单词组";
  let finalName = base;
  let n = 2;
  while (used.has(finalName)) {
    const suffix = `_${n++}`;
    finalName = base.slice(0, 31 - suffix.length) + suffix;
  }
  used.add(finalName);
  return finalName;
};
const todayStamp = () => {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
};
const CLOUD_SYNC_BASE = "https://sync.nekosensei.cn/classtango";
const LEGACY_STORAGE_KEY = "jp_vocab_v1";
const DEFAULT_SYNC_GROUP_ID = "default";
const sanitizeGroupId = (value) => {
  const raw = String(value ?? "").trim();
  if (!raw) return DEFAULT_SYNC_GROUP_ID;
  return raw.replace(/[^a-zA-Z0-9_-]/g, "_").replace(/_+/g, "_").replace(/^_+|_+$/g, "") || DEFAULT_SYNC_GROUP_ID;
};
const parseGroupIdFromUrl = () => {
  try {
    const url = new URL(window.location.href);
    const queryGroup = sanitizeGroupId(url.searchParams.get("group"));
    if (queryGroup) return queryGroup;
    const path = url.pathname.replace(/\/+$/, "");
    const tail = path.split("/").filter(Boolean).pop();
    if (tail && !/\.[a-z0-9]+$/i.test(tail)) return sanitizeGroupId(tail);
  } catch (e) {}
  return DEFAULT_SYNC_GROUP_ID;
};
const syncUrlGroupId = (groupId) => {
  try {
    const url = new URL(window.location.href);
    url.searchParams.set("group", sanitizeGroupId(groupId));
    window.history.replaceState({}, "", url.toString());
  } catch (e) {}
};
const cloneGroups = (groups) => JSON.parse(JSON.stringify(Array.isArray(groups) ? groups : []));
const normalizeSyncPayload = (payload, fallbackGroupId = DEFAULT_SYNC_GROUP_ID) => {
  if (Array.isArray(payload)) {
    const now = Date.now();
    return { group_id: sanitizeGroupId(fallbackGroupId), last_updated: now, synced_at: now, groups: cloneGroups(payload) };
  }
  if (payload && typeof payload === "object") {
    const groups = Array.isArray(payload.groups) ? payload.groups : Array.isArray(payload.data) ? payload.data : [];
    const lastUpdated = Number(payload.last_updated || payload.updated_at || payload.timestamp || Date.now()) || Date.now();
    const syncedAt = Number(payload.synced_at || payload.last_synced_at || payload.syncedAt || lastUpdated) || lastUpdated;
    return {
      ...payload,
      group_id: sanitizeGroupId(payload.group_id || payload.groupId || fallbackGroupId),
      last_updated: lastUpdated,
      synced_at: syncedAt,
      groups: cloneGroups(groups),
    };
  }
  const now = Date.now();
  return { group_id: sanitizeGroupId(fallbackGroupId), last_updated: now, synced_at: now, groups: [] };
};
const hasUnsyncedLocalChanges = (payload) => Number(payload?.last_updated || 0) > Number(payload?.synced_at || 0);
const formatSyncTime = (value) => {
  const ts = Number(value || 0);
  if (!ts) return "未同步";
  const d = new Date(ts);
  if (Number.isNaN(d.getTime())) return "未同步";
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
const mergeGroups = (localGroups, remoteGroups) => {
  const merged = cloneGroups(remoteGroups);
  const index = new Map(merged.map(g => [g.id, g]));
  cloneGroups(localGroups).forEach(group => {
    const existing = index.get(group.id);
    if (!existing) {
      const nextGroup = { ...group, words: cloneGroups(group.words || []) };
      merged.push(nextGroup);
      index.set(nextGroup.id, nextGroup);
      return;
    }
    const wordMap = new Map((existing.words || []).map(word => [word.id || word.kana, { ...word }]));
    (group.words || []).forEach(word => {
      const key = word.id || word.kana;
      const prev = wordMap.get(key) || {};
      wordMap.set(key, { ...prev, ...word });
    });
    existing.words = [...wordMap.values()];
    existing.name = group.name || existing.name;
  });
  return merged;
};
const requestJson = async (url, options = {}, timeoutMs = 10000) => {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const response = await fetch(url, { ...options, signal: controller.signal });
    const text = await response.text();
    let data = null;
    if (text) {
      try { data = JSON.parse(text); } catch (e) { data = { raw: text }; }
    }
    if (!response.ok) {
      throw new Error((data && (data.message || data.error)) || `请求失败（${response.status}）`);
    }
    return data || {};
  } finally {
    clearTimeout(timer);
  }
};
const pullFromCloud = async (groupId) => {
  const url = new URL(CLOUD_SYNC_BASE);
  url.searchParams.set("group", sanitizeGroupId(groupId));
  const data = await requestJson(url.toString(), { method:"GET", headers:{ Accept:"application/json" } });
  return normalizeSyncPayload(data.data ?? data.payload ?? data, groupId);
};
const pushToCloud = async (groupId, data) => {
  const payload = normalizeSyncPayload(data, groupId);
  const url = new URL(CLOUD_SYNC_BASE);
  url.searchParams.set("group", sanitizeGroupId(groupId));
  const res = await requestJson(url.toString(), {
    method:"POST",
    headers:{ "Content-Type":"application/json", Accept:"application/json" },
    body: JSON.stringify({ group_id:sanitizeGroupId(groupId), ...payload }),
  });
  return normalizeSyncPayload(res.data ?? res.payload ?? payload, groupId);
};
const downloadBlob = (blob, filename) => {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
};
const makeWorkbookFromGroups = (groups) => {
  const wb = XLSX.utils.book_new();
  const used = new Set();
  (groups.length ? groups : [{ name:"单词组", words:[] }]).forEach(g => {
    const rows = (g.words || []).map(wordToExcelRow);
    const ws = XLSX.utils.aoa_to_sheet([EXCEL_HEADERS, ...rows.map(row => EXCEL_HEADERS.map(h => row[h] || ""))]);
    XLSX.utils.book_append_sheet(wb, ws, safeSheetName(g.name, used));
  });
  return wb;
};
const parseWorkbookSheets = (arrayBuffer) => {
  const wb = XLSX.read(arrayBuffer, { type:"array" });
  return wb.SheetNames.map(name => {
    const ws = wb.Sheets[name];
    const rawRows = XLSX.utils.sheet_to_json(ws, { defval:"" });
    const words = [];
    const warnings = [];
    rawRows.forEach((row, i) => {
      const parsed = excelRowToWord(row, i + 2);
      if (parsed.word) words.push(parsed.word);
      else if (parsed.skipped && !parsed.silent) warnings.push({ rowNumber:parsed.rowNumber, reason:parsed.reason });
    });
    return {
      name,
      words,
      warnings,
      preview: rawRows.slice(0, 3).map(r => EXCEL_HEADERS.reduce((acc, h) => ({...acc, [h]:getCell(r, h)}), {})),
    };
  });
};

/* ===== STORAGE ===== */
const storage = {
  key(groupId) { return `classtango_data_${sanitizeGroupId(groupId)}`; },
  save(groupId, data) { try { localStorage.setItem(this.key(groupId), JSON.stringify(normalizeSyncPayload(data, groupId))); } catch(e){} },
  load(groupId) {
    try {
      const key = this.key(groupId);
      const s = localStorage.getItem(key);
      if (s) return normalizeSyncPayload(JSON.parse(s), groupId);
      if (sanitizeGroupId(groupId) === DEFAULT_SYNC_GROUP_ID) {
        const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
        if (legacy) {
          const normalized = normalizeSyncPayload(JSON.parse(legacy), groupId);
          this.save(groupId, normalized);
          return normalized;
        }
      }
      return null;
    } catch(e){ return null; }
  }
};

function Modal({ open, onClose, title, children, wide }) {
  if (!open) return null;
  return (
    <div style={{ position:"fixed", inset:0, zIndex:1000, display:"flex", alignItems:"center", justifyContent:"center", background:"rgba(0,0,0,0.5)", backdropFilter:"blur(5px)" }}
      onClick={onClose}>
      <div className="pop-in" style={{ background:C.card, borderRadius:18, padding:"28px 32px", width: wide?"min(780px,93vw)":"min(540px,93vw)",
        maxHeight:"90vh", overflowY:"auto", boxShadow:"0 24px 80px rgba(0,0,0,0.25)" }}
        onClick={e => e.stopPropagation()}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:22 }}>
          <h3 style={{ margin:0, fontSize:18, fontWeight:700, color:C.text }}>{title}</h3>
          <button onClick={onClose} style={{ background:"none", border:"none", cursor:"pointer", padding:4, borderRadius:6 }}><IX size={18} color={C.muted}/></button>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ===== WORD FORM ===== */
function WordForm({ word, onSave, onCancel }) {
  const [w, setW] = useState(word ? {...word, examples: word.examples.map(e=>({...e}))} : {...EMPTY_WORD, id:gid(), examples:[{ja:"",cn:""}]});
  const fileRef = useRef();
  const set = (k,v) => setW(p => ({...p, [k]:v}));
  const setEx = (i,k,v) => setW(p => { const exs=[...p.examples]; exs[i]={...exs[i],[k]:v}; return {...p, examples:exs}; });
  const addEx = () => setW(p => ({...p, examples:[...p.examples,{ja:"",cn:""}]}));
  const rmEx = (i) => setW(p => ({...p, examples: p.examples.filter((_,j)=>j!==i)}));
  const handleImg = (e) => { const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>set("imageUrl",r.result); r.readAsDataURL(f); };

        <div><label style={sLabel}>汉字</label><input style={sInput} value={w.kanji} onChange={e=>set("kanji",e.target.value)} placeholder="例：卵"/></div>
        <div><label style={sLabel}>声调</label><input style={sInput} value={w.accent} onChange={e=>set("accent",e.target.value)} placeholder="例：0 / ②"/></div>
        <div><label style={sLabel}>词性</label>
          <select style={{...sInput, background:"#fff"}} value={w.pos} onChange={e=>set("pos",e.target.value)}>
            {POS_OPTIONS.map(p=><option key={p}>{p}</option>)}
          </select>
        </div>
      </div>
      <div style={{ marginBottom:14 }}>
        <label style={sLabel}>中文释义（必填）</label>
        <input style={sInput} value={w.meaning} onChange={e=>set("meaning",e.target.value)} placeholder="例：鸡蛋"/>

      <div style={{ marginBottom:14 }}>
        <label style={sLabel}>用法说明</label>
        <textarea style={{...sInput, minHeight:48, resize:"vertical"}} value={w.usage} onChange={e=>set("usage",e.target.value)} placeholder="可选：补充该词的用法、搭配等"/>
      </div>
      <div style={{ marginBottom:14 }}>
        <label style={sLabel}>配图</label>
        <div style={{ display:"flex", gap:8 }}>

          <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleImg}/>

        {w.examples.map((ex,i) => (
          <div key={i} style={{ display:"flex", gap:8, marginBottom:8, alignItems:"start" }}>
            <div style={{ flex:1 }}>
              <input style={{...sInput, marginBottom:4}} value={ex.ja} onChange={e=>setEx(i,"ja",e.target.value)} placeholder="日语例句"/>
              <input style={sInput} value={ex.cn} onChange={e=>setEx(i,"cn",e.target.value)} placeholder="中文翻译"/>

    </div>
  );
}

/* ===== EDIT MODE ===== */
function EditMode({ groups, setGroups, gid: curGid, setGid: setCurGid }) {
  const [showForm, setShowForm] = useState(false);
  const [editWord, setEditWord] = useState(null);
  const [renaming, setRenaming] = useState(null);
  const [renameVal, setRenameVal] = useState("");
  const group = groups.find(g => g.id === curGid);

  const addGroup = () => { const ng = { id:gid(), name:`单词组 ${groups.length+1}`, words:[] }; setGroups([...groups, ng]); setCurGid(ng.id); };
  const delGroup = (id) => { if(!confirm("确定删除该单词组及其中所有单词？")) return; const ng=groups.filter(g=>g.id!==id); setGroups(ng); if(curGid===id) setCurGid(ng[0]?.id||null); };
  const startRename = (g) => { setRenaming(g.id); setRenameVal(g.name); };
  const finishRename = () => { if(renameVal.trim()) setGroups(groups.map(g=>g.id===renaming?{...g,name:renameVal.trim()}:g)); setRenaming(null); };
  const saveWord = (w) => {
    setGroups(groups.map(g => {
      if (g.id !== curGid) return g;
      const exists = g.words.find(x=>x.id===w.id);
      return {...g, words: exists ? g.words.map(x=>x.id===w.id?w:x) : [...g.words, w]};
    }));
    setShowForm(false); setEditWord(null);
  };
  const delWord = (wid) => { if(!confirm("删除该单词？")) return; setGroups(groups.map(g=>g.id!==curGid?g:{...g, words:g.words.filter(w=>w.id!==wid)})); };
  const moveWord = (idx, dir) => {
    setGroups(groups.map(g => {
      if (g.id !== curGid) return g;
      const ws=[...g.words]; const ni=idx+dir; if(ni<0||ni>=ws.length) return g;
      [ws[idx],ws[ni]]=[ws[ni],ws[idx]]; return {...g, words:ws};
    }));
  };

  return (
    <div style={{ display:"flex", height:"calc(100vh - 64px)" }}>
      {/* Sidebar */}
      <div style={{ width:250, borderRight:`1px solid ${C.border}`, background:C.card, display:"flex", flexDirection:"column", flexShrink:0 }}>
        <div style={{ padding:"14px 16px", borderBottom:`1px solid ${C.borderLight}`, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <span style={{ fontSize:14, fontWeight:700, color:C.text }}>📁 单词组</span>
          <button onClick={addGroup} style={{ background:C.primaryLight, border:"none", borderRadius:8, width:30, height:30, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>
            <IPlus size={15} color={C.primary}/>
          </button>
        </div>
        <div style={{ flex:1, overflowY:"auto", padding:8 }}>
          {groups.map(g => (
            <div key={g.id} onClick={()=>setCurGid(g.id)}
              style={{ padding:"10px 12px", borderRadius:10, marginBottom:3, cursor:"pointer",
                background: g.id===curGid ? C.primaryLight : "transparent",
                border: g.id===curGid ? `1.5px solid rgba(200,64,45,0.2)` : "1.5px solid transparent",
                transition:"all 0.15s" }}>
              {renaming === g.id ? (
                <input autoFocus value={renameVal} onChange={e=>setRenameVal(e.target.value)}
                  onBlur={finishRename} onKeyDown={e=>e.key==="Enter"&&finishRename()}
                  style={{ width:"100%", padding:"3px 6px", border:`1.5px solid ${C.primary}`, borderRadius:5, fontSize:13, outline:"none" }}
                  onClick={e=>e.stopPropagation()}/>
              ) : (
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <div>
                    <div style={{ fontSize:13, fontWeight:600, color:C.text, lineHeight:1.3 }}>{g.name}</div>
                    <div style={{ fontSize:11, color:C.muted, marginTop:2 }}>{g.words.length} 个单词</div>
                  </div>
                  <div style={{ display:"flex", gap:2 }} onClick={e=>e.stopPropagation()}>
                    <button onClick={()=>startRename(g)} style={{ background:"none", border:"none", cursor:"pointer", padding:3, borderRadius:4 }}><IEdit size={13}/></button>
                    <button onClick={()=>delGroup(g.id)} style={{ background:"none", border:"none", cursor:"pointer", padding:3, borderRadius:4 }}><ITrash size={13} color={C.wrong}/></button>
                  </div>
                </div>
              )}
            </div>
          ))}
          {groups.length === 0 && <div style={{ textAlign:"center", color:C.muted, fontSize:13, marginTop:50, lineHeight:1.8 }}>暂无单词组<br/>点击 ＋ 创建</div>}
        </div>
      </div>

      {/* Main content */}
      <div style={{ flex:1, overflowY:"auto", padding:"24px 28px", background:C.bg }}>
        {group ? (
          <div className="fade-in">
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:22 }}>
              <h2 style={{ margin:0, fontSize:21, fontWeight:700, color:C.text }}>{group.name}</h2>
              <button onClick={()=>{setEditWord(null);setShowForm(true)}}
                style={sBtn(C.primary,"#fff",{ display:"flex", alignItems:"center", gap:6, boxShadow:"0 3px 12px rgba(200,64,45,0.25)" })}>
                <IPlus size={15} color="#fff"/> 添加单词

            ) : (
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(290px, 1fr))", gap:14 }}>
                {group.words.map((w, idx) => (

                    onMouseLeave={e=>{e.currentTarget.style.boxShadow="none";e.currentTarget.style.transform="none";}}>
                    {w.imageUrl && <img src={w.imageUrl} alt="" style={{ width:"100%", height:130, objectFit:"cover", borderRadius:10, marginBottom:12 }} onError={e=>e.target.style.display="none"}/>}
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
                      <div>
                        <div style={{ fontSize:22, fontWeight:700, fontFamily:SF, color:C.text }}>
                          {w.kanji || w.kana}

                        <span style={{ display:"inline-block", padding:"2px 8px", borderRadius:20, background:C.greenLight, color:C.green, fontSize:11, fontWeight:600, marginTop:5 }}>{w.pos}</span>
                      </div>
                      <div style={{ fontSize:16, fontWeight:700, color:C.primary, textAlign:"right", maxWidth:"40%" }}>{w.meaning}</div>
                    </div>

                    {w.examples.filter(e=>e.ja).length > 0 && (
                      <div style={{ marginTop:10, padding:"8px 10px", background:C.bg, borderRadius:8, fontSize:12 }}>
                        {w.examples.filter(e=>e.ja).map((ex,i) => (
                          <div key={i} style={{ marginBottom: i<w.examples.filter(e=>e.ja).length-1 ? 5:0 }}>
                            <div style={{ color:C.text, fontFamily:SF }}>{ex.ja}</div>
                            {ex.cn && <div style={{ color:C.muted }}>{ex.cn}</div>}
                          </div>
                        ))}

                    )}
                    <div style={{ display:"flex", gap:4, marginTop:10, justifyContent:"flex-end" }}>
                      {idx > 0 && <button onClick={()=>moveWord(idx,-1)} style={{ background:C.bg, border:"none", borderRadius:6, width:28, height:28, cursor:"pointer", fontSize:13 }}>↑</button>}

  );
}

/* ===== VISUAL ACCENT CURVE ENGINE ===== */
function VisualAccentCurve({ kana, accent, color = "#C8402D", fontSize = 20 }) {
  const morae = useMemo(() => {
    if (!kana) return [];
    const res = [];
    const smalls = ["ゃ","ゅ","ょ","ャ","ュ","ョ","ぁ","ぃ","ぅ","ぇ","ぉ","ァ","ィ","ゥ","ェ","ォ"];
    for (let i = 0; i < kana.length; i++) {
      const char = kana[i];
      if (i > 0 && smalls.includes(char)) {
        res[res.length - 1] += char;
      } else {
        res.push(char);
      }
    }
    return res;
  }, [kana]);

  const accentNum = useMemo(() => {
    if (accent === undefined || accent === null || accent === "") return null;
    const clean = String(accent).trim();
    const circleMap = {
      "⓪":0,"①":1,"②":2,"③":3,"④":4,"⑤":5,"⑥":6,"⑦":7,"⑧":8,"⑨":9,"⑩":10
    };
    if (circleMap[clean] !== undefined) return circleMap[clean];
    const parsed = parseInt(clean.replace(/[^0-9]/g, ""), 10);
    return isNaN(parsed) ? null : parsed;
  }, [accent]);

  if (accentNum === null || morae.length === 0) {
    return <span style={{ fontFamily: "'Noto Serif JP', serif" }}>{kana}</span>;
  }

  const N = morae.length;
  const A = accentNum;

  // true for High, false for Low
  const pitchLevels = Array(N).fill(false);
  if (A === 0) {
    pitchLevels[0] = N === 1;
    for (let i = 1; i < N; i++) pitchLevels[i] = true;
  } else if (A === 1) {
    pitchLevels[0] = true;
    for (let i = 1; i < N; i++) pitchLevels[i] = false;
  } else {
    pitchLevels[0] = false;
    for (let i = 1; i < Math.min(A, N); i++) pitchLevels[i] = true;
    for (let i = A; i < N; i++) pitchLevels[i] = false;
  }

  const svgH = 14; 
  const highY = 3;
  const lowY = 11;

  const points = morae.map((_, i) => {
    const x = ((i + 0.5) / N) * 100;
    const y = pitchLevels[i] ? highY : lowY;
    return { x, y };
  });

  let pathD = "";
  if (points.length > 0) {
    pathD = `M ${points[0].x} ${points[0].y}`;
    for (let i = 1; i < N; i++) {
      const prev = points[i-1];
      const curr = points[i];
      if (prev.y !== curr.y) {
        const midX = (prev.x + curr.x) / 2;
        pathD += ` L ${midX} ${prev.y} L ${midX} ${curr.y} L ${curr.x} ${curr.y}`;
      } else {
        pathD += ` L ${curr.x} ${curr.y}`;
      }
    }
    if (A === N && N > 0) {
      const endX = 100;
      pathD += ` L ${endX} ${highY} L ${endX} ${lowY}`;
    }
    if (A === 0 && N > 0) {
      const endX = 100;
      pathD += ` L ${endX} ${highY}`;
    }
  }

  return (
    <div style={{ display:"inline-flex", flexDirection:"column", alignItems:"center", position:"relative", width:"fit-content", verticalAlign:"middle" }}>
      <svg style={{ width:"100%", height:svgH, display:"block", overflow:"visible", marginBottom:1 }} viewBox="-8 0 108 14" preserveAspectRatio="none">
        {/* 参考音轨与网格 */}
        <text x="-4.5" y={highY + 1.2} fill="#B8B0A4" fontSize="3.5" fontWeight="600" textAnchor="middle" style={{ userSelect: "none" }}>高</text>
        <text x="-4.5" y={lowY + 1.2} fill="#B8B0A4" fontSize="3.5" fontWeight="600" textAnchor="middle" style={{ userSelect: "none" }}>低</text>
        
        <line x1="0" y1={highY} x2="100" y2={highY} stroke="#E6DED3" strokeWidth="0.5" strokeDasharray="2 3" opacity="0.8" />
        <line x1="0" y1={lowY} x2="100" y2={lowY} stroke="#E6DED3" strokeWidth="0.5" strokeDasharray="2 3" opacity="0.8" />
        
        <line x1="0" y1="0" x2="0" y2="14" stroke="#E6DED3" strokeWidth="0.5" opacity="0.4" />
        {Array.from({ length: N - 1 }).map((_, i) => {
          const x = ((i + 1) / N) * 100;
          return <line key={i} x1={x} y1="0" x2={x} y2="14" stroke="#E6DED3" strokeWidth="0.5" strokeDasharray="1 3" opacity="0.5" />;
        })}
        <line x1="100" y1="0" x2="100" y2="14" stroke="#E6DED3" strokeWidth="0.5" opacity="0.4" />
        
        <path className="accent-path-animated" d={pathD} fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
        {points.map((p, idx) => {
          const isNucleus = A > 0 && idx === A - 1;
          return (
            <circle
              key={idx}
              cx={p.x}
              cy={p.y}
              r={isNucleus ? "2.8" : "2"}
              fill={isNucleus ? "#C9A96E" : color}
              stroke={isNucleus ? color : "#fff"}
              strokeWidth="0.8"
            />
          );
        })}
      </svg>
      <div style={{ display:"flex", width:"100%", justifyContent:"space-around", fontFamily: "'Noto Serif JP', serif", fontSize, fontWeight:700, lineHeight:1.1 }}>
        {morae.map((m, idx) => (
          <div key={idx} style={{ flex:1, textAlign:"center", minWidth:"1.1em" }}>{m}</div>
        ))}
      </div>
    </div>
  );
}

/* ===== TEACH MODE ===== */
function TeachMode({ groups, gid: curGid }) {
  const group = groups.find(g => g.id === curGid);
  const words = group?.words || [];
  const [page, setPage] = useState(0);
  const [cardCount, setCardCount] = useState(4);
  const [showMeaningMap, setShowMeaningMap] = useState({});
  const [showExamplesMap, setShowExamplesMap] = useState({});
  const [flippedCardMap, setFlippedCardMap] = useState({});
  const [exampleTranslationMap, setExampleTranslationMap] = useState({});
  const [zoomedImage, setZoomedImage] = useState(null);
  const [quizPhase, setQuizPhase] = useState(null);
  const [countdownTotal, setCountdownTotal] = useState(60);
  const [countdownLeft, setCountdownLeft] = useState(0);
  const [selectedCard, setSelectedCard] = useState(null);
  const [cardStatus, setCardStatus] = useState({});
  const [revealedCard, setRevealedCard] = useState(null);
  const [scores, setScores] = useState({ kana:{correct:0,total:0}, reverse:{correct:0,total:0} });
  const [kanaResults, setKanaResults] = useState({});
  const [reverseResults, setReverseResults] = useState({});
  const [quizWords, setQuizWords] = useState([]);
  const CELL_CONFIG = {
    1: { cols:1, rows:1, imgFlex:"0 0 50%", textPadding:"48px 56px", backPadding:"42px 56px", textLineWidth:848, showImg:true, showUsage:true, showExamples:true, kanjiSize:72, noImgKanjiSize:84, kanaSize:32, meaningSize:56, tagSize:18, tagPadding:"6px 18px", tagRadius:24, usageSize:24, exJaSize:34, exCnSize:24, maxExamples:99, exBarWidth:4, blurRadius:10 },
    4: { cols:2, rows:2, imgFlex:"0 0 50%", textPadding:"16px 22px", backPadding:"26px 30px", textLineWidth:432, showImg:true, showUsage:true, showExamples:true, kanjiSize:44, kanaSize:22, meaningSize:34, tagSize:14, tagPadding:"4px 13px", tagRadius:20, usageSize:17, exJaSize:27, exCnSize:20, maxExamples:99, exBarWidth:3, blurRadius:7 },
    6: { cols:3, rows:2, imgFlex:"0 0 50%", textPadding:"12px 16px", backPadding:"20px 22px", textLineWidth:284, showImg:true, showUsage:true, showExamples:true, kanjiSize:32, kanaSize:18, meaningSize:26, tagSize:13, tagPadding:"3px 9px", tagRadius:16, usageSize:15, exJaSize:21, exCnSize:17, maxExamples:99, exBarWidth:3, blurRadius:6 },
  };
  const countOptions = [
    { label:"大", count:1, desc:"单词大图展示" },
    { label:"中", count:4, desc:"2×2 四宫格" },
    { label:"小", count:6, desc:"2×3 六宫格" },
  ];
  const getDefaultCount = (len) => len >= 4 ? 4 : 1;
  const requestedCount = ((cardCount === 4 && words.length < 4) || (cardCount === 6 && words.length < 6)) ? getDefaultCount(words.length) : cardCount;
  const effectiveCount = CELL_CONFIG[requestedCount] ? requestedCount : getDefaultCount(words.length);
  const totalPages = Math.max(1, Math.ceil((words.length || 1) / effectiveCount));
  const safePage = Math.min(page, totalPages - 1);
  const pageWords = words.slice(safePage * effectiveCount, safePage * effectiveCount + effectiveCount);
  const quizActive = ["kana","reverse","result"].includes(quizPhase) && quizWords.length > 0;
  const currentWords = quizActive ? quizWords : pageWords;
  const cfg = CELL_CONFIG[effectiveCount] || CELL_CONFIG[4];
  const gridColumns = cfg.cols;
  const gridRows = cfg.rows;
  const getCellPosition = (i) => {
    const cols = gridColumns;
    return { col:(i % cols) + 1, span:1, row:Math.floor(i / cols) + 1, cols, rows:gridRows };
  };
  const pct = ((safePage + 1) / totalPages) * 100;
  const pageHasExamples = currentWords.some(w => (w.examples || []).some(e => e.ja));
  const allMeaningShown = currentWords.length > 0 && currentWords.every((_, i) => showMeaningMap[i]);
  const allExamplesShown = !cfg.showExamples || !pageHasExamples || currentWords.every((w, i) => !(w.examples || []).some(e => e.ja) || showExamplesMap[i]);
  const revealLabel = !allMeaningShown ? "👁 揭示释义" : (cfg.showExamples && !allExamplesShown ? "📖 揭示例句" : "✓ 已全部揭示");
  const pendingIndexes = currentWords.map((_, i) => i).filter(i => cardStatus[i] === "pending");
  const allQuizDone = currentWords.length > 0 && currentWords.every((_, i) => cardStatus[i] && cardStatus[i] !== "pending");
  const countdownRatio = countdownTotal ? countdownLeft / countdownTotal : 0;
  const countdownColor = countdownRatio > 0.5 ? C.green : countdownRatio > 0.2 ? "#E8A040" : C.primary;
  const wrongWords = useMemo(() => currentWords.filter((_, i) => kanaResults[i] === "wrong" || reverseResults[i] === "wrong"), [kanaResults, reverseResults, currentWords]);

  const resetReveal = () => { setShowMeaningMap({}); setShowExamplesMap({}); setFlippedCardMap({}); setExampleTranslationMap({}); };
  const resetQuizState = () => {
    setQuizPhase(null);
    setCountdownLeft(0);
    setSelectedCard(null);
    setCardStatus({});
    setRevealedCard(null);
    setScores({ kana:{correct:0,total:0}, reverse:{correct:0,total:0} });
    setKanaResults({});
    setReverseResults({});
    setQuizWords([]);
  };
  const goPage = (n) => {
    setPage(Math.max(0, Math.min(n, totalPages - 1)));
    resetReveal();
    resetQuizState();
  };
  const smartBreak = (text, lang, fontSize) => {
    if (!text) return text;
    const raw = String(text);
    const maxChars = Math.max(6, Math.floor((cfg.textLineWidth / fontSize) * (lang === "ja" ? 1.08 : 0.96)));
    if (raw.length <= maxChars) return raw;
    const marks = ["、","，",",","。","．",".","；",";","：",":","！","!","？","?"];
    let idx = -1;
    marks.forEach(mark => {
      const found = raw.lastIndexOf(mark, raw.length - 2);
      if (found > idx) idx = found;
    });
    if (idx < 1 || idx >= raw.length - 1) return raw;
    return <>{raw.slice(0, idx + 1)}<br/>{raw.slice(idx + 1).trimStart()}</>;
  };
  const chooseCount = (n) => {
    if (![1,4,6].includes(n)) return;
    if ((n === 4 && words.length < 4) || (n === 6 && words.length < 6)) return;
    resetQuizState();
    setCardCount(n);
    setPage(0);
    resetReveal();
  };
  const startCountdown = (seconds) => {
    setCountdownTotal(seconds);
    setCountdownLeft(seconds);
  };
  const enterKanaPhase = useCallback(() => {
    const nextQuizWords = shuffle(pageWords);
    setQuizWords(nextQuizWords);
    setQuizPhase("kana");
    setCardStatus(Object.fromEntries(nextQuizWords.map((_, i) => [i, "pending"])));
    setSelectedCard(null);
    setRevealedCard(null);
  }, [pageWords]);
  const enterReversePhase = () => {
    setKanaResults({...cardStatus});
    setQuizPhase("reverse");
    setCardStatus(Object.fromEntries((quizWords.length ? quizWords : currentWords).map((_, i) => [i, "pending"])));
    setSelectedCard(null);
    setRevealedCard(null);
  };
  const enterResultPhase = () => {
    setReverseResults({...cardStatus});
    setQuizPhase("result");
    setSelectedCard(null);
    setRevealedCard(null);
  };
  const restartQuiz = () => {
    setQuizPhase("countdown");
    setCountdownLeft(0);
    setScores({ kana:{correct:0,total:0}, reverse:{correct:0,total:0} });
    setCardStatus({});
    setSelectedCard(null);
    setRevealedCard(null);
    setKanaResults({});
    setReverseResults({});
    setQuizWords([]);
  };
  const exitAndNextPage = () => {
    resetQuizState();
    if (safePage < totalPages - 1) goPage(safePage + 1);
  };
  const pickRandomCard = () => {
    const pending = currentWords.map((_, i) => i).filter(i => cardStatus[i] === "pending");
    if (pending.length === 0) return;
    setSelectedCard(pending[Math.floor(Math.random() * pending.length)]);
    setRevealedCard(null);
  };
  const handleCardClick = (i) => {
    if (!quizPhase) {
      const isMeaningShown = !!showMeaningMap[i];

      if (!isMeaningShown) {
        setShowMeaningMap(p => ({ ...p, [i]: true }));
      } else {
        setShowMeaningMap(p => { const next = { ...p }; delete next[i]; return next; });
        setShowExamplesMap(p => { const next = { ...p }; delete next[i]; return next; });
        setFlippedCardMap(p => { const next = { ...p }; delete next[i]; return next; });
        setExampleTranslationMap(p => { const next = { ...p }; delete next[i]; return next; });
      }
      return;
    }

    if (!["kana","reverse"].includes(quizPhase) || cardStatus[i] !== "pending") return;
    if (revealedCard !== null) return;
    if (selectedCard === i) setRevealedCard(i);
    else setSelectedCard(i);
  };
  const markCard = (i, result) => {
    if (!["kana","reverse"].includes(quizPhase)) return;
    const phaseKey = quizPhase === "kana" ? "kana" : "reverse";
    const newStatus = { ...cardStatus, [i]: result };
    setCardStatus(newStatus);
    setScores(prev => ({
      ...prev,
      [phaseKey]: {
        correct: prev[phaseKey].correct + (result === "correct" ? 1 : 0),
        total: prev[phaseKey].total + 1
      }
    }));
    setRevealedCard(null);
    setSelectedCard(null);
  };
  const revealAll = useCallback(() => {
    if (!currentWords.length) return;
    if (!currentWords.every((_, i) => showMeaningMap[i])) {
      setShowMeaningMap(Object.fromEntries(currentWords.map((_, i) => [i, true])));
      return;
    }
    if (cfg.showExamples && currentWords.some((w, i) => (w.examples || []).some(e => e.ja) && !showExamplesMap[i])) {
      setShowExamplesMap(Object.fromEntries(currentWords.map((w, i) => [i, (w.examples || []).some(e => e.ja)])));
      setFlippedCardMap(Object.fromEntries(currentWords.map((w, i) => [i, (w.examples || []).some(e => e.ja)])));
      setExampleTranslationMap(Object.fromEntries(currentWords.map((_, i) => [i, false])));
    }
  }, [currentWords, showMeaningMap, showExamplesMap, cfg.showExamples]);

  useEffect(() => { setPage(0); setCardCount(getDefaultCount(words.length)); resetReveal(); }, [curGid]);
  useEffect(() => {
    if (words.length > 0 && ((cardCount === 4 && words.length < 4) || (cardCount === 6 && words.length < 6))) { setCardCount(getDefaultCount(words.length)); setPage(0); resetReveal(); }
    else if (page > totalPages - 1) { setPage(totalPages - 1); resetReveal(); }
  }, [words.length, cardCount, page, totalPages]);

  useEffect(() => {
    const h = (e) => {
      if (!words.length) return;
      if (quizPhase) {
        if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); return; }
        if (e.key === " ") {
          e.preventDefault();
          if (quizPhase === "countdown") enterKanaPhase();
          else if (["kana","reverse"].includes(quizPhase)) {
            if (selectedCard === null) pickRandomCard();
            else if (revealedCard === null && cardStatus[selectedCard] === "pending") setRevealedCard(selectedCard);
          }
        }
        if (e.key === "1" && revealedCard !== null) markCard(revealedCard, "correct");
        if (e.key === "2" && revealedCard !== null) markCard(revealedCard, "wrong");
        return;
      }
      if (e.key === "ArrowRight" && safePage < totalPages - 1) goPage(safePage + 1);
      if (e.key === "ArrowLeft" && safePage > 0) goPage(safePage - 1);
      if (e.key === " ") { e.preventDefault(); revealAll(); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [words.length, safePage, totalPages, revealAll, quizPhase, selectedCard, revealedCard, cardStatus, enterKanaPhase]);

  useEffect(() => {
    if (quizPhase !== "countdown" || countdownLeft <= 0) return;
    const timer = setInterval(() => {
      setCountdownLeft(prev => {
        if (prev <= 1) {
          clearInterval(timer);
          enterKanaPhase();
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(timer);
  }, [quizPhase, countdownLeft, enterKanaPhase]);

  if (!group || group.words.length === 0) return (
    <div style={{ display:"flex", alignItems:"center", justifyContent:"center", height:VH, overflow:"hidden", background:C.bg, color:C.muted, fontSize:16 }}>
      请先在「编辑」模式中选择一个含有单词的单词组
    </div>
  );

  const renderCard = (w, localIdx) => {
    const pos = getCellPosition(localIdx);
    const isRightEdge = pos.col + pos.span - 1 >= pos.cols;
    const isBottomEdge = pos.row >= pos.rows;
    const showMeaning = !!showMeaningMap[localIdx];
    const showExamples = !!showExamplesMap[localIdx];
    const examples = (w.examples || []).filter(e => e.ja || e.cn).slice(0, cfg.maxExamples);
    const hasImage = cfg.showImg && w.imageUrl;
    const noImageSingle = effectiveCount === 1 && !hasImage;
    const isQuizCard = ["kana","reverse"].includes(quizPhase);
    const status = cardStatus[localIdx];
    const isRevealed = !isQuizCard || revealedCard === localIdx || status !== "pending";
    const isSelected = isQuizCard && selectedCard === localIdx && status === "pending";
    const dimCard = isQuizCard && selectedCard !== null && !isSelected && status === "pending" && revealedCard === null;
    const showFullInfo = !isQuizCard || isRevealed;
    const showTags = !isQuizCard || isRevealed;
    const showMeaningBlock = !isQuizCard || quizPhase === "reverse" || isRevealed;
    const showExamplesBlock = !isQuizCard || (quizPhase === "reverse" && isRevealed);

    const mainText = quizPhase === "kana" ? w.kana : quizPhase === "reverse" && !isRevealed ? "？？？" : (w.kanji || w.kana);
    const subText = quizPhase === "kana" ? (isRevealed ? (w.kanji || "") : "？？？") : quizPhase === "reverse" ? (isRevealed ? w.kana : "？？？") : (w.kanji ? w.kana : "");

    const showMainCurve = (!isQuizCard || isRevealed) && !w.kanji && quizPhase !== "kana";
    const showSubCurve = (!isQuizCard || isRevealed) && !!w.kanji && quizPhase !== "kana";

    const meaningRevealed = !!(quizPhase || showMeaning);
    const examplesRevealed = !!(quizPhase || showExamples);
    const isBackShown = !isQuizCard && cfg.showExamples && examples.length > 0 && !!flippedCardMap[localIdx];
    const translationRevealed = !!exampleTranslationMap[localIdx];

    return (
      <div className="fade-in" key={w.id} style={{ background:C.card, borderRadius:0, padding:0,
        height:"100%", border:"none", borderRight:isRightEdge?"none":`1px solid ${C.borderLight}`, borderBottom:isBottomEdge?"none":`1px solid ${C.borderLight}`, display:"flex",
        flexDirection:"row", gap:0, alignItems:"stretch", minHeight:0, position:"relative", cursor:isQuizCard&&status==="pending"?"pointer":"pointer",
        opacity:dimCard?0.45:1,
        boxShadow:"none",
        zIndex: isSelected ? 5 : 1,
        outline:isSelected?`3px solid ${C.primary}`:"none", outlineOffset:-3, animation:isSelected?"breathe 1.5s ease-in-out infinite":undefined,
        transition: "all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1)" }}
        onClick={()=>handleCardClick(localIdx)}>

        {isBackShown ? (
          <div style={{ width:"100%", height:"100%", padding:cfg.backPadding, display:"flex", flexDirection:"column", justifyContent:"center", background:C.card, position:"relative", zIndex:4, transformOrigin:"center", animation:"flipInY 0.28s ease both" }}>
            <button onClick={(e)=>{ e.stopPropagation(); setFlippedCardMap(p => ({ ...p, [localIdx]: false })); setExampleTranslationMap(p => ({ ...p, [localIdx]: false })); }}
              style={{ position:"absolute", top:14, right:14, padding:"6px 14px", borderRadius:18, border:`1px solid ${C.border}`, background:C.bg, color:C.muted, fontSize:13, fontWeight:700, cursor:"pointer" }}>
              返回正面
            </button>
            <div style={{ color:C.primary, fontSize:Math.max(16, cfg.tagSize + 2), fontWeight:800, marginBottom:Math.max(12, cfg.exJaSize * 0.45), textAlign:"center" }}>
              {w.kanji || w.kana} · 例句
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:Math.max(10, cfg.exJaSize * 0.38), maxHeight:"82%", overflowY:"auto", paddingRight:4 }}>
              {examples.map((ex,i) => (
                <div key={i} style={{ paddingLeft:Math.max(10, cfg.exBarWidth * 4), borderLeft:`${cfg.exBarWidth}px solid ${C.primary}`, textAlign:"left" }}>
                  <div style={{ fontSize:cfg.exJaSize, color:C.text, fontFamily:SF, fontWeight:700, lineHeight:1.38, overflowWrap:"anywhere" }}>
                    {smartBreak(ex.ja, "ja", cfg.exJaSize)}
                  </div>
                  {ex.cn && (
                    <div onClick={(e)=>{ e.stopPropagation(); setExampleTranslationMap(p => ({ ...p, [localIdx]: true })); }}
                      style={{ position:"relative", marginTop:4, cursor:translationRevealed?"default":"pointer", borderRadius:8, overflow:"hidden" }}>
                      <div style={{
                        fontSize:cfg.exCnSize,
                        color:C.muted,
                        lineHeight:1.38,
                        overflowWrap:"anywhere",
                        filter:translationRevealed ? "none" : `blur(${Math.max(5, Math.round(cfg.blurRadius * 0.85))}px)`,
                        opacity:translationRevealed ? 1 : 0.28,
                        transform:translationRevealed ? "scale(1)" : "scale(0.98)",
                        transition:"filter 0.35s ease, opacity 0.35s ease, transform 0.35s ease"
                      }}>
                        {smartBreak(ex.cn, "cn", cfg.exCnSize)}
                      </div>
                      {!translationRevealed && (
                        <div style={{
                          position:"absolute",
                          inset:-2,
                          display:"flex",
                          alignItems:"center",
                          justifyContent:"center",
                          background:"rgba(255,255,255,0.66)",
                          color:C.primary,
                          fontSize:Math.max(12, Math.round(cfg.exCnSize * 0.62)),
                          fontWeight:800,
                          letterSpacing:0,
                          userSelect:"none"
                        }}>
                          点击显示中文
                        </div>
                      )}
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        ) : (
        <>
        {hasImage && (
          <div style={{ flex:cfg.imgFlex, background:"rgba(0,0,0,0.02)",
            borderRadius:0, display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden", minHeight:0, position:"relative", zIndex:1 }}>
            <img src={w.imageUrl} alt=""
              style={{ width:"100%", height:"100%", objectFit:"contain", cursor: !quizPhase ? "zoom-in" : "default", transition:"transform 0.3s" }}
              onClick={(e) => {
                if (!quizPhase) {
                  e.stopPropagation();
                  setZoomedImage(w.imageUrl);
                }
              }}
              onError={e=>e.currentTarget.parentElement.style.display="none"}/>
            {quizPhase === "kana" && !isRevealed && (
              <div style={{ position:"absolute", inset:0, background:"#000000", display:"flex", alignItems:"center", justifyContent:"center", borderRadius:0, zIndex:2 }}>
                <span style={{ fontSize:48, color:"rgba(255,255,255,0.3)", fontWeight:700 }}>？</span>
              </div>
            )}
          </div>
        )}
        <div style={{ flex:1, minWidth:0, padding:cfg.textPadding, display:"flex", flexDirection:"column", justifyContent:"center", gap:effectiveCount===1?20:8, textAlign:noImageSingle?"center":"left", position:"relative", zIndex:3 }}>
          <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", width:"100%", textAlign:"center", position:"relative", zIndex:3, flexShrink:0 }}>
            
            {showMainCurve ? (
              <div style={{ transform:"scale(1.08)", transformOrigin:"center", margin:"10px 0" }}>
                <VisualAccentCurve kana={w.kana} accent={w.accent} fontSize={noImageSingle ? cfg.noImgKanjiSize : cfg.kanjiSize} />
              </div>
            ) : (
              <div style={{ width:"100%", fontSize:noImageSingle ? cfg.noImgKanjiSize : cfg.kanjiSize, fontWeight:700, fontFamily:SF, color:isQuizCard&&!isRevealed&&quizPhase==="reverse"?C.border:C.text, lineHeight:1.12, overflowWrap:"anywhere", textAlign:"center", borderBottom:isQuizCard&&!isRevealed&&quizPhase==="reverse"?`2px dashed ${C.border}`:"none", display:"block" }}>{mainText}</div>
            )}

            {subText && (
              showSubCurve ? (
                <div style={{ marginTop:8, transform:"scale(1.02)", transformOrigin:"center" }}>
                  <VisualAccentCurve kana={w.kana} accent={w.accent} fontSize={cfg.kanaSize} />
                </div>
              ) : (
                <div style={{ width:"100%", fontSize:(quizPhase==="kana" || (quizPhase==="reverse" && !isRevealed)) ? cfg.kanjiSize : cfg.kanaSize, color:isQuizCard&&!isRevealed?C.border:C.muted, marginTop:4, fontFamily:SF, overflowWrap:"anywhere", textAlign:"center", borderBottom:isQuizCard&&!isRevealed?`2px dashed ${C.border}`:"none", display:"block" }}>{subText}</div>
              )
            )}

            {showTags && <div style={{ display:"flex", gap:8, marginTop:12, alignItems:"center", justifyContent:"center", flexWrap:"wrap" }}>
              {(!w.accent || showMainCurve || showSubCurve) ? null : (
                <span style={{ padding:cfg.tagPadding, borderRadius:cfg.tagRadius, background:C.primaryLight, color:C.primary, fontSize:cfg.tagSize, fontWeight:600 }}>声调 {w.accent}</span>
              )}
              <span style={{ padding:cfg.tagPadding, borderRadius:cfg.tagRadius, background:C.greenLight, color:C.green, fontSize:cfg.tagSize, fontWeight:600 }}>{w.pos}</span>
            </div>}
          </div>

          {showMeaningBlock && (
            <div style={{
              flex: 0,
              display: "flex",
              flexDirection: "column",
              justifyContent: "center",
              textAlign: "center",
              filter: meaningRevealed ? "none" : `blur(${cfg.blurRadius}px)`,
              opacity: meaningRevealed ? 1 : 0.15,
              transform: meaningRevealed ? "scale(1)" : "scale(0.96)",
              letterSpacing: meaningRevealed ? "normal" : "4px",
              transition: "filter 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), transform 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), letter-spacing 0.55s cubic-bezier(0.25, 0.8, 0.25, 1)"
            }}>
              <div style={{ fontSize:cfg.meaningSize, fontWeight:700, color:C.primary, lineHeight:1.22, overflowWrap:"anywhere", textAlign:"center" }}>{smartBreak(w.meaning, "cn", cfg.meaningSize)}</div>
              {cfg.showUsage && w.usage && (quizPhase !== "kana" || isRevealed) && <div style={{ fontSize:cfg.usageSize, color:C.muted, marginTop:6, lineHeight:1.35, textAlign:"center" }}>💡 {smartBreak(w.usage, "cn", cfg.usageSize)}</div>}
              {!isQuizCard && examples.length > 0 && meaningRevealed && (
                <button onClick={(e)=>{ e.stopPropagation(); setShowExamplesMap(p => ({ ...p, [localIdx]: true })); setFlippedCardMap(p => ({ ...p, [localIdx]: true })); setExampleTranslationMap(p => ({ ...p, [localIdx]: false })); }}
                  style={{ alignSelf:"center", marginTop:8, padding:effectiveCount===1?"7px 18px":"5px 16px", borderRadius:20, border:"none", background:C.primary, color:"#fff", fontSize:Math.max(13, cfg.tagSize), fontWeight:800, cursor:"pointer", boxShadow:"0 3px 12px rgba(200,64,45,0.2)" }}>
                  📖 例句
                </button>
              )}
            </div>
          )}

          <div style={{ maxHeight:"35%", overflow:"auto", display:"flex", justifyContent:"center" }}>
            {isQuizCard && showExamplesBlock && cfg.showExamples && examples.length > 0 && (
              <div style={{
                width: "fit-content",
                maxWidth: "100%",
                filter: examplesRevealed ? "none" : `blur(${cfg.blurRadius}px)`,
                opacity: examplesRevealed ? 1 : 0.15,
                transform: examplesRevealed ? "scale(1)" : "scale(0.96)",
                letterSpacing: examplesRevealed ? "normal" : "3px",
                transition: "filter 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), transform 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), letter-spacing 0.55s cubic-bezier(0.25, 0.8, 0.25, 1)"
              }}>
                {examples.map((ex,i) => (
                  <div key={i} style={{ marginBottom:6, paddingLeft:8, borderLeft:`${cfg.exBarWidth}px solid ${C.primary}`, textAlign:"left" }}>
                    <div style={{ fontSize:cfg.exJaSize, color:C.text, fontFamily:SF, lineHeight:1.35 }}>{smartBreak(ex.ja, "ja", cfg.exJaSize)}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
        </>
        )}

        {isQuizCard && status === "correct" && <div style={{ position:"absolute", right:12, bottom:12, width:28, height:28, borderRadius:"50%", background:C.greenLight, color:C.green, fontSize:16, fontWeight:800, display:"flex", alignItems:"center", justifyContent:"center", zIndex:8 }}>✓</div>}
        {isQuizCard && status === "wrong" && <div style={{ position:"absolute", right:12, bottom:12, width:28, height:28, borderRadius:"50%", background:"rgba(209,67,67,0.1)", color:C.wrong, fontSize:16, fontWeight:800, display:"flex", alignItems:"center", justifyContent:"center", zIndex:8 }}>✗</div>}
        {isQuizCard && revealedCard === localIdx && (
          <div style={{ position:"absolute", bottom:12, left:"50%", transform:"translateX(-50%)", display:"flex", gap:10, zIndex:10 }}>
            <button onClick={(e)=>{ e.stopPropagation(); markCard(localIdx, "correct"); }}
              style={{ padding:"6px 20px", borderRadius:20, background:C.greenLight, border:`1.5px solid rgba(58,125,92,0.3)`, color:C.green, fontSize:14, fontWeight:700, cursor:"pointer" }}>✓ 正确</button>
            <button onClick={(e)=>{ e.stopPropagation(); markCard(localIdx, "wrong"); }}
              style={{ padding:"6px 20px", borderRadius:20, background:"rgba(209,67,67,0.08)", border:`1.5px solid rgba(209,67,67,0.2)`, color:C.wrong, fontSize:14, fontWeight:700, cursor:"pointer" }}>✗ 错误</button>
          </div>
        )}
      </div>
    );
  };
  const startQuiz = () => {
    setShowMeaningMap(Object.fromEntries(pageWords.map((_, i) => [i, true])));
    setShowExamplesMap(Object.fromEntries(pageWords.map((w, i) => [i, (w.examples || []).some(e => e.ja)])));
    restartQuiz();
  };
  const renderStageBar = () => {
    const phases = [
      { key:"countdown", label:"限时记忆" },
      { key:"kana", label:"假名速认" },
      { key:"reverse", label:"看中文说单词" },
    ];
    const activeIdx = quizPhase === "result" ? 3 : Math.max(0, phases.findIndex(p => p.key === quizPhase));
    return (
      <div style={{ height:32, flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center", position:"relative", borderTop:`1px solid ${C.borderLight}`, background:C.card }}>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          {phases.map((p, i) => {
            const done = activeIdx >= i;
            return (
              <React.Fragment key={p.key}>
                {i > 0 && <div style={{ width:70, height:2, background:activeIdx >= i ? C.primary : C.borderLight }} />}
                <div style={{ display:"flex", alignItems:"center", gap:6, color:done?C.primary:C.muted, fontSize:13, fontWeight:done?700:500 }}>
                  <span style={{ fontSize:14 }}>{done ? "●" : "○"}</span>{p.label}
                </div>
              </React.Fragment>
            );
          })}
        </div>
        <button onClick={resetQuizState} style={{ position:"absolute", right:16, top:4, height:24, padding:"0 10px", borderRadius:12, border:`1px solid ${C.border}`, background:C.bg, color:C.muted, fontSize:12, fontWeight:700, cursor:"pointer" }}>✕ 退出</button>
      </div>
    );
  };
  const renderResult = () => (
    <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:24, padding:40 }}>
      <div style={{ fontSize:28, fontWeight:700, color:C.text }}>📊 背记结果</div>
      <div style={{ display:"flex", gap:40, alignItems:"center" }}>

        </div>

/* ===== PRACTICE: FLASHCARD ===== */
function FlashcardPractice({ words, onBack }) {
  const [deck, setDeck] = useState(() => shuffle(words));
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [known, setKnown] = useState(0);
  const reset = () => { setDeck(shuffle(words)); setIdx(0); setFlipped(false); setKnown(0); };

  if (idx >= deck.length) return (
    <div className="fade-in" style={{ textAlign:"center", padding:40, color:C.text }}>
      <div style={{ fontSize:48, marginBottom:16 }}>🎉</div>
      <div style={{ fontSize:26, fontWeight:700, marginBottom:8 }}>练习完成！</div>
      <div style={{ fontSize:16, color:C.muted, marginBottom:28 }}>已掌握 {known} / {deck.length} 个单词</div>
      <div style={{ width:200, height:8, background:C.borderLight, borderRadius:4, margin:"0 auto 24px" }}>
        <div style={{ width:`${(known/deck.length)*100}%`, height:8, background: known===deck.length?C.green:C.primary, borderRadius:4, transition:"width 0.5s" }}/>
      </div>
      <div style={{ display:"flex", gap:12, justifyContent:"center" }}>
        <button onClick={reset} style={sBtn(C.primary, "#fff", {fontWeight:700})}>🔄 再来一次</button>
        <button onClick={onBack} style={sBtn(C.bg, C.text, {border:`1px solid ${C.border}`})}>返回</button>
      </div>
    </div>
  );

  const w = deck[idx];
  const next = (ok) => { if(ok) setKnown(k=>k+1); setFlipped(false); setTimeout(()=>setIdx(i=>i+1), 120); };

  return (
    <div style={{ flex:1, minHeight:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"20px 36px" }}>
      <div style={{ color:C.muted, fontSize:14, marginBottom:22 }}>闪卡记忆　{idx+1} / {deck.length}</div>
      <div onClick={()=>setFlipped(!flipped)} className={flipped?"fade-in":""}
        style={{ width:"min(500px,88vw)", maxHeight:"min(420px, 55vh)", background:C.card, borderRadius:22, padding:28, cursor:"pointer",
          display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", textAlign:"center",
          border:`1.5px solid ${flipped?"rgba(200,64,45,0.2)":C.borderLight}`, boxShadow:"0 6px 24px rgba(0,0,0,0.06)", transition:"border-color 0.3s", position:"relative" }}>
        {!flipped ? (
          <>
            <div style={{ fontSize:48, fontWeight:700, fontFamily:SF, color:C.text }}>{w.kanji || w.kana}</div>
            {w.kanji && <div style={{ fontSize:22, color:C.muted, marginTop:8, fontFamily:SF }}>{w.kana}</div>}
            <div style={{ position:"absolute", bottom:18, color:C.hint, fontSize:12 }}>👆 点击翻面查看释义</div>
          </>
        ) : (
          <>
            {w.imageUrl && (
              <div style={{ width:130, maxHeight:"min(80px, 10vh)", background:"rgba(255,255,255,0.03)", borderRadius:12, marginBottom:14, display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden" }}>
                <img src={w.imageUrl} alt="" style={{ width:"100%", maxHeight:"min(80px, 10vh)", objectFit:"contain", borderRadius:12 }} onError={e=>e.currentTarget.parentElement.style.display="none"}/>
              </div>
            )}
            <div style={{ fontSize:"clamp(22px, 3.5vh, 30px)", fontWeight:700, color:C.primary, marginBottom:6 }}>{w.meaning}</div>
            <div style={{ fontSize:14, color:C.muted }}>{w.pos}{w.accent?` · 声调 ${w.accent}`:""}</div>
            {w.examples.filter(e=>e.ja).length > 0 && (
              <div style={{ marginTop:16, fontSize:16, color:C.muted, fontFamily:SF, lineHeight:1.6 }}>{w.examples[0].ja}</div>
            )}

        <div className="slide-up" style={{ display:"flex", gap:14, marginTop:14 }}>
          <button onClick={()=>next(false)} style={{ padding:"10px 28px", background:"rgba(209,67,67,0.06)", color:C.wrong, border:`1.5px solid rgba(209,67,67,0.2)`, borderRadius:12, cursor:"pointer", fontSize:16, fontWeight:600, transition:"all 0.15s" }}
            onMouseEnter={e=>e.currentTarget.style.background="rgba(209,67,67,0.08)"} onMouseLeave={e=>e.currentTarget.style.background="rgba(209,67,67,0.06)"}>
            还没记住 😣
          </button>
          <button onClick={()=>next(true)} style={{ padding:"10px 28px", background:C.greenLight, color:C.green, border:`1.5px solid rgba(58,125,92,0.25)`, borderRadius:12, cursor:"pointer", fontSize:16, fontWeight:600, transition:"all 0.15s" }}

      )}
    </div>
  );
}

/* ===== PRACTICE: CHOICE ===== */
function ChoicePractice({ words, onBack }) {
  const [mode, setMode] = useState("ja2cn");
  const [questions, setQuestions] = useState([]);
  const [qi, setQi] = useState(0);
  const [sel, setSel] = useState(null);
  const [score, setScore] = useState(0);

  const generate = useCallback((m) => {
    return shuffle(words).map(w => {
      const pool = words.filter(x=>x.id!==w.id);
      const wrongs = shuffle(pool).slice(0, Math.min(3, pool.length));
      const opts = shuffle([
        { label: m==="cn2ja"?(w.kanji||w.kana):w.meaning, correct:true },
        ...wrongs.map(x => ({ label: m==="cn2ja"?(x.kanji||x.kana):x.meaning, correct:false }))
      ]);
      return { word:w, options:opts };
    });
  }, [words]);

  useEffect(() => { setQuestions(generate(mode)); setQi(0); setSel(null); setScore(0); }, [mode, generate]);

  if (!questions.length) return null;

  if (qi >= questions.length) return (
    <div className="fade-in" style={{ textAlign:"center", padding:40, color:C.text }}>
      <div style={{ fontSize:48, marginBottom:16 }}>{score>=questions.length*0.8?"🏆":score>=questions.length*0.5?"👍":"💪"}</div>
      <div style={{ fontSize:26, fontWeight:700, marginBottom:8 }}>得分：{score} / {questions.length}</div>
      <div style={{ fontSize:16, color:C.muted, marginBottom:28 }}>正确率 {Math.round(score/questions.length*100)}%</div>
      <div style={{ display:"flex", gap:12, justifyContent:"center" }}>
        <button onClick={()=>{setQuestions(generate(mode));setQi(0);setSel(null);setScore(0)}} style={sBtn(C.primary,"#fff",{fontWeight:700})}>🔄 再来一次</button>
        <button onClick={onBack} style={sBtn(C.bg,C.text,{border:`1px solid ${C.border}`})}>返回</button>
      </div>
    </div>
  );

  const q = questions[qi];
  const pick = (i) => {
    if (sel !== null) return;
    setSel(i);
    if (q.options[i].correct) setScore(s=>s+1);
    setTimeout(() => { setSel(null); setQi(qi+1); }, 1000);
  };

  return (
    <div style={{ flex:1, minHeight:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"16px 36px" }}>
      <div style={{ display:"flex", gap:8, marginBottom:10 }}>
        {[["ja2cn","日语 → 中文"],["cn2ja","中文 → 日语"]].map(([k,l])=>(
          <button key={k} onClick={()=>setMode(k)} style={{ padding:"7px 18px", borderRadius:8, border:`1.5px solid ${mode===k?"rgba(200,64,45,0.2)":C.border}`, background:mode===k?C.primaryLight:"transparent", color:mode===k?C.primary:C.muted, cursor:"pointer", fontSize:13, fontWeight:600, transition:"all 0.15s" }}>{l}</button>
        ))}
      </div>
      <div style={{ color:C.muted, fontSize:14, marginBottom:18 }}>选择题　{qi+1} / {questions.length}</div>
      <div className="fade-in" key={qi} style={{ background:C.card, borderRadius:22, padding:"22px 30px", width:"min(520px,88vw)", textAlign:"center", border:`1px solid ${C.borderLight}` }}>
        {mode==="ja2cn" && q.word.imageUrl && (
          <div style={{ width:170, maxHeight:"min(100px, 13vh)", background:"rgba(255,255,255,0.03)", borderRadius:14, margin:"0 auto 18px", display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden" }}>
            <img src={q.word.imageUrl} alt="" style={{ width:"100%", maxHeight:"min(100px, 13vh)", objectFit:"contain", borderRadius:14 }} onError={e=>e.currentTarget.parentElement.style.display="none"}/>
          </div>
        )}
        <div style={{ fontSize:"clamp(24px, 4vh, 36px)", fontWeight:700, fontFamily:SF, color:C.text, marginBottom:14 }}>{mode==="cn2ja"?q.word.meaning:(q.word.kanji||q.word.kana)}</div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
          {q.options.map((opt,i) => {
            let bg=C.bg, bdr=C.border, clr=C.text;
            if (sel !== null) {
              if (opt.correct) { bg="rgba(58,125,92,0.12)"; bdr="rgba(58,125,92,0.3)"; clr=C.green; }
              else if (i===sel && !opt.correct) { bg="rgba(209,67,67,0.08)"; bdr="rgba(209,67,67,0.2)"; clr=C.wrong; }
            }
            return (
              <button key={i} onClick={()=>pick(i)}
                style={{ padding:"10px 14px", background:bg, border:`1.5px solid ${bdr}`, borderRadius:12, cursor:sel!==null?"default":"pointer", color:clr, fontSize:15, fontWeight:500, fontFamily:mode==="cn2ja"?SF:"inherit", transition:"all 0.2s", animation:sel===i&&!q.options[i].correct?"shake 0.3s":"none" }}
                onMouseEnter={e=>{if(sel===null)e.currentTarget.style.background=C.borderLight}}
                onMouseLeave={e=>{if(sel===null)e.currentTarget.style.background=C.bg}}>
                {opt.label}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ===== PRACTICE: MATCH ===== */
function MatchPractice({ words, onBack }) {
  const [items, setItems] = useState(() => shuffle(words).slice(0, Math.min(6, words.length)));
  const [leftOrd] = useState(() => shuffle([...Array(Math.min(6,words.length)).keys()]));
  const [rightOrd] = useState(() => shuffle([...Array(Math.min(6,words.length)).keys()]));
  const [selL, setSelL] = useState(null);
  const [matched, setMatched] = useState(new Set());
  const [wrong, setWrong] = useState(null);
  const [done, setDone] = useState(false);

  const clickL = (i) => { if(matched.has(i)) return; setSelL(i); setWrong(null); };
  const clickR = (i) => {
    if (selL===null || matched.has(i)) return;
    if (selL === i) {
      const nm = new Set([...matched, i]);
      setMatched(nm); setSelL(null);
      if (nm.size === items.length) setTimeout(()=>setDone(true), 350);
    } else {
      setWrong(i);
      setTimeout(() => { setWrong(null); setSelL(null); }, 550);
    }
  };
  const reset = () => {
    const ni = shuffle(words).slice(0,Math.min(6,words.length));
    setItems(ni); setMatched(new Set()); setSelL(null); setWrong(null); setDone(false);
  };

  if (done) return (
    <div className="fade-in" style={{ textAlign:"center", padding:40, color:C.text }}>
      <div style={{ fontSize:48, marginBottom:16 }}>✨</div>
      <div style={{ fontSize:26, fontWeight:700, marginBottom:24 }}>全部配对成功！</div>
      <div style={{ display:"flex", gap:12, justifyContent:"center" }}>
        <button onClick={reset} style={sBtn(C.primary,"#fff",{fontWeight:700})}>🔄 再来一次</button>
        <button onClick={onBack} style={sBtn(C.bg,C.text,{border:`1px solid ${C.border}`})}>返回</button>
      </div>
    </div>
  );

  return (
    <div style={{ flex:1, minHeight:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"16px 36px" }}>
      <div style={{ color:C.muted, fontSize:14, marginBottom:22 }}>配对连线　已完成 {matched.size} / {items.length}</div>
      <div style={{ display:"flex", gap:44, width:"min(640px,92vw)", justifyContent:"center" }}>
        <div style={{ flex:1, display:"flex", flexDirection:"column", gap:7 }}>
          <div style={{ fontSize:12, color:C.hint, fontWeight:600, textAlign:"center", marginBottom:4 }}>日本語</div>
          {leftOrd.map(i => {
            const w=items[i]; const m=matched.has(i); const s=selL===i;
            return (
              <button key={i} onClick={()=>clickL(i)} disabled={m}
                style={{ padding:"10px 14px", background:m?C.greenLight:s?C.primaryLight:C.bg,
                  border:`1.5px solid ${m?"rgba(58,125,92,0.25)":s?"rgba(200,64,45,0.3)":C.border}`,
                  borderRadius:12, cursor:m?"default":"pointer", fontSize:17, fontFamily:SF,
                  color:m?C.green:s?C.primary:C.text, transition:"all 0.2s", opacity:m?0.6:1 }}>
                {w.kanji||w.kana}
              </button>
            );
          })}
        </div>
        <div style={{ flex:1, display:"flex", flexDirection:"column", gap:7 }}>
          <div style={{ fontSize:12, color:C.hint, fontWeight:600, textAlign:"center", marginBottom:4 }}>中 文</div>
          {rightOrd.map(i => {
            const w=items[i]; const m=matched.has(i); const isW=wrong===i;
            return (
              <button key={i} onClick={()=>clickR(i)} disabled={m}
                style={{ padding:"10px 14px", background:m?C.greenLight:isW?"rgba(209,67,67,0.08)":C.bg,
                  border:`1.5px solid ${m?"rgba(58,125,92,0.25)":isW?"rgba(209,67,67,0.2)":C.border}`,
                  borderRadius:12, cursor:m?"default":"pointer", fontSize:15, fontWeight:500,
                  color:m?C.green:isW?C.wrong:C.text, transition:"all 0.2s", opacity:m?0.6:1,
                  animation:isW?"shake 0.35s":"none" }}>
                {w.meaning}
              </button>
            );
          })}
        </div>
      </div>
      <div style={{ color:C.hint, fontSize:12, marginTop:10 }}>提示：先点击左侧日语，再点击右侧对应中文释义</div>
    </div>
  );
}

              style={{ width:170, padding:"22px 18px", background:C.card, border:`1.5px solid ${C.borderLight}`, borderRadius:18, cursor:"pointer", textAlign:"center", transition:"all 0.25s" }}
              onMouseEnter={e=>{e.currentTarget.style.borderColor="rgba(200,64,45,0.25)";e.currentTarget.style.transform="translateY(-5px)";e.currentTarget.style.boxShadow="0 8px 24px rgba(0,0,0,0.08)";}}

        <button onClick={()=>setType(null)} style={{ background:C.bg, border:`1px solid ${C.border}`, borderRadius:8, padding:"7px 16px", cursor:"pointer", color:C.muted, fontSize:13, transition:"all 0.15s" }}
          onMouseEnter={e=>e.currentTarget.style.background=C.borderLight} onMouseLeave={e=>e.currentTarget.style.background=C.bg}>
          ← 选择其他练习
        </button>
      </div>
      {type==="flash" && <FlashcardPractice {...pp}/>}
