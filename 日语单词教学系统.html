  const [showUsageMap, setShowUsageMap] = useState({});
  const [showExamplesMap, setShowExamplesMap] = useState({});
  const [flippedCardMap, setFlippedCardMap] = useState({});
  const [exampleTranslationMap, setExampleTranslationMap] = useState({});
  const [zoomedImage, setZoomedImage] = useState(null);
  const [quizPhase, setQuizPhase] = useState(null);
  const [countdownTotal, setCountdownTotal] = useState(60);
  const [countdownLeft, setCountdownLeft] = useState(0);
  const [selectedCard, setSelectedCard] = useState(null);
  const [cardStatus, setCardStatus] = useState({});
  const [quizWords, setQuizWords] = useState([]);
  const [isPaused, setIsPaused] = useState(false);
  const [showShortcutHelp, setShowShortcutHelp] = useState(false);

  // Selected word in normal teaching mode to keep track of user focus when switching view layouts
  const [selectedWordId, setSelectedWordId] = useState(null);

  // Paint Tool States
  const [paintActive, setPaintActive] = useState(false);
  const [paintColor, setPaintColor] = useState("#FF3B30");
  const [paintThickness, setPaintThickness] = useState(1);
  const [paintTool, setPaintTool] = useState("pen");
  const [strokesRegistry, setStrokesRegistry] = useState({});

  const clearCurrentPageStrokes = () => {
    if (!currentWords.length) return;
    setStrokesRegistry(prev => {
      const next = { ...prev };
      currentWords.forEach(w => {
        next[w.id] = { front: [], back: [] };
      });
      return next;
    });
  };

  const clearAllStrokes = () => {
    if (!window.confirm("确定清除所有单词卡片的笔迹标注吗？")) return;
    setStrokesRegistry({});
  };

  // Guard refs to prevent race conditions during 3D flip card animations
  const isFlippingRef = useRef(false);
  const lastClickedBtnRef = useRef(false);
  const lastShortcutAtRef = useRef(0);
  const countdownTimerRef = useRef(null);
  const restoreHiddenWords = useCallback(() => {
    if (!group || hiddenCount === 0) return;
    setGroups(groups.map(g => g.id === group.id ? { ...g, words:(g.words || []).map(w => w.hidden ? { ...w, hidden:false } : w) } : g));
    setPage(0);
    setShowMeaningMap({});
    setShowUsageMap({});
    setShowExamplesMap({});
    setFlippedCardMap({});
    setExampleTranslationMap({});
  }, [group, groups, hiddenCount, setGroups]);

  const CELL_CONFIG = {
    1: { cols:1, rows:1, imgFlex:"0 0 50%", textPadding:"48px 56px", backPadding:"24px 36px", textLineWidth:848, showImg:true, showUsage:true, showExamples:true, kanjiSize:72, noImgKanjiSize:84, kanaSize:52, meaningSize:56, tagSize:18, tagPadding:"6px 18px", tagRadius:24, usageSize:28, exJaSize:54, exCnSize:40, maxExamples:3, exBarWidth:5, blurRadius:10 },
    4: { cols:2, rows:2, imgFlex:"0 0 50%", textPadding:"12px 16px", backPadding:"14px 20px", textLineWidth:432, showImg:true, showUsage:true, showExamples:true, kanjiSize:44, kanaSize:32, meaningSize:34, tagSize:14, tagPadding:"4px 13px", tagRadius:20, usageSize:20, exJaSize:34, exCnSize:26, maxExamples:3, exBarWidth:3, blurRadius:7 },
    6: { cols:3, rows:2, imgFlex:"0 0 50%", textPadding:"8px 10px", backPadding:"8px 10px", textLineWidth:284, showImg:true, showUsage:true, showExamples:true, kanjiSize:32, kanaSize:24, meaningSize:26, tagSize:13, tagPadding:"3px 9px", tagRadius:16, usageSize:17, exJaSize:30, exCnSize:24, maxExamples:3, exBarWidth:3, blurRadius:6 },
  };
  const countOptions = [
    { label:"大", count:1, desc:"单词大图展示" },
    { label:"中", count:4, desc:"2×2 四宫格" },
    { label:"小", count:6, desc:"2×3 六宫格" },
  ];
  const getDefaultCount = (len) => len >= 4 ? 4 : 1;
  const requestedCount = ((cardCount === 4 && words.length < 4) || (cardCount === 6 && words.length < 6)) ? getDefaultCount(words.length) : cardCount;
  const effectiveCount = CELL_CONFIG[requestedCount] ? requestedCount : getDefaultCount(words.length);
  const totalPages = Math.max(1, Math.ceil((words.length || 1) / effectiveCount));
  const safePage = Math.min(page, totalPages - 1);
  const pageWords = words.slice(safePage * effectiveCount, safePage * effectiveCount + effectiveCount);
  const quizActive = ["kana","reverse","result"].includes(quizPhase) && quizWords.length > 0;
  const currentWords = quizActive ? quizWords : pageWords;
  const cfg = CELL_CONFIG[effectiveCount] || CELL_CONFIG[4];
  const gridColumns = cfg.cols;
  const gridRows = cfg.rows;
  const getCellPosition = (i) => {
    const cols = gridColumns;
    return { col:(i % cols) + 1, span:1, row:Math.floor(i / cols) + 1, cols, rows:gridRows };
  };
  const pct = ((safePage + 1) / totalPages) * 100;
  const pageHasExamples = currentWords.some(w => (w.examples || []).some(e => e.ja));
  const allMeaningShown = currentWords.length > 0 && currentWords.every((w) => !(w.meaning || (cfg.showUsage && w.usage)) || showMeaningMap[w.id]);
  const allExamplesShown = !cfg.showExamples || !pageHasExamples || currentWords.every((w) => !(w.examples || []).some(e => e.ja) || showExamplesMap[w.id]);
  const revealLabel = !allMeaningShown ? "👁 揭示释义" : (cfg.showExamples && !allExamplesShown ? "📖 揭示例句" : "✓ 已全部揭示");

  useEffect(() => {
    if (onTeachStateChange) {
      onTeachStateChange({
        page: safePage,
        totalPages,
        quizPhase,
        effectiveCount,
        pct,
        countdownLeft,
        countdownTotal,
        wordsCount: words.length,
        hiddenCount,
        restoreHiddenWords,
        allMeaningShown,
        chalkboardMode,
        showShortcutHelp,
        isPaused,
        currentWords,
        selectedCard,
        cardStatus,
        setChalkboardMode,
        goPage,
        chooseCount,
        revealMeaningsForCurrentPage,
        startQuiz,
        resetQuizState,
        restartQuiz,
        enterKanaPhase,
        enterReversePhase,
        enterResultPhase,
        pickRandomCard,
        setIsPaused,
        setShowShortcutHelp,

        // Paint Tools
        paintActive,
        setPaintActive,
        paintColor,
        setPaintColor,
        paintThickness,
        setPaintThickness,
        paintTool,
        setPaintTool,
        clearCurrentPageStrokes,
        clearAllStrokes,
      });
    }
  }, [
    safePage, totalPages, quizPhase, effectiveCount, pct, countdownLeft, countdownTotal, words.length, hiddenCount, restoreHiddenWords, allMeaningShown, chalkboardMode, showShortcutHelp, isPaused, currentWords, selectedCard, cardStatus, enterKanaPhase,
    paintActive, paintColor, paintThickness, paintTool, strokesRegistry
  ]);
  const countdownRatio = countdownTotal ? countdownLeft / countdownTotal : 0;
  const countdownColor = countdownRatio > 0.5 ? C.green : countdownRatio > 0.2 ? "#E8A040" : C.primary;
  const wordExamples = (word) => (word?.examples || []).filter(e => e.ja || e.cn).slice(0, cfg.maxExamples);
  const hasMeaningContent = (word) => !!(word?.meaning && String(word.meaning).trim());
  const hasUsageContent = (word) => !!(cfg.showUsage && word?.usage && String(word.usage).trim());
  const hasFrontRevealContent = (word) => hasMeaningContent(word) || hasUsageContent(word);
  const getTranslationKey = (wordId, exampleIdx) => `${wordId}-${exampleIdx}`;
  const buildFullRevealState = (targetWords) => {
    const meanings = {};
    const usages = {};
    const examplesMap = {};
    const flipped = {};
    const translations = {};

    targetWords.forEach((word) => {
      const examples = wordExamples(word);
      if (hasFrontRevealContent(word)) {
        meanings[word.id] = true;
        usages[word.id] = true;
      }
      if (examples.length > 0) {
        examplesMap[word.id] = true;
        flipped[word.id] = true;
      }
      examples.forEach((example, exampleIdx) => {
        if (example.cn) translations[getTranslationKey(word.id, exampleIdx)] = true;
      });
    });

    return { meanings, usages, examplesMap, flipped, translations };
  };
  const revealWordsFully = (targetWords) => {
    const state = buildFullRevealState(targetWords);
    setShowMeaningMap(prev => ({ ...prev, ...state.meanings }));
    setShowUsageMap(prev => ({ ...prev, ...state.usages }));
    setShowExamplesMap(prev => ({ ...prev, ...state.examplesMap }));
    setFlippedCardMap(prev => ({ ...prev, ...state.flipped }));
    setExampleTranslationMap(prev => ({ ...prev, ...state.translations }));
  };
  const pageHasExampleCards = currentWords.some(w => wordExamples(w).length > 0);
  const pageHasTranslations = currentWords.some(w => wordExamples(w).some(e => e.cn));
  const allExampleCardsFlipped = pageHasExampleCards && currentWords.every((w) => wordExamples(w).length === 0 || flippedCardMap[w.id]);
  const allTranslationsShown = pageHasTranslations && currentWords.every((w) =>
    wordExamples(w).every((ex, exIdx) => !ex.cn || exampleTranslationMap[`${w.id}-${exIdx}`])
  );
  const revealLayer = !allMeaningShown ? 0
    : pageHasExampleCards && !allExampleCardsFlipped ? 1
    : pageHasTranslations && !allTranslationsShown ? 2
    : pageHasTranslations ? 3
    : pageHasExampleCards ? 2
    : 1;

  const revealMeaningsForCurrentPage = () => {
    const frontState = Object.fromEntries(currentWords.map((w) => [w.id, hasFrontRevealContent(w)]));
    setShowMeaningMap(prev => ({ ...prev, ...frontState }));
    setShowUsageMap(prev => ({ ...prev, ...frontState }));
  };
  const progressiveForward = () => {
    if (!currentWords.length) return;
    for (let cardIdx = 0; cardIdx < currentWords.length; cardIdx += 1) {
      const word = currentWords[cardIdx];
      const examples = wordExamples(word);

      if (hasFrontRevealContent(word) && !showMeaningMap[word.id]) {
        setShowMeaningMap(prev => ({ ...prev, [word.id]: true }));
        setShowUsageMap(prev => ({ ...prev, [word.id]: true }));
        setSelectedWordId(word.id);
        return;
      }

      if (examples.length > 0 && !flippedCardMap[word.id]) {
        setShowExamplesMap(prev => ({ ...prev, [word.id]: true }));
        setFlippedCardMap(prev => ({ ...prev, [word.id]: true }));
        setSelectedWordId(word.id);
        setExampleTranslationMap(prev => {
          const next = { ...prev };
          examples.forEach((_, exampleIdx) => delete next[getTranslationKey(word.id, exampleIdx)]);
          return next;
        });
        return;
      }

      for (let exampleIdx = 0; exampleIdx < examples.length; exampleIdx += 1) {
        const example = examples[exampleIdx];
        const key = getTranslationKey(word.id, exampleIdx);
        if (example.cn && !exampleTranslationMap[key]) {
          setExampleTranslationMap(prev => ({ ...prev, [key]: true }));
          setSelectedWordId(word.id);
          return;
        }
      }
    }

    if (safePage < totalPages - 1) goPage(safePage + 1);
  };
  const progressiveBackward = () => {
    if (!currentWords.length) return;
    for (let cardIdx = currentWords.length - 1; cardIdx >= 0; cardIdx -= 1) {
      const word = currentWords[cardIdx];
      const examples = wordExamples(word);

      for (let exampleIdx = examples.length - 1; exampleIdx >= 0; exampleIdx -= 1) {
        const example = examples[exampleIdx];
        const key = getTranslationKey(word.id, exampleIdx);
        if (example.cn && exampleTranslationMap[key]) {
          setExampleTranslationMap(prev => {
            const next = { ...prev };
            delete next[key];
            return next;
          });
          setSelectedWordId(word.id);
          return;
        }
      }

      if (examples.length > 0 && flippedCardMap[word.id]) {
        setFlippedCardMap(prev => {
          const next = { ...prev };
          delete next[word.id];
          return next;
        });
        setShowExamplesMap(prev => {
          const next = { ...prev };
          delete next[word.id];
          return next;
        });
        setExampleTranslationMap(prev => {
          const next = { ...prev };
          examples.forEach((_, exampleIdx) => delete next[getTranslationKey(word.id, exampleIdx)]);
          return next;
        });
        setSelectedWordId(word.id);
        return;
      }

      if (hasFrontRevealContent(word) && showMeaningMap[word.id]) {
        setShowMeaningMap(prev => {
          const next = { ...prev };
          delete next[word.id];
          return next;
        });
        setShowUsageMap(prev => {
          const next = { ...prev };
          delete next[word.id];
          return next;
        });
        setSelectedWordId(word.id);
        return;
      }
    }

    if (safePage > 0) {
      const prevPage = safePage - 1;
      const prevWords = words.slice(prevPage * effectiveCount, prevPage * effectiveCount + effectiveCount);
      resetQuizState();
      setPage(prevPage);
      revealWordsFully(prevWords);
    }
  };

  const resetReveal = () => { setShowMeaningMap({}); setShowUsageMap({}); setShowExamplesMap({}); setFlippedCardMap({}); setExampleTranslationMap({}); };
  const clearCountdownTimer = () => {
    if (countdownTimerRef.current) {
      clearInterval(countdownTimerRef.current);
      countdownTimerRef.current = null;
    }
  };
  const resetQuizState = () => {
    clearCountdownTimer();
    setQuizPhase(null);
    setCountdownLeft(0);
    setSelectedCard(null);
    setCardStatus({});
    setQuizWords([]);
  };
  const goPage = (n) => {
    setPage(Math.max(0, Math.min(n, totalPages - 1)));
    resetReveal();
    resetQuizState();
  };
  const smartBreak = (text, lang, fontSize) => {
    if (!text) return text;
    return String(text);
  };
  const chooseCount = (n) => {
    if (![1,4,6].includes(n)) return;
    if ((n === 4 && words.length < 4) || (n === 6 && words.length < 6)) return;
    resetQuizState();
    setCardCount(n);
    
    // Find the index of the currently selected card/word to keep it visible
    let targetWordIndex = safePage * effectiveCount;
    if (selectedWordId) {
      const foundIdx = words.findIndex(w => w.id === selectedWordId);
      if (foundIdx !== -1) {
        targetWordIndex = foundIdx;
      }
    }
    const newPage = Math.floor(targetWordIndex / n);
    setPage(newPage);
  };
  const startCountdown = (seconds) => {
    clearCountdownTimer();
    setCountdownTotal(seconds);
    setCountdownLeft(seconds);
    countdownTimerRef.current = setInterval(() => {
      setCountdownLeft(prev => {
        if (prev <= 1) {
          clearCountdownTimer();
          enterKanaPhase();
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
  };
  const enterKanaPhase = useCallback(() => {
    clearCountdownTimer();
    const nextQuizWords = shuffle(pageWords);
    setQuizWords(nextQuizWords);
    setQuizPhase("kana");
    setCardStatus(Object.fromEntries(nextQuizWords.map((_, i) => [i, "pending"])));
    setSelectedCard(null);
  }, [pageWords]);
  const enterReversePhase = () => {
    setQuizPhase("reverse");
    setCardStatus(Object.fromEntries((quizWords.length ? quizWords : currentWords).map((_, i) => [i, "pending"])));
    setSelectedCard(null);
  };
  const enterResultPhase = () => {
    setQuizPhase("result");
    setSelectedCard(null);
  };
  const restartQuiz = () => startQuiz();
  const exitAndNextPage = () => {
    resetQuizState();
    if (safePage < totalPages - 1) goPage(safePage + 1);
  };
  const pickRandomCard = () => {
    const pending = currentWords.map((_, i) => i).filter(i => cardStatus[i] === "pending");
    if (pending.length === 0) return;
    setSelectedCard(pending[Math.floor(Math.random() * pending.length)]);
  };
  const revealQuizCard = (i) => {
    if (!["kana","reverse"].includes(quizPhase) || cardStatus[i] !== "pending") return;
    setCardStatus(prev => ({ ...prev, [i]: "revealed" }));
    setSelectedCard(null);
  };
  const revealSelectedOrPick = () => {
    if (!["kana","reverse"].includes(quizPhase)) return;
    if (selectedCard !== null && cardStatus[selectedCard] === "pending") {
      revealQuizCard(selectedCard);
      return;
    }
    pickRandomCard();
  };
  const handleCardClick = (i) => {
    // 1. Practice/Quiz Mode logic
    if (quizPhase) {
      if (!["kana","reverse"].includes(quizPhase) || cardStatus[i] !== "pending") return;
      revealQuizCard(i);
      return;
    }

    // Set the selected word ID in normal teaching mode
    const clickedWord = currentWords[i];
    if (clickedWord) {
      setSelectedWordId(clickedWord.id);
    }

    // 2. Prevent fast clicks/transition overlap
    if (isFlippingRef.current) return;
    
    // 3. Skip if button's own click has set the guard ref
    if (lastClickedBtnRef.current) {
      lastClickedBtnRef.current = false;
      return;
    }

    // 4. Back-side click: blank areas flip the card back to front; text areas stop propagation.
    const wId = clickedWord.id;
    if (flippedCardMap[wId]) {
      isFlippingRef.current = true;
      setFlippedCardMap(p => ({ ...p, [wId]: false }));
      setExampleTranslationMap(p => {
        const next = { ...p };
        // Clean translations
        Object.keys(next).forEach(key => { if (key.startsWith(`${wId}-`)) delete next[key]; });
        return next;
      });
      setTimeout(() => { isFlippingRef.current = false; }, 680);
      return;
    }

    // 5. Front-side click: toggle meaning display
    const isMeaningShown = !!showMeaningMap[wId];
    if (!isMeaningShown) {
      setShowMeaningMap(p => ({ ...p, [wId]: true }));
      setShowUsageMap(p => ({ ...p, [wId]: true }));
    } else {
      setShowMeaningMap(p => { const next = { ...p }; delete next[wId]; return next; });
      setShowUsageMap(p => { const next = { ...p }; delete next[wId]; return next; });
      setShowExamplesMap(p => { const next = { ...p }; delete next[wId]; return next; });
    }
  };
  const revealAll = useCallback(() => {
    if (!currentWords.length) return;
    if (!currentWords.every((w) => !hasFrontRevealContent(w) || showMeaningMap[w.id])) {
      const frontState = Object.fromEntries(currentWords.map((w) => [w.id, hasFrontRevealContent(w)]));
      setShowMeaningMap(prev => ({ ...prev, ...frontState }));
      setShowUsageMap(prev => ({ ...prev, ...frontState }));
      return;
    }
    if (cfg.showExamples && currentWords.some((w) => (w.examples || []).some(e => e.ja) && !showExamplesMap[w.id])) {
      const exState = Object.fromEntries(currentWords.map((w) => [w.id, (w.examples || []).some(e => e.ja)]));
      setShowExamplesMap(prev => ({ ...prev, ...exState }));
      setFlippedCardMap(prev => ({ ...prev, ...exState }));
      setExampleTranslationMap({});
    }
  }, [currentWords, showMeaningMap, showExamplesMap, cfg.showExamples]);

  useEffect(() => { setPage(0); setCardCount(getDefaultCount(words.length)); resetReveal(); setSelectedWordId(null); }, [curGid]);
  useEffect(() => {
    if (pageWords.length > 0) {
      const hasSelectedOnPage = pageWords.some(w => w.id === selectedWordId);
      if (!hasSelectedOnPage) {
        setSelectedWordId(pageWords[0].id);
      }
    } else {
      setSelectedWordId(null);
    }
  }, [safePage, effectiveCount, words, selectedWordId, pageWords]);


  useEffect(() => {
    if (words.length > 0 && ((cardCount === 4 && words.length < 4) || (cardCount === 6 && words.length < 6))) { setCardCount(getDefaultCount(words.length)); setPage(0); resetReveal(); }
    else if (page > totalPages - 1) { setPage(totalPages - 1); resetReveal(); }
  }, [words.length, cardCount, page, totalPages]);

  useEffect(() => {
    const isFormField = (el) => {
      if (!el) return false;
      const tag = el.tagName;
      return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || el.isContentEditable;
    };
    const preventKeys = new Set([" ", "PageDown", "PageUp", "ArrowLeft", "ArrowRight", "Home", "End", "F5"]);
    const h = (e) => {
      if (!words.length || shortcutsDisabled || isFormField(document.activeElement)) return;
      const key = e.key;
      const lower = key.toLowerCase();
      const shortcutKeys = new Set([" ", "PageDown", "PageUp", "ArrowLeft", "ArrowRight", "Home", "End", "1", "2", "3", "b", "B", ".", "?", "/", "Escape", "F5", "q", "Q", "r", "R", "Enter", "n", "N"]);
      if (!shortcutKeys.has(key) && !shortcutKeys.has(lower)) return;
      if (preventKeys.has(key) || ["b",".","?","/","q","r","n","1","2","3"].includes(lower) || key === "Escape" || key === "Enter") e.preventDefault();

      const now = Date.now();
      if (now - lastShortcutAtRef.current < 120) return;
      lastShortcutAtRef.current = now;

      if (key === "Escape") {
        if (showShortcutHelp) { setShowShortcutHelp(false); return; }
        if (isPaused) { setIsPaused(false); return; }
        if (quizPhase) { resetQuizState(); return; }
        if (zoomedImage) { setZoomedImage(null); return; }
        return;
      }
      if (zoomedImage) return;
      if (key === "?" || key === "/") { setShowShortcutHelp(v => !v); return; }
      if (showShortcutHelp) return;
      if (lower === "b" || key === ".") { setIsPaused(v => !v); return; }
      if (isPaused) return;

      const inQuiz = !!quizPhase;
      if (inQuiz) {
        if (key === "ArrowRight") { if (safePage < totalPages - 1) goPage(safePage + 1); return; }
        if (key === "ArrowLeft") { if (safePage > 0) goPage(safePage - 1); return; }
        const quizActions = {
          F5: () => {},
          q: () => {},
          r: () => { if (["kana", "reverse"].includes(quizPhase)) pickRandomCard(); },
          Enter: () => revealSelectedOrPick(),
          " ": () => revealSelectedOrPick(),
          pagedown: () => {},
          n: () => {
            if (quizPhase === "kana") enterReversePhase();
            else if (quizPhase === "reverse") enterResultPhase();
          },
        };
        const action = quizActions[key] || quizActions[lower];
        if (action) action();
        return;
      }

      const teachActions = {
        " ": () => progressiveForward(),
        PageDown: () => progressiveForward(),
        ArrowRight: () => progressiveForward(),
        PageUp: () => progressiveBackward(),
        ArrowLeft: () => progressiveBackward(),
        Home: () => goPage(0),
        End: () => goPage(totalPages - 1),
        "1": () => chooseCount(1),
        "2": () => chooseCount(4),
        "3": () => chooseCount(6),
        F5: () => startQuiz(),
        q: () => startQuiz(),
      };
      const action = teachActions[key] || teachActions[lower];
      if (action) action();
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [words.length, shortcutsDisabled, showShortcutHelp, isPaused, quizPhase, zoomedImage, safePage, totalPages, selectedCard, cardStatus, progressiveForward, progressiveBackward, enterKanaPhase, enterReversePhase, enterResultPhase]);

  useEffect(() => () => clearCountdownTimer(), []);

  if (!group || group.words.length === 0) return (
    <div style={{ display:"flex", alignItems:"center", justifyContent:"center", height:VH, overflow:"hidden", background:C.bg, color:C.muted, fontSize:16 }}>
      请先在「编辑」模式中选择一个含有单词的单词组
    </div>
  );
  if (words.length === 0) return (
    <div style={{ display:"flex", flexDirection:"column", gap:14, alignItems:"center", justifyContent:"center", height:VH, overflow:"hidden", background:C.bg, color:C.muted, fontSize:16 }}>
      <div>当前单词组的单词都已在课堂隐藏</div>
      <button onClick={restoreHiddenWords} style={sBtnSm(C.primaryLight, C.primary, { border:`1.5px solid ${C.primary}33`, fontWeight:800 })}>恢复全部</button>
    </div>
  );

  const renderCard = (w, localIdx) => {
    const pos = getCellPosition(localIdx);
    const showMeaning = !!showMeaningMap[w.id];
    const showExamples = !!showExamplesMap[w.id];
    const examples = (w.examples || []).filter(e => e.ja || e.cn).slice(0, cfg.maxExamples);
    const hasImage = cfg.showImg && w.imageUrl;
    const noImageSingle = effectiveCount === 1 && !hasImage;
    const isQuizCard = ["kana","reverse"].includes(quizPhase);
    const status = cardStatus[localIdx];
    const isRevealed = !isQuizCard || status === "revealed";
    const isSelected = isQuizCard && selectedCard === localIdx && status === "pending";
    const dimCard = isQuizCard && selectedCard !== null && !isSelected && status === "pending";
    const showFullInfo = !isQuizCard || isRevealed;
    const showTags = !isQuizCard || isRevealed;
    const showMeaningBlock = !isQuizCard || quizPhase === "reverse" || isRevealed;
    const showExamplesBlock = !isQuizCard;

    const mainText = quizPhase === "kana" ? w.kana : quizPhase === "reverse" && !isRevealed ? "？？？" : (w.kanji || w.kana);
    const subText = quizPhase === "kana" ? (isRevealed ? (w.kanji || "") : "？？？") : quizPhase === "reverse" ? (isRevealed ? w.kana : "？？？") : (w.kanji ? w.kana : "");

    const showMainCurve = (!isQuizCard || isRevealed) && !w.kanji && quizPhase !== "kana";
    const showSubCurve = (!isQuizCard || isRevealed) && !!w.kanji && quizPhase !== "kana";

    const meaningRevealed = !!(quizPhase || showMeaning);
    const usageRevealed = meaningRevealed;
    const exampleButtonReady = meaningRevealed;
    const examplesRevealed = !!(quizPhase || showExamples);
    const isBackShown = !isQuizCard && cfg.showExamples && examples.length > 0 && !!flippedCardMap[w.id];
    const isTranslationRevealed = (exampleIdx) => !!exampleTranslationMap[`${w.id}-${exampleIdx}`];

    const isSmallGrid = effectiveCount > 1;
    const dynamicBackPadding = isSmallGrid && examples.length >= 3 ? (effectiveCount === 6 ? "6px 8px" : "12px 18px") : cfg.backPadding;
    const dynamicGap = isSmallGrid && examples.length >= 3 ? (effectiveCount === 6 ? "4px" : "7px") : `${Math.max(7, cfg.exJaSize * 0.16)}px`;
    const dynamicExJaSize = isSmallGrid && examples.length >= 3 ? (effectiveCount === 6 ? Math.max(24, cfg.exJaSize - 1) : Math.max(18, cfg.exJaSize - 1)) : cfg.exJaSize;
    const dynamicExCnSize = isSmallGrid && examples.length >= 3 ? (effectiveCount === 6 ? Math.max(18, cfg.exCnSize - 1) : Math.max(14, cfg.exCnSize - 1)) : cfg.exCnSize;
    const dynamicTranslationPadding = effectiveCount === 6 ? "5px 8px" : "8px 12px";
    const kanaTextColor = chalkboardMode ? "rgba(235,235,235,0.72)" : "#5F5F5F";
    const accentCurveProps = {
      color: C.accent || C.primary,
      textColor: kanaTextColor,
    };

    return (
      <div className={`perspective-container fade-in ${paintActive ? "paint-mode-active-card" : ""} ${!isBackShown && !paintActive ? "tactile-card" : ""} ${isSelected ? "active-card" : ""} ${!isQuizCard && selectedWordId === w.id ? "selected-teach-card" : ""}`} key={w.id} onClick={() => handleCardClick(localIdx)} style={{
        opacity: dimCard ? 0.45 : 1,
        zIndex: isSelected ? 5 : 1,
        transition: "opacity 0.3s cubic-bezier(0.25, 0.8, 0.25, 1)"
      }}>
        <div className={`flip-card-inner ${isBackShown ? "flipped" : ""}`}
          style={{
            cursor: isBackShown ? "default" : (isQuizCard && status === "pending" ? "pointer" : "pointer")
          }}>

          {/* FRONT FACE */}
          <div className="flip-card-front" style={{ display: "flex", flexDirection: "row", gap: 0, alignItems: "stretch", height: "100%", width: "100%", pointerEvents: isBackShown ? "none" : "auto" }}>
            {hasImage && (
              <div style={{ flex: cfg.imgFlex, background: chalkboardMode ? "rgba(255,255,255,0.035)" : "rgba(0,0,0,0.02)",
                borderRadius: "20px 0 0 20px", display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden", minHeight: 0, position: "relative", zIndex: 1 }}>
                <img src={w.imageUrl} alt=""
                  style={{ width: "100%", height: "100%", objectFit: "contain", cursor: !quizPhase ? "zoom-in" : "default", transition: "transform 0.3s" }}
                  onClick={(e) => {
                    if (!quizPhase) {
                      e.stopPropagation();
                      setZoomedImage(w.imageUrl);
                    }
                  }}
                  onError={e => e.currentTarget.parentElement.style.display = "none"} />
                {quizPhase === "kana" && !isRevealed && (
                  <div className="kana-image-mask" style={{ position: "absolute", top: 0, right: 0, bottom: 0, left: 0, width: "100%", height: "100%", minWidth: "100%", minHeight: "100%", background: "#000000", display: "flex", alignItems: "center", justifyContent: "center", borderRadius: "20px 0 0 20px", zIndex: 2, pointerEvents: "none" }}>
                    <span style={{ fontSize: 48, color: "rgba(255,255,255,0.3)", fontWeight: 700 }}>？</span>
                  </div>
                )}
              </div>
            )}
            <div style={{ flex: 1, minWidth: 0, padding: cfg.textPadding, display: "flex", flexDirection: "column", justifyContent: "center", gap: effectiveCount === 1 ? 20 : 8, textAlign: noImageSingle ? "center" : "left", position: "relative", zIndex: 3 }}>
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", width: "100%", textAlign: "center", position: "relative", zIndex: 3, flexShrink: 0 }}>
                
                {showMainCurve ? (
                  <div style={{ margin: "4px 0 2px", maxWidth:"100%", overflow:"visible" }}>
                    <VisualAccentCurve kana={w.kana} accent={w.accent} fontSize={noImageSingle ? cfg.noImgKanjiSize : cfg.kanjiSize} {...accentCurveProps} />
                  </div>
                ) : (
                  <div className="card-main-text" style={{ width: "100%", fontSize: noImageSingle ? cfg.noImgKanjiSize : cfg.kanjiSize, fontWeight: 700, fontFamily: SF, color: isQuizCard && !isRevealed && quizPhase === "reverse" ? C.border : C.text, lineHeight: 1.12, overflowWrap: "anywhere", textAlign: "center", borderBottom: isQuizCard && !isRevealed && quizPhase === "reverse" ? `2px dashed ${C.border}` : "none", display: "block" }}>{mainText}</div>
                )}

                {subText && (
                  showSubCurve ? (
                    <div style={{ marginTop: 2, maxWidth:"100%", overflow:"visible" }}>
                      <VisualAccentCurve kana={w.kana} accent={w.accent} fontSize={cfg.kanaSize} {...accentCurveProps} />
                    </div>
                  ) : (
                    <div className="card-sub-text" style={{ width: "100%", fontSize: (quizPhase === "kana" || (quizPhase === "reverse" && !isRevealed)) ? cfg.kanjiSize : cfg.kanaSize, color: isQuizCard && !isRevealed ? C.border : kanaTextColor, marginTop: 4, fontFamily: SF, overflowWrap: "anywhere", textAlign: "center", borderBottom: "none", boxShadow: "none", outline: "none", display: "block" }}>{subText}</div>
                  )
                )}

                {showTags && <div style={{ display: "flex", gap: 8, marginTop: 12, alignItems: "center", justifyContent: "center", flexWrap: "wrap" }}>
                  {(!w.accent || showMainCurve || showSubCurve) ? null : (
                    <span style={{ padding: cfg.tagPadding, borderRadius: cfg.tagRadius, background: C.primaryLight, color: C.primary, fontSize: cfg.tagSize, fontWeight: 600 }}>声调 {w.accent}</span>
                  )}
                  <span style={{ padding: cfg.tagPadding, borderRadius: cfg.tagRadius, background: C.greenLight, color: C.green, fontSize: cfg.tagSize, fontWeight: 600 }}>{w.pos}</span>
                </div>}
              </div>

              {showMeaningBlock && (
                <div style={{
                  flex: 0,
                  display: "flex",
                  flexDirection: "column",
                  justifyContent: "center",
                  textAlign: "center",
                }}>
                  {w.meaning && (
                    <div className="card-meaning-text" style={{
                      fontSize: cfg.meaningSize,
                      fontWeight: 700,
                      color: C.primary,
                      lineHeight: 1.22,
                      overflowWrap: "anywhere",
                      textAlign: "center",
                      filter: meaningRevealed ? "none" : `blur(${cfg.blurRadius}px)`,
                      opacity: meaningRevealed ? 1 : 0.15,
                      transform: "scale(1)",
                      transition: "filter 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.55s cubic-bezier(0.25, 0.8, 0.25, 1)"
                    }}>{smartBreak(w.meaning, "cn", cfg.meaningSize)}</div>
                  )}
                  {cfg.showUsage && w.usage && (quizPhase !== "kana" || isRevealed) && (
                    <div className="card-usage-text" style={{
                      fontSize: cfg.usageSize,
                      color: C.muted,
                      marginTop: 6,
                      lineHeight: 1.35,
                      textAlign: "center",
                      filter: usageRevealed ? "none" : `blur(${cfg.blurRadius}px)`,
                      opacity: usageRevealed ? 1 : 0.15,
                      transform: "scale(1)",
                      transition: "filter 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.55s cubic-bezier(0.25, 0.8, 0.25, 1)"
                    }}>💡 {smartBreak(w.usage, "cn", cfg.usageSize)}</div>
                  )}
                  {!isQuizCard && examples.length > 0 && (
                    <button onClick={(e) => {
                      e.stopPropagation();
                      if (!exampleButtonReady) return;
                      if (isFlippingRef.current) return;
                      isFlippingRef.current = true;
                      lastClickedBtnRef.current = true;

                      // Execute flip
                      setShowExamplesMap(p => ({ ...p, [w.id]: true }));
                      setFlippedCardMap(p => ({ ...p, [w.id]: true }));
                      setExampleTranslationMap(p => {
                        const next = { ...p };
                        examples.forEach((_, idx) => delete next[`${w.id}-${idx}`]);
                        return next;
                      });

                      setTimeout(() => {
                        isFlippingRef.current = false;
                        lastClickedBtnRef.current = false;
                      }, 680);
                    }}
                      style={{ alignSelf: "center", marginTop: 8, padding: effectiveCount === 1 ? "10px 24px" : "8px 20px", borderRadius: 24, border: "none", background: C.primary, color: "#fff", fontSize: Math.max(15, cfg.tagSize + 2), fontWeight: 800, cursor: exampleButtonReady ? "pointer" : "default", boxShadow: "0 4px 16px rgba(200,64,45,0.25)", visibility: exampleButtonReady ? "visible" : "hidden", pointerEvents: exampleButtonReady ? "auto" : "none", letterSpacing: 0, transform: "translateY(50%)" }}>
                      📖 例句
                    </button>
                  )}
                </div>
              )}

              <div style={{ display: "flex", justifyContent: "center" }}>
                {isQuizCard && showExamplesBlock && cfg.showExamples && examples.length > 0 && (
                  <div style={{
                    width: "fit-content",
                    maxWidth: "100%",
                    filter: examplesRevealed ? "none" : `blur(${cfg.blurRadius}px)`,
                    opacity: examplesRevealed ? 1 : 0.15,
                    transform: examplesRevealed ? "scale(1)" : "scale(0.96)",
                    letterSpacing: examplesRevealed ? "normal" : "3px",
                    transition: "filter 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), transform 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), letter-spacing 0.55s cubic-bezier(0.25, 0.8, 0.25, 1)"
                  }}>
                    {examples.map((ex, i) => (
                      <div key={i} style={{ marginBottom: 6, paddingLeft: 8, borderLeft: `${cfg.exBarWidth}px solid ${C.primary}`, textAlign: "left" }}>
                        <div className="card-example-ja" style={{ fontSize: cfg.exJaSize, color: C.text, fontFamily: SF, lineHeight: 1.35 }}>{smartBreak(ex.ja, "ja", cfg.exJaSize)}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
            <CanvasPaint
              wordId={w.id}
              face="front"
              active={paintActive}
              color={paintColor}
              thickness={paintThickness}
              tool={paintTool}
              strokes={strokesRegistry[w.id]?.front || []}
              onStrokesChange={(newStrokes) => {

/* ===== PRACTICE: FLASHCARD ===== */
function FlashcardPractice({ words, onBack, C, onStateChange }) {
  const [deck, setDeck] = useState(() => shuffle(words));
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [known, setKnown] = useState(0);
  const reset = () => { setDeck(shuffle(words)); setIdx(0); setFlipped(false); setKnown(0); };

  const w = deck[idx];
  const next = (ok) => { if(ok) setKnown(k=>k+1); setFlipped(false); setTimeout(()=>setIdx(i=>i+1), 120); };

  useEffect(() => {
    if (onStateChange) {
      onStateChange({
        title: "闪卡记忆",
        progressText: idx >= deck.length ? "练习已完成" : `${idx + 1} / ${deck.length}`,
        flipped,
        isDone: idx >= deck.length,
        markKnown: () => next(true),
        markUnknown: () => next(false),
        reset,
      });
    }
  }, [idx, deck.length, flipped, onStateChange]);

  if (idx >= deck.length) return (
    <div className="fade-in" style={{ textAlign:"center", padding:40, color:C.text }}>
      <div style={{ fontSize:48, marginBottom:16 }}>🎉</div>
      <div style={{ fontSize:26, fontWeight:700, marginBottom:8 }}>练习完成！</div>
      <div style={{ fontSize:16, color:C.muted, marginBottom:28 }}>已掌握 {known} / {deck.length} 个单词</div>
      <div style={{ width:200, height:8, background:C.borderLight, borderRadius:4, margin:"0 auto 24px" }}>
        <div style={{ width:`${(known/deck.length)*100}%`, height:8, background: known===deck.length?C.green:C.primary, borderRadius:4, transition:"width 0.5s" }}/>
      </div>
      <div style={{ display:"flex", gap:12, justifyContent:"center" }}>
        <button onClick={reset} style={sBtn(C.primary, "#fff", {fontWeight:700})}>🔄 再来一次</button>
        <button onClick={onBack} style={sBtn(C.bg, C.text, {border:`1px solid ${C.border}`})}>返回</button>
      </div>
    </div>
  );

  return (
    <div style={{ flex:1, minHeight:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"20px 36px" }}>
      <div style={{ color:C.muted, fontSize:14, marginBottom:22 }}>闪卡记忆　{idx+1} / {deck.length}</div>
      <div onClick={()=>setFlipped(!flipped)} className={flipped?"fade-in":""}
        style={{ width:500, maxWidth:"88vw", maxHeight:420, background:C.card, borderRadius:22, padding:28, cursor:"pointer",
          display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", textAlign:"center",
          border:`1.5px solid ${flipped?"rgba(200,64,45,0.2)":C.borderLight}`, boxShadow:"0 6px 24px rgba(0,0,0,0.06)", transition:"border-color 0.3s", position:"relative" }}>
        {!flipped ? (
          <>
            <div style={{ fontSize:48, fontWeight:700, fontFamily:SF, color:C.text }}>{w.kanji || w.kana}</div>
            {w.kanji && <div style={{ fontSize:22, color:C.muted, marginTop:8, fontFamily:SF }}>{w.kana}</div>}
            <div style={{ position:"absolute", bottom:18, color:C.hint, fontSize:12 }}>👆 点击翻面查看释义</div>
          </>
        ) : (
          <>
            {w.imageUrl && (
              <div style={{ width:130, maxHeight:80, background:"rgba(255,255,255,0.03)", borderRadius:12, marginBottom:14, display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden" }}>
                <img src={w.imageUrl} alt="" style={{ width:"100%", maxHeight:80, objectFit:"contain", borderRadius:12 }} onError={e=>e.currentTarget.parentElement.style.display="none"}/>
              </div>
            )}
            <div style={{ fontSize:28, fontWeight:700, color:C.primary, marginBottom:6 }}>{w.meaning}</div>
            <div style={{ fontSize:14, color:C.muted }}>{w.pos}{w.accent?` · 声调 ${w.accent}`:""}</div>
            {w.examples.filter(e=>e.ja).length > 0 && (
              <div style={{ marginTop:16, fontSize:16, color:C.muted, fontFamily:SF, lineHeight:1.6 }}>{w.examples[0].ja}</div>
            )}
          </>
        )}
      </div>
      {flipped && (
        <div className="slide-up" style={{ display:"flex", gap:14, marginTop:14 }}>
          <button onClick={()=>next(false)} style={{ padding:"10px 28px", background:"rgba(209,67,67,0.06)", color:C.wrong, border:`1.5px solid rgba(209,67,67,0.2)`, borderRadius:12, cursor:"pointer", fontSize:16, fontWeight:600, transition:"all 0.15s" }}
            onMouseEnter={e=>e.currentTarget.style.background="rgba(209,67,67,0.08)"} onMouseLeave={e=>e.currentTarget.style.background="rgba(209,67,67,0.06)"}>
            还没记住 😣
          </button>
          <button onClick={()=>next(true)} style={{ padding:"10px 28px", background:C.greenLight, color:C.green, border:`1.5px solid rgba(58,125,92,0.25)`, borderRadius:12, cursor:"pointer", fontSize:16, fontWeight:600, transition:"all 0.15s" }}
            onMouseEnter={e=>e.currentTarget.style.background="#DDF4E6"} onMouseLeave={e=>e.currentTarget.style.background=C.greenLight}>
            已掌握 ✌️
          </button>
        </div>
      )}
    </div>
  );
}

/* ===== PRACTICE: CHOICE ===== */
function ChoicePractice({ words, onBack, C, onStateChange }) {
  const [mode, setMode] = useState("ja2cn");
  const [questions, setQuestions] = useState([]);
  const [qi, setQi] = useState(0);
  const [sel, setSel] = useState(null);
  const [score, setScore] = useState(0);

  const generate = useCallback((m) => {
    return shuffle(words).map(w => {
      const pool = words.filter(x=>x.id!==w.id);
      const wrongs = shuffle(pool).slice(0, Math.min(3, pool.length));
      const opts = shuffle([
        { label: m==="cn2ja"?(w.kanji||w.kana):w.meaning, correct:true },
        ...wrongs.map(x => ({ label: m==="cn2ja"?(x.kanji||x.kana):x.meaning, correct:false }))
      ]);
      return { word:w, options:opts };
    });
  }, [words]);

  useEffect(() => { setQuestions(generate(mode)); setQi(0); setSel(null); setScore(0); }, [mode, generate]);

  useEffect(() => {
    if (onStateChange) {
      onStateChange({
        title: "选择题",
        progressText: qi >= questions.length ? "练习已完成" : `${qi + 1} / ${questions.length}`,
        isDone: qi >= questions.length,
        mode,
        setMode,
        reset: () => { setQuestions(generate(mode)); setQi(0); setSel(null); setScore(0); },
      });
    }
  }, [qi, questions.length, mode, onStateChange, generate]);

  if (!questions.length) return null;

  if (qi >= questions.length) return (
    <div className="fade-in" style={{ textAlign:"center", padding:40, color:C.text }}>
      <div style={{ fontSize:48, marginBottom:16 }}>{score>=questions.length*0.8?"🏆":score>=questions.length*0.5?"👍":"💪"}</div>
      <div style={{ fontSize:26, fontWeight:700, marginBottom:8 }}>得分：{score} / {questions.length}</div>
      <div style={{ fontSize:16, color:C.muted, marginBottom:28 }}>正确率 {Math.round(score/questions.length*100)}%</div>
      <div style={{ display:"flex", gap:12, justifyContent:"center" }}>
        <button onClick={()=>{setQuestions(generate(mode));setQi(0);setSel(null);setScore(0)}} style={sBtn(C.primary,"#fff",{fontWeight:700})}>🔄 再来一次</button>
        <button onClick={onBack} style={sBtn(C.bg,C.text,{border:`1px solid ${C.border}`})}>返回</button>
      </div>
    </div>
  );

  const q = questions[qi];
  const pick = (i) => {
    if (sel !== null) return;
    setSel(i);
    if (q.options[i].correct) setScore(s=>s+1);
    setTimeout(() => { setSel(null); setQi(qi+1); }, 1000);
  };

  return (
    <div style={{ flex:1, minHeight:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"16px 36px" }}>
      <div style={{ display:"flex", gap:8, marginBottom:10 }}>
        {[["ja2cn","日语 → 中文"],["cn2ja","中文 → 日语"]].map(([k,l])=>(
          <button key={k} onClick={()=>setMode(k)} style={{ padding:"7px 18px", borderRadius:8, border:`1.5px solid ${mode===k?"rgba(200,64,45,0.2)":C.border}`, background:mode===k?C.primaryLight:"transparent", color:mode===k?C.primary:C.muted, cursor:"pointer", fontSize:13, fontWeight:600, transition:"all 0.15s" }}>{l}</button>
        ))}
      </div>
      <div style={{ color:C.muted, fontSize:14, marginBottom:18 }}>选择题　{qi+1} / {questions.length}</div>
      <div className="fade-in" key={qi} style={{ background:C.card, borderRadius:22, padding:"22px 30px", width:520, maxWidth:"88vw", textAlign:"center", border:`1px solid ${C.borderLight}` }}>
        {mode==="ja2cn" && q.word.imageUrl && (
          <div style={{ width:170, maxHeight:100, background:"rgba(255,255,255,0.03)", borderRadius:14, margin:"0 auto 18px", display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden" }}>
            <img src={q.word.imageUrl} alt="" style={{ width:"100%", maxHeight:100, objectFit:"contain", borderRadius:14 }} onError={e=>e.currentTarget.parentElement.style.display="none"}/>
          </div>
        )}
        <div style={{ fontSize:34, fontWeight:700, fontFamily:mode==="cn2ja"?CN_FONT:SF, color:C.text, marginBottom:14 }}>{mode==="cn2ja"?q.word.meaning:(q.word.kanji||q.word.kana)}</div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
          {q.options.map((opt,i) => {
            let bg=C.bg, bdr=C.border, clr=C.text;
            if (sel !== null) {
              if (opt.correct) { bg="rgba(58,125,92,0.12)"; bdr="rgba(58,125,92,0.3)"; clr=C.green; }
              else if (i===sel && !opt.correct) { bg="rgba(209,67,67,0.08)"; bdr="rgba(209,67,67,0.2)"; clr=C.wrong; }
            }
            return (
              <button key={i} onClick={()=>pick(i)}
                style={{ padding:"10px 14px", background:bg, border:`1.5px solid ${bdr}`, borderRadius:12, cursor:sel!==null?"default":"pointer", color:clr, fontSize:15, fontWeight:500, fontFamily:mode==="cn2ja"?SF:CN_FONT, transition:"all 0.2s", animation:sel===i&&!q.options[i].correct?"shake 0.3s":"none" }}
                onMouseEnter={e=>{if(sel===null)e.currentTarget.style.background=C.borderLight}}
                onMouseLeave={e=>{if(sel===null)e.currentTarget.style.background=C.bg}}>
                {opt.label}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ===== PRACTICE: MATCH ===== */
function MatchPractice({ words, onBack, C, onStateChange }) {
  const [items, setItems] = useState(() => shuffle(words).slice(0, Math.min(6, words.length)));
  const [leftOrd] = useState(() => shuffle([...Array(Math.min(6,words.length)).keys()]));
  const [rightOrd] = useState(() => shuffle([...Array(Math.min(6,words.length)).keys()]));
  const [selL, setSelL] = useState(null);
  const [matched, setMatched] = useState(new Set());
  const [wrong, setWrong] = useState(null);
  const [done, setDone] = useState(false);

  const clickL = (i) => { if(matched.has(i)) return; setSelL(i); setWrong(null); };
  const clickR = (i) => {
    if (selL===null || matched.has(i)) return;
    if (selL === i) {
      const nm = new Set([...matched, i]);
      setMatched(nm); setSelL(null);
      if (nm.size === items.length) setTimeout(()=>setDone(true), 350);
    } else {
      setWrong(i);
      setTimeout(() => { setWrong(null); setSelL(null); }, 550);
    }
  };
  const reset = () => {
    const ni = shuffle(words).slice(0,Math.min(6,words.length));
    setItems(ni); setMatched(new Set()); setSelL(null); setWrong(null); setDone(false);
  };

  useEffect(() => {
    if (onStateChange) {
      onStateChange({
        title: "配对连线",
        progressText: done ? "练习已完成" : `已完成 ${matched.size} / ${items.length}`,
        isDone: done,
        reset,
      });
    }
  }, [matched.size, items.length, done, onStateChange]);

  if (done) return (
    <div className="fade-in" style={{ textAlign:"center", padding:40, color:C.text }}>
      <div style={{ fontSize:48, marginBottom:16 }}>✨</div>
      <div style={{ fontSize:26, fontWeight:700, marginBottom:24 }}>全部配对成功！</div>
      <div style={{ display:"flex", gap:12, justifyContent:"center" }}>
        <button onClick={reset} style={sBtn(C.primary,"#fff",{fontWeight:700})}>🔄 再来一次</button>
        <button onClick={onBack} style={sBtn(C.bg,C.text,{border:`1px solid ${C.border}`})}>返回</button>
      </div>
    </div>
  );

  return (
    <div style={{ flex:1, minHeight:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"16px 36px" }}>
      <div style={{ color:C.muted, fontSize:14, marginBottom:22 }}>配对连线　已完成 {matched.size} / {items.length}</div>
      <div style={{ display:"flex", gap:44, width:640, maxWidth:"92vw", justifyContent:"center" }}>
        <div style={{ flex:1, display:"flex", flexDirection:"column", gap:7 }}>
          <div style={{ fontSize:12, color:C.hint, fontWeight:600, textAlign:"center", marginBottom:4 }}>日本語</div>
          {leftOrd.map(i => {
            const w=items[i]; const m=matched.has(i); const s=selL===i;
            return (
              <button key={i} onClick={()=>clickL(i)} disabled={m}
                style={{ padding:"10px 14px", background:m?C.greenLight:s?C.primaryLight:C.bg,
                  border:`1.5px solid ${m?"rgba(58,125,92,0.25)":s?"rgba(200,64,45,0.3)":C.border}`,
                  borderRadius:12, cursor:m?"default":"pointer", fontSize:17, fontFamily:SF,
                  color:m?C.green:s?C.primary:C.text, transition:"all 0.2s", opacity:m?0.6:1 }}>
                {w.kanji||w.kana}
              </button>
            );
          })}
        </div>
        <div style={{ flex:1, display:"flex", flexDirection:"column", gap:7 }}>
          <div style={{ fontSize:12, color:C.hint, fontWeight:600, textAlign:"center", marginBottom:4 }}>中 文</div>
          {rightOrd.map(i => {
            const w=items[i]; const m=matched.has(i); const isW=wrong===i;
            return (
              <button key={i} onClick={()=>clickR(i)} disabled={m}
                style={{ padding:"10px 14px", background:m?C.greenLight:isW?"rgba(209,67,67,0.08)":C.bg,
                  border:`1.5px solid ${m?"rgba(58,125,92,0.25)":isW?"rgba(209,67,67,0.2)":C.border}`,
                  borderRadius:12, cursor:m?"default":"pointer", fontSize:15, fontWeight:500,
                  color:m?C.green:isW?C.wrong:C.text, transition:"all 0.2s", opacity:m?0.6:1,
                  animation:isW?"shake 0.35s":"none" }}>
                {w.meaning}
              </button>
            );
          })}
        </div>
      </div>
      <div style={{ color:C.hint, fontSize:12, marginTop:10 }}>提示：先点击左侧日语，再点击右侧对应中文释义</div>
    </div>
  );
}

  useEffect(() => {
    if (!type) {
      setSubPracticeState(null);
    }
  }, [type]);

  useEffect(() => {
    if (onPracticeStateChange) {
      if (!type) {
        onPracticeStateChange({
          type: null,
          title: "选择练习方式",
          progressText: `${group?.name || ""} · ${practiceWords.length} 个单词${hiddenCount ? ` · 已过滤 ${hiddenCount} 个隐藏词` : ""}`,

        <div style={{ fontSize:14, color:C.muted, marginBottom:10 }}>{group.name} · {practiceWords.length} 个单词{hiddenCount ? ` · 已过滤 ${hiddenCount} 个隐藏词` : ""}</div>

        <div style={{ display:"flex", gap:18, flexWrap:"wrap", justifyContent:"center" }}>

            { key:"flash", icon:"🃏", title:"闪卡记忆", desc:"逐张翻面 · 自我检测" },
            { key:"choice", icon:"✅", title:"选择题", desc:"四选一 · 快速判断" },
            { key:"match", icon:"🔗", title:"配对连线", desc:"左右匹配 · 强化关联" },
          ].map(t => (
            <button key={t.key} onClick={()=>setType(t.key)}
              style={{ width:170, padding:"22px 18px", background:C.card, border:`1.5px solid ${C.borderLight}`, borderRadius:18, cursor:"pointer", textAlign:"center", transition:"all 0.25s" }}
              onMouseEnter={e=>{e.currentTarget.style.borderColor="rgba(200,64,45,0.25)";e.currentTarget.style.transform="translateY(-5px)";e.currentTarget.style.boxShadow="0 8px 24px rgba(0,0,0,0.08)";}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor=C.borderLight;e.currentTarget.style.transform="none";e.currentTarget.style.boxShadow="none";}}>
              <div style={{ fontSize:40, marginBottom:12 }}>{t.icon}</div>
              <div style={{ fontSize:17, fontWeight:700, color:C.text, marginBottom:6 }}>{t.title}</div>
              <div style={{ fontSize:12, color:C.muted, lineHeight:1.5 }}>{t.desc}</div>
            </button>

  const pp = { words: practiceWords, onBack:()=>setType(null), C, onStateChange: setSubPracticeState };
  return (
    <div style={{ height:"100%", overflow:"hidden", background:C.bg, display:"flex", flexDirection:"column" }}>
      <div style={{ padding:"10px 28px", flexShrink:0 }}>

          onMouseEnter={e=>e.currentTarget.style.background=C.borderLight} onMouseLeave={e=>e.currentTarget.style.background=C.bg}>

}

  const [importApplying, setImportApplying] = useState(false);

  const [syncConflict, setSyncConflict] = useState(null);
  const [teachState, setTeachState] = useState(null);
  const [practiceState, setPracticeState] = useState(null);
  const [triggerAddWord, setTriggerAddWord] = useState(0);
  const [showMoreMenu, setShowMoreMenu] = useState(false);
  const [showAddMenu, setShowAddMenu] = useState(false);
  const [showTeachGroupPopover, setShowTeachGroupPopover] = useState(false);
  const [teachPopoverExpandedCats, setTeachPopoverExpandedCats] = useState(() => Object.fromEntries(DEFAULT_WORD_SET_CATEGORIES.map(cat => [cat, true])));
  const fileRef = useRef();
  const syncTimerRef = useRef(null);
  const groupsRef = useRef(groups);
  const categoriesRef = useRef(categories);
  const tombstonesRef = useRef(tombstones);
  const groupIdRef = useRef(groupId);
  const curGidRef = useRef(curGid);
  const lastSyncRef = useRef(null);
  const syncLoadingRef = useRef(false);
  const suppressAutoSyncRef = useRef(true);
  const pendingAutoSyncRef = useRef(false);
  const isDataReallyChangedRef = useRef(false);
  const lastDataSnapshotRef = useRef(makeDataSnapshot([], DEFAULT_WORD_SET_CATEGORIES, { groups: {}, words: {} }));

  useEffect(() => { groupsRef.current = groups; }, [groups]);
  useEffect(() => { categoriesRef.current = categories; }, [categories]);
  useEffect(() => { tombstonesRef.current = tombstones; }, [tombstones]);
  useEffect(() => { groupIdRef.current = groupId; }, [groupId]);
  useEffect(() => { curGidRef.current = curGid; }, [curGid]);

  useEffect(() => {
    if (curGid && ready) {
      try {
        localStorage.setItem("classtango_last_uploaded_" + sanitizeGroupId(groupId), curGid);
      } catch (e) {}
    }
  }, [curGid, groupId, ready]);

  const currentWordGroup = useMemo(() => groups.find(g => g.id === curGid) || groups[0] || null, [groups, curGid]);
  const importCategories = useMemo(() => buildCategoryList(groups, categories), [groups, categories]);
  const teachGroupTree = useMemo(() => buildCategoryList(groups, categories).map(category => ({
    category,
    groups: groups.filter(g => inferWordSetCategory(g) === category),
  })), [groups, categories]);
  const currentImportCategory = currentWordGroup ? inferWordSetCategory(currentWordGroup) : "未分类";
  const effectiveImportCategory = importCategories.includes(importCategory) ? importCategory : (importCategories.includes(currentImportCategory) ? currentImportCategory : "未分类");
  const updateImportCategory = (category) => {
    const nextCategory = normalizeCategoryName(category);
    setImportCategory(nextCategory);
    try { localStorage.setItem(LAST_IMPORT_CATEGORY_KEY, nextCategory); } catch(e) {}
  };
  const markDataReallyChanged = useCallback(() => {
    isDataReallyChangedRef.current = true;
  }, []);
  const updateGroupsAndDetectDeletions = useCallback((next) => {
    setGroups(prev => {
      const oldGroups = prev;
      const newGroups = typeof next === "function" ? next(oldGroups) : next;
      if (ready) {
        const deletedGroupIds = [];
        const deletedWordIds = [];
        const newGroupIds = new Set(newGroups.map(g => g.id));
        oldGroups.forEach(g => {
          if (!newGroupIds.has(g.id)) {
            deletedGroupIds.push(g.id);
          } else {
            const newG = newGroups.find(x => x.id === g.id);
            const newWordIds = new Set((newG?.words || []).map(w => w.id));
            (g.words || []).forEach(w => {
              if (!newWordIds.has(w.id)) {
                deletedWordIds.push(w.id);
              }
            });
          }
        });
        if (deletedGroupIds.length > 0 || deletedWordIds.length > 0) {
          setTombstones(prevT => {
            const nextT = {
              groups: { ...prevT.groups },
              words: { ...prevT.words }
            };
            const now = Date.now();
            deletedGroupIds.forEach(id => { nextT.groups[id] = now; });
            deletedWordIds.forEach(id => { nextT.words[id] = now; });
            return nextT;
          });
        }
      }
      return newGroups;
    });
  }, [ready]);
  const setGroupsFromUserAction = useCallback((next) => {
    markDataReallyChanged();
    updateGroupsAndDetectDeletions(next);
  }, [markDataReallyChanged, updateGroupsAndDetectDeletions]);
  const setCategoriesFromUserAction = useCallback((next) => {
    markDataReallyChanged();
    setCategories(prev => typeof next === "function" ? next(prev) : next);
  }, [markDataReallyChanged]);
  const persistSyncPayload = useCallback((groupIdValue, payload) => {
    const normalized = normalizeSyncPayload(payload, groupIdValue);
    storage.save(groupIdValue, normalized);
    lastDataSnapshotRef.current = makeDataSnapshot(normalized.groups, normalized.categories, normalized.tombstones);
    lastSyncRef.current = Number(normalized.synced_at || normalized.last_updated || Date.now());
    return normalized;
  }, []);
  const applyPayloadToState = useCallback((groupIdValue, payload, { message, status = "synced", loading = false, error = "" } = {}) => {
    const normalized = normalizeSyncPayload(payload, groupIdValue);
    
    // Merge local and remote tombstones to prevent overwriting deletions
    const localT = tombstonesRef.current || { groups: {}, words: {} };
    const remoteT = normalized.tombstones || { groups: {}, words: {} };
    const mergedT = {
      groups: {},
      words: {}
    };
    const allGroupKeys = new Set([...Object.keys(localT.groups || {}), ...Object.keys(remoteT.groups || {})]);
    allGroupKeys.forEach(id => {
      mergedT.groups[id] = Math.max(localT.groups?.[id] || 0, remoteT.groups?.[id] || 0);
    });
    const allWordKeys = new Set([...Object.keys(localT.words || {}), ...Object.keys(remoteT.words || {})]);
    allWordKeys.forEach(id => {
      mergedT.words[id] = Math.max(localT.words?.[id] || 0, remoteT.words?.[id] || 0);
    });

    const filteredGroups = (normalized.groups || []).filter(g => {
      return !mergedT.groups[g.id];
    }).map(g => {
      const filteredWords = (g.words || []).filter(w => {
        return !mergedT.words[w.id] && !mergedT.words[w.kana];
      });
      return { ...g, words: filteredWords };
    });

    normalized.tombstones = mergedT;
    normalized.groups = filteredGroups;

    suppressAutoSyncRef.current = true;
    setGroups(normalized.groups);
    setCategories(normalized.categories);
    setTombstones(normalized.tombstones);
    setCurGid(prev => normalized.groups.some(g => g.id === prev) ? prev : (normalized.groups[0]?.id || null));
    persistSyncPayload(groupIdValue, normalized);
    setSyncMeta({
      loading,
      status,
      message,
      lastSyncedAt: Number(normalized.synced_at || normalized.last_updated || Date.now()),
      error,
    });
    return normalized;
  }, [persistSyncPayload]);
  const openConflictModal = useCallback((groupIdValue, localPayload, remotePayload, source) => {
    setSyncConflict({ open:true, groupId:groupIdValue, localPayload:normalizeSyncPayload(localPayload, groupIdValue), remotePayload:normalizeSyncPayload(remotePayload, groupIdValue), source });
    setSyncMeta(prev => ({
      ...prev,
      loading:false,
      status:"conflict",
      message:"检测到本地与云端同时有改动，请选择处理方式。",
      error:"",
    }));
  }, []);
  const backgroundRevalidate = useCallback(async (groupIdValue) => {
    if (syncLoadingRef.current) {
      pendingAutoSyncRef.current = true;
      return null;
    }
    syncLoadingRef.current = true;
    if (syncTimerRef.current) {
      clearTimeout(syncTimerRef.current);
      syncTimerRef.current = null;
    }
    setSyncMeta(prev => ({ ...prev, loading:true, status:"syncing", message:"后台静默同步中...", error:"" }));
    try {
      const remotePayload = await pullFromCloud(groupIdValue);
      const localPayload = normalizeSyncPayload(storage.load(groupIdValue) || { group_id: groupIdValue, last_updated: Date.now(), synced_at: Date.now(), categories: categoriesRef.current, groups: groupsRef.current }, groupIdValue);
      const remoteStamp = Number(remotePayload.last_updated || 0);
      const syncedStamp = Number(localPayload.synced_at || 0);
      const localDirty = hasUnsyncedLocalChanges(localPayload);
      if (remoteStamp <= syncedStamp) {
        setSyncMeta(prev => ({
          ...prev,
          loading:false,
          status:"synced",
          message: prev.message || "当前已是最新数据",
          lastSyncedAt: Number(localPayload.synced_at || localPayload.last_updated || Date.now()),
          error:"",
        }));
        return remotePayload;
      }
      if (!localDirty) {
        applyPayloadToState(groupIdValue, { ...remotePayload, synced_at: remoteStamp }, {
          status:"synced",
          message:"已自动同步最新数据",
          loading:false,
          error:"",
        });
        return remotePayload;
      }
      openConflictModal(groupIdValue, localPayload, remotePayload, "background");
      return remotePayload;
    } catch (error) {
      const message = error?.name === "AbortError" ? "后台同步超时，请检查网络。" : (error?.message || "后台同步失败，请稍后重试。");
      setSyncMeta(prev => ({ ...prev, loading:false, status:"error", message, error:message }));
      return null;
    } finally {
      syncLoadingRef.current = false;
      if (pendingAutoSyncRef.current) {
        pendingAutoSyncRef.current = false;
        syncTimerRef.current = setTimeout(() => { syncNow({ source:"auto" }).catch(() => {}); }, CONTINUE_SYNC_DELAY_MS);
      }
    }
  }, [applyPayloadToState, openConflictModal]);
  const syncNow = useCallback(async ({ source = "manual" } = {}) => {
    if (syncLoadingRef.current) {
      pendingAutoSyncRef.current = true;
      return null;
    }
    const activeGroupId = sanitizeGroupId(groupIdRef.current);
    syncLoadingRef.current = true;
    if (syncTimerRef.current) {
      clearTimeout(syncTimerRef.current);
      syncTimerRef.current = null;
    }
    setSyncMeta(prev => ({ ...prev, loading:true, status:"syncing", message: source === "manual" ? "正在手动同步..." : "正在同步...", error:"" }));

          status:"synced",
          message:"已自动同步最新数据",
          loading:false,
          error:"",

        return remotePayload;

      if (!localDirty) {
        setSyncMeta({
          loading:false,
          status:"synced",
          message:"当前已是最新数据",
          lastSyncedAt:Number(localPayload.synced_at || localPayload.last_updated || Date.now()),
          error:"",
        });
        return remotePayload;
      }
      const payloadToPush = normalizeSyncPayload({ ...localPayload, synced_at: Number(localPayload.last_updated || Date.now()) }, activeGroupId);
      const pushed = await pushToCloud(activeGroupId, payloadToPush);
      const latestLocalPayload = storage.load(activeGroupId);

        applyPayloadToState(conflictGroupId, payloadToPush, { status:"synced", message:"已保留本地并同步到云端", loading:false, error:"" });

                  </button>
                  <button
                    onClick={() => { handleExportJson(); setShowMoreMenu(false); }}
                    style={{
                      width: "100%",
                      textAlign: "left",
                      padding: "7px 10px",
                      border: "none",
                      background: "transparent",
                      borderRadius: 6,
                      cursor: "pointer",
                      color: appC.text,
                      fontSize: 12,
                      fontWeight: 500,
                      transition: "background 0.2s"
                    }}
                    onMouseEnter={e => e.currentTarget.style.background = appC.borderLight}
                    onMouseLeave={e => e.currentTarget.style.background = "transparent"}
                  >
                    💾 备份为 JSON
                  </button>
                </div>
              </>
            )}
          </div>

          {/* Sync LED and Popover */}
          <div style={{ position: "relative", display: "flex", alignItems: "center" }}>
            <button
              type="button"
              onClick={handleManualSync}
              onMouseEnter={() => setShowSyncPopover(true)}
              onMouseLeave={() => setShowSyncPopover(false)}
              aria-label="同步状态"
              title="同步状态"
              disabled={syncMeta.loading}
              style={{
                width: 12,
                height: 12,
                borderRadius: "50%",
                border: "none",
                padding: 0,
                cursor: syncMeta.loading ? "not-allowed" : "pointer",
                background: syncMeta.loading ? appC.blue : (syncMeta.status === "error" ? appC.wrong : syncMeta.status === "synced" ? appC.green : syncMeta.status === "dirty" ? "#E8A040" : appC.border),
                boxShadow: syncMeta.loading ? `0 0 8px ${appC.blue}` : (syncMeta.status === "error" ? `0 0 8px ${appC.wrong}` : (syncMeta.status === "dirty" ? `0 0 8px #E8A040` : `0 0 8px ${appC.green}`)),
                position: "relative",
                transition: "all 0.3s ease",
                margin: "0 6px",
                display: "flex",
                alignItems: "center",
                justifyContent: "center"
              }}
            >
              {syncMeta.loading && (
                <span style={{
                  position: "absolute",
                  top: -3,
                  right: -3,
                  bottom: -3,
                  left: -3,
                  borderRadius: "50%",
                  border: `1.5px solid ${appC.blueLight}`,
                  borderTopColor: appC.blue,
                  animation: "spin 0.9s linear infinite"
                }} />
              )}
            </button>

            {showSyncPopover && (
              <div
                onMouseEnter={() => setShowSyncPopover(true)}
                onMouseLeave={() => setShowSyncPopover(false)}
                style={{
                  position: "absolute",
                  right: 0,
                  bottom: 34,
                  width: 240,
                  background: appC.card,
                  border: `1.5px solid ${appC.border}`,
                  borderRadius: 12,
                  boxShadow: "0 -8px 30px rgba(0,0,0,0.18)",
                  padding: "12px 14px",
                  zIndex: 1020,
                  textAlign: "left"
                }}
              >
                <div style={{ fontSize: 12, fontWeight: 800, color: appC.text, marginBottom: 6, display: "flex", alignItems: "center", gap: 6 }}>
                  <span>🌐 云端词库同步看板</span>
                </div>
                <div style={{ fontSize: 11, color: appC.muted, lineHeight: 1.6, display: "flex", flexDirection: "column", gap: 4 }}>
                  <div>组 ID：<span style={{ fontFamily: "monospace", color: appC.text }}>{groupId}</span></div>
                  <div>当前词组：<span style={{ color: appC.text, fontWeight: 600 }}>{currentWordGroup?.name || "未选择"}</span></div>
                  <div>状态：<span style={{
                    color: syncMeta.loading ? appC.blue : (syncMeta.status === "error" ? appC.wrong : syncMeta.status === "dirty" ? "#E8A040" : appC.green),
                    fontWeight: 700
                  }}>
                    {syncMeta.loading ? "正在同步中" : (syncMeta.status === "error" ? "连接失败 (异常)" : syncMeta.status === "dirty" ? "本地有修改 (待同步)" : "已与云端同步")}
                  </span></div>
                  <div>上次同步：<span style={{ color: appC.text }}>{formatSyncTime(syncMeta.lastSyncedAt)}</span></div>
                  <div style={{
                    marginTop: 6,
                    paddingTop: 6,
                    borderTop: `1px dashed ${appC.border}`,
                    color: syncMeta.status === "error" ? appC.wrong : appC.muted,
                    fontSize: 10
                  }}>
                    {syncMeta.message || "自动静默同步已启用"}
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    );
  };

  return (
    <div style={{ height: "100vh", background: appC.bg, transition: "background 0.3s ease", position: "relative", overflow: "hidden" }}>
      <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={handleImport}/>

      <div
        style={{
          position: "absolute",
          top: 0,
          bottom: 48,
          left: 0,
          right: 0,
          overflow: "hidden",
          background: appC.bg,
          transition: "background 0.3s ease"
        }}
      >
        {mode === "edit" && <EditMode groups={groups} setGroups={setGroupsFromUserAction} categories={categories} setCategories={setCategoriesFromUserAction} gid={curGid} setGid={setCurGid} triggerAddWord={triggerAddWord} themeC={appC}/>}
        {mode === "teach" && <TeachMode
          groups={groups}
          gid={curGid}
          setGroups={setGroupsFromUserAction}
          setGid={setCurGid}
          mode={mode}
          setMode={setMode}
          shortcutsDisabled={importOpen || !!syncConflict?.open}
          chalkboardMode={teachChalkboardMode}
          setChalkboardMode={setTeachChalkboardMode}
          syncMeta={syncMeta}
          groupId={groupId}
          onDownloadTemplate={handleDownloadTemplate}
          onImportClick={()=>fileRef.current?.click()}
          onExportExcel={handleExportExcel}
          onExportJson={handleExportJson}
          onTeachStateChange={setTeachState}
        />}
        {mode === "practice" && <PracticeMode groups={groups} gid={curGid} chalkboardMode={teachChalkboardMode} onPracticeStateChange={setPracticeState}/>}
      </div>

      {renderBottombar()}

      {syncConflict?.open && (
        <div style={{ position:"fixed", top:0, right:0, bottom:0, left:0, zIndex:1400, background:"rgba(0,0,0,0.45)", backdropFilter: "blur(4px)", display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}>
          <div style={{ width:520, maxWidth:"94vw", background:C.card, borderRadius:16, border:`1px solid ${C.border}`, boxShadow:"0 24px 80px rgba(0,0,0,0.22)", padding:24 }}>
            <div style={{ fontSize:18, fontWeight:800, color:C.text, marginBottom:10 }}>检测到同步冲突</div>
            <div style={{ fontSize:13, color:C.muted, lineHeight:1.75, marginBottom:18 }}>
              <div>云端更新时间：{formatSyncTime(syncConflict.remotePayload?.last_updated)}</div>
              <div>本地更新时间：{formatSyncTime(syncConflict.localPayload?.last_updated)}</div>
              <div>本地已同步时间：{formatSyncTime(syncConflict.localPayload?.synced_at)}</div>
              <div style={{ marginTop:8 }}>本地和云端都发生了改动，请选择处理方式。</div>
            </div>
            <div style={{ display:"flex", gap:10, flexWrap:"wrap", justifyContent:"flex-end" }}>
              <button onClick={()=>resolveSyncConflict("local")} style={sBtnSm(C.bg, C.text, { border:`1px solid ${C.border}` })}>保留本地</button>
              <button onClick={()=>resolveSyncConflict("remote")} style={sBtnSm(C.blueLight, C.blue)}>使用云端</button>
              <button onClick={()=>resolveSyncConflict("merge")} style={sBtnSm(C.primary, "#fff")}>智能合并</button>
              <button onClick={()=>setSyncConflict(null)} style={sBtnSm(C.bg, C.muted, { border:`1px solid ${C.border}` })}>取消</button>
            </div>
          </div>
        </div>
      )}

      <Modal open={importOpen} onClose={closeImportModal} title="导入 Excel 单词表" wide themeC={appC}>
        <div>
          <div style={{ padding:"12px 14px", borderRadius:10, background:C.bg, color:C.muted, fontSize:13, marginBottom:16 }}>
            {importStatus}
          </div>
          {importDraft && (
            <>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(3, 1fr)", gap:10, marginBottom:16 }}>
                <div style={{ background:C.primaryLight, borderRadius:10, padding:12 }}>
                  <div style={{ fontSize:12, color:C.muted }}>工作表</div>
                  <div style={{ fontSize:22, fontWeight:800, color:C.primary }}>{importDraft.sheets.length}</div>
                </div>
                <div style={{ background:C.greenLight, borderRadius:10, padding:12 }}>
                  <div style={{ fontSize:12, color:C.muted }}>可导入单词</div>
                  <div style={{ fontSize:22, fontWeight:800, color:C.green }}>{importDraft.totalWords}</div>
                </div>
                <div style={{ background:C.blueLight, borderRadius:10, padding:12 }}>
                  <div style={{ fontSize:12, color:C.muted }}>需跳过行</div>
                  <div style={{ fontSize:22, fontWeight:800, color:C.blue }}>{importDraft.totalSkipped}</div>
                </div>
              </div>
              <div style={{ marginBottom:16 }}>
                <label style={sLabel}>导入模式</label>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(3, 1fr)", gap:10 }}>
                  {[
                    { key:"newGroup", title:"按工作表新建", desc:`每个有数据的工作表生成一个单词组，放入“${effectiveImportCategory}”` },
                    { key:"append", title:"追加到当前组", desc:`全部工作表的单词合并追加到“${currentWordGroup?.name || "当前单词组"}”` },
                    { key:"replace", title:"替换全部数据", desc:"清空现有单词组，再按工作表重新创建" },
                  ].map(item => (
                    <button key={item.key} onClick={()=>!importApplying&&setImportMode(item.key)} disabled={importApplying}
                      style={{ textAlign:"left", padding:"12px 13px", borderRadius:10, cursor:importApplying?"not-allowed":"pointer", opacity:importApplying?0.68:1, background:importMode===item.key?C.primaryLight:"#fff", border:`1.5px solid ${importMode===item.key?C.primary:C.border}`, color:C.text }}>
                      <div style={{ fontSize:14, fontWeight:700, marginBottom:4 }}>{item.title}</div>
                      <div style={{ fontSize:12, lineHeight:1.45, color:C.muted }}>{item.desc}</div>
                    </button>
                  ))}
                </div>
              </div>
              {importMode === "newGroup" && (
                <div style={{ marginBottom:16 }}>
                  <label style={sLabel}>新建单词组放入分类</label>
                  <select value={effectiveImportCategory} onChange={e=>updateImportCategory(e.target.value)} disabled={importApplying}
                    style={{ width:"100%", padding:"10px 12px", borderRadius:10, border:`1.5px solid ${C.border}`, background:C.card, color:C.text, fontSize:14, outline:"none", opacity:importApplying?0.68:1 }}>
                    {importCategories.map(category => <option key={category} value={category}>{category}</option>)}
                  </select>
                  <div style={{ fontSize:12, color:C.muted, marginTop:6, lineHeight:1.5 }}>
                    这里会记住上一次选择，后续导入会优先使用这个分类。
                  </div>
                </div>
              )}
              <div style={{ marginBottom:16 }}>
                <label style={sLabel}>导入预览</label>
                <div style={{ fontSize:12, color:C.muted, marginBottom:8, lineHeight:1.5 }}>
                  当前选择：{importMode === "newGroup" ? `每个工作表会成为一个新的单词组，并放入“${effectiveImportCategory}”` : importMode === "append" ? "全部可导入单词会进入当前单词组" : "现有单词组会被导入内容替换"}。
                </div>
                <div style={{ maxHeight:260, overflowY:"auto", border:`1px solid ${C.borderLight}`, borderRadius:10 }}>
                  {importDraft.sheets.map(sheet => (
                    <div key={sheet.name} style={{ padding:12, borderBottom:`1px solid ${C.borderLight}` }}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                        <strong style={{ color:C.text, fontSize:14 }}>{sheet.name}</strong>
                        <span style={{ color:C.muted, fontSize:12 }}>{sheet.words.length} 个单词</span>
                      </div>
                      <div style={{ overflowX:"auto" }}>
                        <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
                          <thead>
                            <tr>{["假名","汉字","中文释义","词性"].map(h => <th key={h} style={{ textAlign:"left", color:C.muted, padding:"5px 6px", borderBottom:`1px solid ${C.borderLight}` }}>{h}</th>)}</tr>
                          </thead>
                          <tbody>
                            {sheet.preview.length ? sheet.preview.map((row, i) => (
                              <tr key={i}>
                                {["假名","汉字","中文释义","词性"].map(h => <td key={h} style={{ padding:"5px 6px", color:C.text, borderBottom:`1px solid ${C.borderLight}` }}>{row[h] || "—"}</td>)}
                              </tr>
                            )) : (
                              <tr><td colSpan="4" style={{ padding:"6px", color:C.muted }}>此工作表没有数据行</td></tr>
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
              {importResult && (
                <div style={{ padding:"12px 14px", borderRadius:10, background:C.greenLight, color:C.green, fontSize:13, marginBottom:16, lineHeight:1.7 }}>
                  <strong>导入结果：</strong>新增 {importResult.added} 个，更新 {importResult.updated} 个，跳过 {importResult.skipped} 行。
                  {importResult.warnings.length > 0 && (
                    <div style={{ color:C.muted, marginTop:5 }}>
                      跳过明细：{importResult.warnings.slice(0, 8).map(w => `${w.sheet} 第${w.rowNumber}行（${w.reason}）`).join("；")}
                      {importResult.warnings.length > 8 ? "；更多行已略去" : ""}
                    </div>
                  )}
                </div>
              )}
              <div style={{ display:"flex", justifyContent:"flex-end", gap:10, borderTop:`1px solid ${C.borderLight}`, paddingTop:16 }}>
                <button onClick={closeImportModal} style={sBtn(C.bg, C.muted)}>{importResult ? "关闭" : "取消"}</button>
                {!importResult && <button onClick={applyImport} disabled={importDraft.totalWords===0 || importApplying} style={sBtn(importDraft.totalWords&&!importApplying?C.primary:"#ccc", "#fff", {cursor:importDraft.totalWords&&!importApplying?"pointer":"not-allowed"})}>{importApplying ? "正在导入..." : "确认导入"}</button>}
              </div>
            </>
          )}
        </div>
      </Modal>
    </div>
  );
}

const rootElement = document.getElementById("root");
if (ReactDOM.createRoot) {
  ReactDOM.createRoot(rootElement).render(<App/>);
} else {
  ReactDOM.render(<App/>, rootElement);
}
</script>
</body>
</html>
