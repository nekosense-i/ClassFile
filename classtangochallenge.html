                  <h1 style={{ fontSize: "clamp(18px, 2.8vh, 26px)", fontWeight: 900, color: "var(--text)", margin: "clamp(4px, 0.8vh, 6px) 0 2px", lineHeight: 1.2, textAlign: "center" }}>
                    {gameWords[wordIndex].data.meaning}
                  </h1>

                  {/* 对应汉字骨架提示 */}
                  {gameWords[wordIndex].data.kanji && gameWords[wordIndex].data.kanji !== gameWords[wordIndex].data.kana && (
                    <div style={{ fontSize: "clamp(11px, 1.5vh, 13px)", color: "var(--muted)", background: "#F1F5F9", padding: "2px 10px", borderRadius: 8, marginTop: 2, display: "inline-block" }}>
                      🏛️ 对应汉字：<strong style={{ color: "var(--text)", fontSize: "clamp(12px, 1.8vh, 15px)" }}>{gameWords[wordIndex].data.kanji}</strong>
                    </div>
                  )}
                </div>

                {/* 沉浸控制台：拟物立体卡槽 + 5列大键帽假名池 */}
                <div className="stage2-right-box" style={{ width: "100%", display: "flex", flexDirection: "column", alignItems: "center", flexShrink: 0, paddingTop: 2 }}>
                  {/* 拟物立体卡槽 */}
                  <div style={{ display: "flex", justifyContent: "center", minHeight: "clamp(42px, 5.8vh, 52px)", marginBottom: "clamp(8px, 1.5vh, 14px)" }}>
                    {Array.from({ length: targetSpell.length }).map((_, i) => {
                      const c = currentSpell[i] || "";
                      const isSmall = isSmallKana(c);
                      return (
                        <div
                          key={i}
                          onClick={() => c && handleUndoSpell(i)}
                          className={`furi-char stage2-slot-char ${c ? "filled" : ""}`}
                          style={{
                            width: "clamp(40px, 9.5vw, 48px)",
                            height: "clamp(46px, 6vh, 54px)",
                            margin: "0 3px",
                            display: "flex",
                            alignItems: "center",
                            justifyContent: "center"
                          }}
                        >
                          <span style={{
                            fontSize: isSmall ? "clamp(20px, 4.4vw, 25px)" : "clamp(22px, 4.8vw, 28px)",
                            fontWeight: 900,
                            lineHeight: 1
                          }}>
                            {c}
                          </span>
                        </div>
                      );
                    })}
                  </div>

                  {/* 5列 1:1 圆角方形大按键假名池 */}
                  <div className="stage2-keyboard-grid" style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: "clamp(6px, 1.8vw, 10px)", width: "100%", maxWidth: 380 }}>
                    {spellPool.map((c, idx) => {
                      const isSmall = isSmallKana(c);
                      return (
                        <div
                          key={idx}
                          onClick={() => handleSpellClick(c)}
                          className="kana-block stage2-kana-btn"
                          style={{
                            display: "flex",
                            alignItems: "center",
                            justifyContent: "center",
                            minWidth: 0,
                            padding: 0
                          }}
                        >
                          <span style={{
                            fontSize: isSmall ? "clamp(21px, 4.8vw, 27px)" : "clamp(23px, 5.2vw, 30px)",
                            fontWeight: 900,
                            lineHeight: 1
                          }}>
                            {c}
                          </span>
                        </div>
                      );
                    })}
                  </div>

                  {/* 辅助交互提示 */}
                  <div style={{ fontSize: "clamp(11px, 1.5vh, 13px)", color: "var(--muted)", marginTop: 6, textAlign: "center" }}>
                    💡 轻触卡槽可撤销 · 支持实体键盘输入
                  </div>
                </div>

              </div>
            )}

          </div>

          {/* ===== 第 1 小关通关极简过渡弹层 ===== */}
          {stageTransition && (
            <div className="error-compare-overlay" style={{ zIndex: 9999 }}>
              <div className="error-compare-card" style={{ border: "2px solid var(--green)", maxWidth: 320, padding: "24px 18px" }}>
                <div style={{ fontSize: 44, marginBottom: 6 }}>🎉</div>
                <div style={{ fontSize: 20, fontWeight: 900, color: "var(--green)", marginBottom: 12 }}>
                  第 1 关通关！
                </div>

                <div style={{
                  background: "var(--green-light)",
                  borderRadius: 12,
                  padding: "10px 14px",
                  fontSize: 14,
                  color: "#1D6F44",
                  fontWeight: 800,
                  marginBottom: 20
                }}>
                  ⚡ 第 1 关斩获：<span style={{ fontSize: 16, fontWeight: 900 }}>{score}</span> 分<br />
                  <span style={{ fontSize: 12, color: "var(--muted)", fontWeight: 700 }}>首答做对：{sessionRef.current.stage1Correct} / {sessionRef.current.stage1Total}</span>
                </div>

                <button
                  onClick={startStage2Challenge}
                  style={{
                    background: "var(--primary)",
                    color: "#fff",
                    border: "none",
                    padding: "13px 20px",
                    borderRadius: 20,
                    fontWeight: 900,
                    fontSize: 15,
                    cursor: "pointer",
                    width: "100%",
                    boxShadow: "0 4px 14px rgba(200,64,45,0.28)"
                  }}
                >
                  进入第 2 关：看义拼词 ▶
                </button>
              </div>
            </div>
          )}

          {/* 答错即时对比解析卡弹层 */}
          {errorFeedback && (
            <div className="error-compare-overlay" onClick={handleDismissErrorFeedback}>
              <div className="error-compare-card" onClick={e => e.stopPropagation()} style={{ padding: "clamp(18px, 3vh, 26px) clamp(16px, 3vw, 24px)" }}>
                {/* 顶部标题区 */}
                <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 8 }}>
                  <span style={{ fontSize: "clamp(24px, 4vh, 30px)" }}>💔</span>
                  <span style={{ fontSize: "clamp(17px, 2.6vh, 21px)", fontWeight: 900, color: "var(--wrong)" }}>
                    答题失误
                  </span>
                </div>

                {/* 惩罚与规则标签 */}
                <div style={{
                  fontSize: 12,
                  fontWeight: 800,
                  color: "#B91C1C",
                  background: "#FEE2E2",
                  border: "1px solid #FECACA",
                  padding: "4px 14px",
                  borderRadius: 20,
                  display: "inline-block",
                  marginBottom: 14
                }}>
                  ⚡ 扣除 4 分 · 错题已加入后置重测
                </div>

                {/* 核心单词大字展示卡 */}
                <div style={{
                  background: "var(--bg)",
                  border: "1px solid var(--border)",
                  borderRadius: 16,
                  padding: "12px 14px",
                  marginBottom: 14,
                  display: "flex",
                  flexDirection: "column",
                  alignItems: "center"
                }}>
                  {errorFeedback.word?.imageUrl && (
                    <div style={{
                      height: "clamp(60px, 12vh, 90px)",
                      width: "100%",
                      maxWidth: 160,
                      background: "#fff",
                      borderRadius: 10,
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      padding: 4,
                      marginBottom: 8,
                      overflow: "hidden"
                    }}>
                      <img
                        src={errorFeedback.word.imageUrl}
                        alt="插画"
                        style={{ maxHeight: "100%", maxWidth: "100%", objectFit: "contain" }}
                      />
                    </div>
                  )}

                  {/* 汉字/假名大字展示 */}
                  <div style={{ fontSize: "clamp(20px, 3.5vh, 26px)", fontWeight: 900, color: "var(--text)", lineHeight: 1.2, letterSpacing: "0.5px" }}>
                    {errorFeedback.word?.kanji || errorFeedback.word?.kana}
                  </div>

                  {/* 假名读音 (如果有汉字) */}
                  {errorFeedback.word?.kanji && errorFeedback.word.kanji !== errorFeedback.word.kana && (
                    <div style={{ fontSize: "clamp(13px, 2vh, 16px)", color: "var(--blue)", fontWeight: 800, marginTop: 3 }}>
                      【{errorFeedback.word.kana}】
                    </div>
                  )}

                  {/* 释义 */}
                  <div style={{ fontSize: "clamp(14px, 2.2vh, 17px)", fontWeight: 800, color: "#1D6F44", marginTop: 4 }}>
                    🀄️ {errorFeedback.word?.meaning}
                  </div>
                </div>

                {/* 正误对比双色卡 */}
                <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 18, textAlign: "left" }}>
                  {/* 你的选择 */}
                  <div style={{
                    background: "#FEF2F2",
                    border: "1.5px solid #FECACA",
                    borderRadius: 12,
                    padding: "9px 14px",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "space-between"
                  }}>
                    <span style={{ fontSize: 13, color: "#991B1B", fontWeight: 700, flexShrink: 0 }}>
                      ❌ 你的选择
                    </span>
                    <span style={{ fontSize: "clamp(14px, 2vh, 16px)", color: "#DC2626", fontWeight: 900, textAlign: "right", marginLeft: 8 }}>
                      {errorFeedback.userChoice || "（未作答）"}
                    </span>
                  </div>

                  {/* 正确答案 */}
                  <div style={{
                    background: "#F0FDF4",
                    border: "1.5px solid #86EFAC",
                    borderRadius: 12,
                    padding: "9px 14px",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "space-between"
                  }}>
                    <span style={{ fontSize: 13, color: "#166534", fontWeight: 700, flexShrink: 0 }}>
                      ✅ 正确答案
                    </span>
                    <span style={{ fontSize: "clamp(15px, 2.2vh, 18px)", color: "var(--green)", fontWeight: 900, textAlign: "right", marginLeft: 8 }}>
                      {errorFeedback.correctChoice}
                    </span>
                  </div>
                </div>

                {/* 确认继续按钮 */}
                <button
                  onClick={handleDismissErrorFeedback}
                  style={{
                    background: "var(--primary)",
                    color: "#fff",
                    border: "none",
                    padding: "12px 0",
                    borderRadius: 24,
                    fontWeight: 900,
                    fontSize: 15,
                    cursor: "pointer",
                    width: "100%",
                    boxShadow: "0 4px 12px rgba(200,64,45,0.25)"
                  }}
                >
                  我知道了，继续挑战 ▶
                </button>
              </div>
            </div>
          )}

          {/* 闯关中途退出二次确认弹层 */}
          {showExitConfirm && (
            <div className="error-compare-overlay" style={{ zIndex: 9999 }} onClick={() => setShowExitConfirm(false)}>
              <div className="error-compare-card" onClick={e => e.stopPropagation()} style={{ border: "1.5px solid var(--border)", maxWidth: 340 }}>
                <div style={{ fontSize: 36, marginBottom: 8 }}>🚪</div>
                <div style={{ fontSize: 16, fontWeight: 800, color: "var(--text)", marginBottom: 8 }}>
                  确定要退出本次闯关吗？
                </div>
                <div style={{ fontSize: 13, color: "var(--muted)", lineHeight: 1.6, marginBottom: 20 }}>
                  当前关卡的答题进度和积分将<strong>不会保存</strong>。<br />建议坚持完成本轮挑战哦！
                </div>
                <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
                  <button
                    onClick={() => {
                      soundEffects.click();
                      setShowExitConfirm(false);
                    }}
                    style={{
                      flex: 1,
                      background: "var(--primary)",
                      color: "#fff",
                      border: "none",
                      padding: "11px 0",
                      borderRadius: 20,
                      fontWeight: 800,
                      fontSize: 13,
                      cursor: "pointer",
                      boxShadow: "0 3px 10px rgba(200,64,45,0.25)"
                    }}
                  >
                    继续挑战
                  </button>
                  <button
                    onClick={() => {
                      soundEffects.click();
                      setShowExitConfirm(false);
                      handleExitToLobby();
                    }}
                    style={{
                      flex: 1,
                      background: "#FEF2F2",
                      border: "1.5px solid #FECACA",
                      color: "#DC2626",
                      padding: "11px 0",
                      borderRadius: 20,
                      fontWeight: 800,
                      fontSize: 13,
                      cursor: "pointer"
                    }}
                  >
                    确认退出
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      )}

      {/* ===== 视图 7：关卡结算（纯现代几何战报大卡 · 0 Emoji · 顶级高级质感） ===== */}
      {view === "result" && (() => {
        const isPassed = !!resultSummary?.isPassed;
        const medal = resultSummary?.medal || "unpassed";
        const isGold = medal === "gold";
        const isSilver = medal === "silver";
        const finalScoreVal = resultSummary?.score || score;
        const firstTryPct = Math.round((resultSummary?.firstTryRate || 0) * 100);
        const stage1Corr = sessionRef.current.stage1Correct || 0;
        const stage1Tot = sessionRef.current.stage1Total || (studyWords.length || 10);
        const stage2Corr = sessionRef.current.stage2Correct || 0;
        const stage2Tot = sessionRef.current.stage2Total || (studyWords.length || 10);

        // 计算两小关各自的正确率与动态色彩方案
        const rate1 = stage1Tot > 0 ? (stage1Corr / stage1Tot) : 1;
        const chip1Style = rate1 >= 1
          ? { bg: "#F0FDF4", border: "#DCFCE7", num: "#059669", label: "#16A34A" }
          : rate1 >= 0.8
          ? { bg: "#FFFBEB", border: "#FEF3C7", num: "#D97706", label: "#B45309" }
          : { bg: "#FEF2F2", border: "#FEE2E2", num: "#DC2626", label: "#B91C1C" };

        const rate2 = stage2Tot > 0 ? (stage2Corr / stage2Tot) : 1;
        const chip2Style = rate2 >= 1
          ? { bg: "#F0FDF4", border: "#DCFCE7", num: "#059669", label: "#16A34A" }
          : rate2 >= 0.8
          ? { bg: "#FFFBEB", border: "#FEF3C7", num: "#D97706", label: "#B45309" }
          : { bg: "#FEF2F2", border: "#FEE2E2", num: "#DC2626", label: "#B91C1C" };

        const chip3Style = firstTryPct >= 90
          ? { bg: "#F0FDF4", border: "#DCFCE7", num: "#059669", label: "#16A34A" }
          : firstTryPct >= 80
          ? { bg: "#FFFBEB", border: "#FEF3C7", num: "#D97706", label: "#B45309" }
          : { bg: "#FEF2F2", border: "#FEE2E2", num: "#DC2626", label: "#B91C1C" };

        return (
          <div style={{
            flex: 1,
            display: "flex",
            flexDirection: "column",
            justifyContent: "center",
            alignItems: "center",
            padding: "clamp(8px, 1.8vh, 16px) 16px",
            overflowY: "auto",
            width: "100%",
            boxSizing: "border-box"
          }}>
            <div className="victory-container">
              {/* 一体化白玉荣耀战报大卡 */}
              <div className="victory-card">

                {/* 1. 顶部纯几何发光徽标 */}
                <div className="victory-emblem-wrap" style={{ width: 72, height: 72, marginBottom: 8 }}>
                  <div className={`victory-emblem-glow ${isGold ? "" : isPassed ? "green" : "red"}`} />
                  <div
                    className="victory-emblem-circle"
                    style={{
                      width: 64,
                      height: 64,
                      background: isGold
                        ? "linear-gradient(135deg, #F59E0B 0%, #D97706 100%)"
                        : isPassed
                        ? "linear-gradient(135deg, #10B981 0%, #059669 100%)"
                        : "linear-gradient(135deg, #F87171 0%, #DC2626 100%)"
                    }}
                  >
                    {isPassed ? (
                      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round">
                        <polyline points="20 6 9 17 4 12" />
                      </svg>
                    ) : (
                      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
                      </svg>
                    )}
                  </div>
                </div>

                {/* 2. 几何星级评定行（阶梯依次点亮） */}
                {isPassed && (
                  <div className="star-rating-row" style={{ marginBottom: 4 }}>
                    {[1, 2, 3].map(starNum => {
                      const filled = isGold ? true : (isSilver ? starNum <= 2 : starNum === 1);
                      return (
                        <span key={starNum} className="star-item">
                          <svg width="20" height="20" viewBox="0 0 24 24" fill={filled ? "#F59E0B" : "#E2E8F0"}>
                            <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" />
                          </svg>
                        </span>
                      );
                    })}
                  </div>
                )}

                {/* 3. 主标题与达标段位 */}
                <h2 style={{
                  fontSize: "clamp(17px, 2.4vh, 20px)",
                  fontWeight: 900,
                  color: isPassed ? "var(--text)" : "#DC2626",
                  margin: "0 0 2px",
                  letterSpacing: -0.3
                }}>
                  {isPassed
                    ? (isGold ? "本关挑战完美通关" : isSilver ? "本关挑战熟练达标" : "本关挑战顺利通关")
                    : "本关未达标，需重新挑战"}
                </h2>

                {/* 4. 超大分数字段（Hero Metric） */}
                <div style={{
                  fontSize: "clamp(44px, 7.5vh, 54px)",
                  fontWeight: 900,
                  lineHeight: 1.05,
                  margin: "6px 0 4px",
                  fontVariantNumeric: "tabular-nums",
                  letterSpacing: -1.5,
                  color: isPassed ? (isGold ? "#D97706" : "#059669") : "#DC2626"
                }}>
                  {finalScoreVal}
                  <span style={{ fontSize: "clamp(14px, 2vh, 16px)", fontWeight: 700, marginLeft: 3, letterSpacing: 0, opacity: 0.85 }}>分</span>
                </div>

                {/* 5. 达标要求胶囊微标 */}
                <div style={{
                  fontSize: 11,
                  fontWeight: 800,
                  padding: "2px 10px",
                  borderRadius: 999,
                  marginBottom: 4,
                  background: isPassed ? "#ECFDF5" : "#FEF2F2",
                  color: isPassed ? "#059669" : "#DC2626",
                  border: `1px solid ${isPassed ? "#A7F3D0" : "#FECACA"}`
                }}>
                  {isPassed
                    ? `达成 ${resultSummary?.studentTag || ""} 级达标线 (≥${resultSummary?.requiredPassingScore || 80}分)`
                    : `距 ${resultSummary?.studentTag || ""} 级达标线 (${resultSummary?.requiredPassingScore || 80}分) 还差 ${resultSummary?.scoreDiff || 0} 分`}
                </div>

                {/* 6. 等宽 3 宫格按正确率动态着色数据芯片 */}
                <div className="metric-chips-grid" style={{ margin: "12px 0 4px" }}>
                  <div className="metric-chip" style={{ background: chip1Style.bg, borderColor: chip1Style.border }}>
                    <div style={{ fontSize: "clamp(14px, 2.1vh, 16px)", fontWeight: 900, color: chip1Style.num, fontVariantNumeric: "tabular-nums" }}>
                      {stage1Corr} <span style={{ fontSize: 11, opacity: 0.65, fontWeight: 700 }}>/ {stage1Tot}</span>
                    </div>
                    <div style={{ fontSize: 10, color: chip1Style.label, fontWeight: 700, marginTop: 2 }}>假名识义</div>
                  </div>

                  <div className="metric-chip" style={{ background: chip2Style.bg, borderColor: chip2Style.border }}>
                    <div style={{ fontSize: "clamp(14px, 2.1vh, 16px)", fontWeight: 900, color: chip2Style.num, fontVariantNumeric: "tabular-nums" }}>
                      {stage2Corr} <span style={{ fontSize: 11, opacity: 0.65, fontWeight: 700 }}>/ {stage2Tot}</span>
                    </div>
                    <div style={{ fontSize: 10, color: chip2Style.label, fontWeight: 700, marginTop: 2 }}>看义拼词</div>
                  </div>

                  <div className="metric-chip" style={{ background: chip3Style.bg, borderColor: chip3Style.border }}>
                    <div style={{ fontSize: "clamp(14px, 2.1vh, 16px)", fontWeight: 900, color: chip3Style.num, fontVariantNumeric: "tabular-nums" }}>
                      {firstTryPct}%
                    </div>
                    <div style={{ fontSize: 10, color: chip3Style.label, fontWeight: 700, marginTop: 2 }}>首答正确率</div>
                  </div>
                </div>

                {/* 7. 错词强化速记抽屉（纯净极简列表） */}
                {!isPassed && resultSummary?.mistakeWords?.length > 0 && (
                  <div style={{
                    width: "100%",
                    background: "#FFFBEB",
                    border: "1px solid #FDE68A",
                    borderRadius: 14,
                    padding: "10px 12px",
                    margin: "6px 0 6px",
                    boxSizing: "border-box",
                    textAlign: "left"
                  }}>
                    <div style={{ fontSize: 11, fontWeight: 800, color: "#B45309", marginBottom: 6 }}>
                      本关失误单词快速复盘（轻触发音）：
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 5, maxHeight: 110, overflowY: "auto" }}>
                      {resultSummary.mistakeWords.map((w, idx) => (
                        <div
                          key={idx}
                          onClick={() => playWordAudio(w)}
                          style={{
                            background: "#FFFFFF",
                            border: "1px solid #FEE3A2",
                            borderRadius: 8,
                            padding: "6px 10px",
                            display: "flex",
                            justifyContent: "space-between",
                            alignItems: "center",
                            cursor: "pointer"
                          }}
                        >
                          <div style={{ minWidth: 0, paddingRight: 6 }}>
                            <span style={{ color: "var(--text)", fontSize: 12, fontWeight: 800 }}>
                              {w.kanji ? `${w.kanji}【${w.kana}】` : w.kana}
                            </span>
                            <span style={{ color: "var(--muted)", fontSize: 11, marginLeft: 6 }}>
                              {w.meaning}
                            </span>
                          </div>
                          <span className="audio-play-pill" title="朗读发音">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" />
                            </svg>
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

              </div>

              {/* 8. 底部单主操作按钮（与上方战报卡片严格等宽） */}
              <div style={{
                width: "100%",
                marginTop: 14,
                boxSizing: "border-box"
              }}>
                <button
                  onClick={handleExitToLobby}
                  style={{
                    width: "100%",
                    background: isPassed ? "var(--primary)" : "#DC2626",
                    color: "#FFFFFF",
                    border: "none",
                    padding: "14px 0",
                    borderRadius: 18,
                    fontSize: 15,
                    fontWeight: 900,
                    cursor: "pointer",
                    boxShadow: isPassed
                      ? "0 6px 18px rgba(200,64,45,0.28)"
                      : "0 6px 18px rgba(220,38,38,0.28)",
                    transition: "all 0.15s ease",
                    letterSpacing: 0.5
                  }}
                >
                  {isPassed ? "返回关卡大厅" : "返回路线图"}
                </button>
              </div>

            </div>
          </div>
        );
      })()}

    </div>
  );
}

const rootElement = document.getElementById("root");
if (ReactDOM.createRoot) {
  ReactDOM.createRoot(rootElement).render(<App/>);
} else {
  ReactDOM.render(<App/>, rootElement);
}
</script>
</body>
</html>
